<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>illust 總覽</title>
<style>html,body{margin:0;background:#f5efe6}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// 插畫庫總覽：所有姿勢 × 表情、所有道具。截圖：見 tests/test_illust.mjs 開頭註解。
import { PALETTE, person, prop, POSE_NAMES, FACE_NAMES, PROP_NAMES } from './illust.mjs';
const g = document.getElementById('c').getContext('2d');
const BLUE = '#6F8FB0';   // 呼叫端自帶的政黨色示範
const L = (s, x, y, px = 26, col = '#8c7b6b') => { g.font = `600 ${px}px "PingFang TC"`; g.textAlign = 'center'; g.fillStyle = col; g.fillText(s, x, y); };
await document.fonts.load('600 26px "PingFang TC"', '姿勢表情道具總覽' + PROP_NAMES.join('') + POSE_NAMES.join(''));
g.fillStyle = PALETTE.cream; g.fillRect(0, 0, 1080, 1920);
L('illust 總覽', 540, 70, 40, PALETTE.ink);
// 姿勢 × 表情：6 欄 × 3 列
const bodies = [PALETTE.coat, PALETTE.terra, PALETTE.sage, PALETTE.mustard, BLUE, PALETTE.coat];
POSE_NAMES.forEach((p, i) => {
  const x = 100 + i * 176;
  L(p, x, 130);
  FACE_NAMES.forEach((f, j) => person(g, { x, y: 380 + j * 280, s: 230, body: bodies[i], pose: p, face: f, t: 0.15, dir: p === 'point' && j === 2 ? -1 : 1 }));
});
FACE_NAMES.forEach((f, j) => { g.save(); g.translate(22, 260 + j * 280); g.rotate(-Math.PI / 2); L(f, 0, 0, 22); g.restore(); });
// walk 四個相位
[0, 0.15, 0.3, 0.45].forEach((t, k) => person(g, { x: 640 + k * 110, y: 1180, s: 150, body: PALETTE.terra, pose: 'walk', t }));
L('walk t=0／0.15／0.3／0.45', 805, 1220, 22);
// 道具：5 欄 × 2 列
const props = [
  ['document', { s: 150, title: '研究' }], ['phone', { s: 130, rows: 3, hl: 1 }],
  ['card', { w: 170, h: 130, content: (c, w, h) => { c.fillStyle = PALETTE.soft; c.fillRect(20, 20, w - 40, h - 40); } }],
  ['bulb', { s: 150 }], ['flag', { s: 170, color: PALETTE.sage, label: '自己', t: 0.3 }],
  ['house', { s: 160 }], ['speech', { s: 150, text: '溫和' }], ['balance', { s: 170, tilt: 0.12, leftColor: PALETTE.sage, rightColor: BLUE }],
  ['megaphone', { s: 140, t: 0.4 }], ['question', { s: 120 }],
];
props.forEach(([n, o], i) => {
  const x = 120 + (i % 5) * 210, y = 1400 + Math.floor(i / 5) * 280;
  const ground = n === 'flag' || n === 'house' || n === 'balance';
  prop(g, n, { ...o, x, y: ground ? y + 70 : y });
  L(n, x, y + 120);
});
person(g, { x: 180, y: 1180, s: 150, pose: 'shrug', face: 'worried', body: PALETTE.mute });
person(g, { x: 330, y: 1180, s: 150, pose: 'armsUp', face: 'smile', body: PALETTE.mustard, shadow: false });
L('shadow:false', 330, 1220, 22);
window.READY = true;
</script>
</body>
</html>
