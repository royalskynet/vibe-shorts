// 單人旁白科普：一句一卡（TREATMENT.md 分鏡表），Clawd Bot 當主播站右上。版面、換卡、字幕照 films/pedestrian-hell 第三版。

import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix, rgba } = G;

const BG = '#1d1b19', BG2 = '#262320', CREAM = '#f5efe6', DIM = '#a39a8e', OR = '#d97757', ORL = '#f29172', GOLD = '#f6b966', RED = '#ff8577', GREEN = '#68e399', BLUE = '#7fa7d9';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`, MONO = (px, w = 500) => `${w} ${px}px Menlo, "PingFang TC"`;

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。

// ---------- 字 ----------
let TXT = [], NOW = 0;
function say(s, x, y, px, col, p, o = {}) {
  const font = o.mono ? MONO(px) : ZH(o.w || 600, px);
  // 原地淡入，不往上滑（使用者 10-30：頻繁滑入眼睛不舒服；對標 @boundless__explorer DemDuhNk1ZR 全片無滑入）
  g.save(); g.font = font; g.letterSpacing = o.ls || '0px'; g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y); g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = o.mono ? MONO(px, o.w || 500) : ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.letterSpacing = o.ls || '0px'; g.fillStyle = col; g.fillText(s, x, y); g.letterSpacing = '0px';
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));   // 不用回彈（語氣溫和）
const loop = (x, n) => ((x % n) + n) % n;
function fade(a, fn) { if (a <= 0) return; g.save(); g.globalAlpha *= clamp(a); fn(); g.restore(); }

// ---------- 舞台：y 800–1630 的圓角框，框內畫什麼都裁在裡面 ----------
const ST = { x: 60, y: 800, w: 960, h: 830 };
function stage(fn) {
  g.save(); g.beginPath(); g.roundRect(ST.x, ST.y, ST.w, ST.h, 28); g.clip();
  g.fillStyle = BG2; g.fillRect(ST.x, ST.y, ST.w, ST.h);
  fn(); g.restore();
  g.strokeStyle = rgba(CREAM, 0.16); g.lineWidth = 2; g.beginPath(); g.roundRect(ST.x, ST.y, ST.w, ST.h, 28); g.stroke();
}
function cam(px, py, k, fn) { g.save(); g.translate(px, py); g.scale(k, k); g.translate(-px, -py); fn(); g.restore(); }
const FLOOR = 1520;
function floor() { g.fillStyle = '#2c2926'; g.fillRect(ST.x, FLOOR, ST.w, ST.y + ST.h - FLOOR); }

// ---------- 圖示 ----------
function baby(x, y, s, col = GOLD) {   // 包巾寶寶：原點＝中心，s＝身長
  g.fillStyle = col; g.beginPath(); g.roundRect(x - s * 0.2, y - s * 0.18, s * 0.62, s * 0.36, s * 0.18); g.fill();
  G.disc(g, x - s * 0.3, y, s * 0.2, mix(col, CREAM, 0.45));
}
function crib(x, y, s, col = CREAM, full = 0, a = 1) {   // 嬰兒床：原點＝床腳中央，s＝床寬；full 0–1 寶寶出現
  g.save(); g.globalAlpha *= a;
  const h = s * 0.6;
  if (full > 0) { g.save(); g.globalAlpha *= clamp(full); baby(x - s * 0.04, y - h * 0.42, s * 0.62); g.restore(); }
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = Math.max(2, s * 0.055);
  g.beginPath();
  g.moveTo(x - s / 2, y); g.lineTo(x - s / 2, y - h); g.moveTo(x + s / 2, y); g.lineTo(x + s / 2, y - h);
  g.moveTo(x - s / 2, y - h * 0.18); g.lineTo(x + s / 2, y - h * 0.18); g.moveTo(x - s / 2, y - h * 0.82); g.lineTo(x + s / 2, y - h * 0.82);
  g.stroke();
  g.lineWidth = Math.max(1.5, s * 0.03); g.beginPath();
  for (let k = 1; k < 6; k++) { const xx = x - s / 2 + s * k / 6; g.moveTo(xx, y - h * 0.18); g.lineTo(xx, y - h * 0.82); }
  g.stroke(); g.restore();
}
function person(x, y, s, col, o = {}) {   // 側視人形：原點＝腳底，s＝身高；o.cane 拐杖、o.bag 包包、o.ph 走路相位、o.still 站著
  const ph = o.still ? 0 : (o.ph ?? (NOW * 3 + x * 0.01));
  y -= o.still ? 0 : s * 0.012 * Math.abs(Math.sin(ph));
  g.save(); g.translate(x, y); g.rotate(o.cane ? 0.12 : 0);
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = s * 0.1;
  const sw = o.still ? 0.12 : Math.sin(ph) * 0.35;
  g.beginPath(); g.moveTo(0, -s * 0.42); g.lineTo(Math.sin(sw) * s * 0.42, 0); g.moveTo(0, -s * 0.42); g.lineTo(-Math.sin(sw) * s * 0.42, 0); g.stroke();
  g.fillStyle = col; g.beginPath(); g.roundRect(-s * 0.15, -s * 0.78, s * 0.3, s * 0.42, s * 0.1); g.fill();
  G.disc(g, 0, -s * 0.88, s * 0.11, col);
  if (o.bag) { g.fillStyle = o.bag; g.beginPath(); g.roundRect(-s * 0.3, -s * 0.74, s * 0.17, s * 0.28, s * 0.05); g.fill(); }
  g.restore();
  if (o.cane) G.seg(g, [x + s * 0.24, y - s * 0.5], [x + s * 0.3, y], s * 0.035, GOLD);
}
function ghost(x, y, s, a = 1, col = CREAM) {   // 還沒找到的人：虛線人形，原點＝腳底
  g.save(); g.globalAlpha *= a; g.setLineDash([s * 0.055, s * 0.045]); g.strokeStyle = rgba(col, 0.75); g.lineWidth = Math.max(2, s * 0.025);
  g.beginPath(); g.roundRect(x - s * 0.17, y - s * 0.78, s * 0.34, s * 0.78, s * 0.12); g.stroke();
  g.beginPath(); g.arc(x, y - s * 0.9, s * 0.11, 0, Math.PI * 2); g.stroke();
  g.setLineDash([]); g.restore();
}
function carer(x, y, s, k) {   // 虛線人形 → 實心托育人員（k 0–1）
  if (k < 1) ghost(x, y, s, 1 - k);
  if (k > 0) fade(k, () => person(x, y, s, GOLD, { still: true }));
}
function mini(x, y, s, col) {   // 小人頭像：格子計數用
  G.disc(g, x, y - s * 0.28, s * 0.2, col);
  g.fillStyle = col; g.beginPath(); g.roundRect(x - s * 0.28, y - s * 0.04, s * 0.56, s * 0.4, s * 0.18); g.fill();
}
function house(x, y, s, col = CREAM, door = BG) {   // 公托：屋頂＋門，原點＝底中央
  g.fillStyle = col; g.fillRect(x - s / 2, y - s * 0.5, s, s * 0.5);
  G.poly(g, [[x - s * 0.6, y - s * 0.48], [x, y - s * 0.92], [x + s * 0.6, y - s * 0.48]], col);
  g.fillStyle = door; g.fillRect(x - s * 0.1, y - s * 0.3, s * 0.2, s * 0.3);
}
function stroller(x, y, s, col = CREAM) {   // 嬰兒車：原點＝後輪著地
  g.strokeStyle = col; g.lineWidth = s * 0.06; g.lineCap = 'round';
  g.beginPath(); g.arc(x + s * 0.35, y - s * 0.55, s * 0.32, Math.PI, 0); g.closePath(); g.stroke();
  G.seg(g, [x, y - s * 0.55], [x - s * 0.18, y - s * 0.95], s * 0.06, col);
  G.ring(g, x + s * 0.08, y - s * 0.08, s * 0.08, s * 0.05, col); G.ring(g, x + s * 0.62, y - s * 0.08, s * 0.08, s * 0.05, col);
}
function chip(x, y, s, p = 1) {   // 兩種主張共用的標籤樣式（同色同大小）
  if (p <= 0) return;
  g.save(); g.globalAlpha *= clamp(p * 2);
  g.font = ZH(700, 46); const w = g.measureText(s).width + 56;
  g.fillStyle = rgba(BG, 0.82); g.strokeStyle = GOLD; g.lineWidth = 4;
  g.beginPath(); g.roundRect(x - w / 2, y - 50, w, 76, 38); g.fill(); g.stroke();
  plain(s, x, y + 2, 46, GOLD, { align: 'center', w: 700 });
  g.restore();
}
function counter(s, x, y, px = 72, col = CREAM, align = 'center') {
  plain(s, x, y, px, col, { mono: true, align, w: 700 });
}
function dots(x, y, w, cols, n, p, col, r, shown0 = 0) {   // n 個點逐一出現（p 0–1）
  const s = w / cols; r = r || s * 0.36;
  const shown = Math.max(shown0, Math.floor(n * clamp(p)));
  for (let i = 0; i < shown; i++) G.disc(g, x + (i % cols) * s + s / 2, y + Math.floor(i / cols) * s + s / 2, r, col);
  return Math.ceil(n / cols) * s;
}
function timeline(x, y, w, n, p, labels, col = GOLD) {   // n 格的時間軸，p 0–1 填滿
  g.fillStyle = rgba(CREAM, 0.14); g.beginPath(); g.roundRect(x, y, w, 46, 23); g.fill();
  if (p > 0) { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, Math.max(46, w * p), 46, 23); g.fill(); }
  for (let k = 0; k <= n; k++) {
    const xx = x + w * k / n; g.fillStyle = rgba(BG, 0.6); if (k && k < n) g.fillRect(xx - 2, y, 4, 46);
    if (labels && labels[k] != null) plain(String(labels[k]), xx, y + 100, 34, k / n <= p + 1e-6 ? CREAM : DIM, { mono: true, align: 'center' });
  }
}

// ---------- 地圖（手描示意，誤差約 10–30 公里；要精確改抓 Natural Earth 再投影） ----------
const TW = [[121.56,25.29],[121.93,25.02],[121.83,24.6],[121.62,24.05],[121.48,23.45],[121.3,22.95],[121.0,22.6],[120.86,22.08],[120.84,21.9],[120.72,21.98],[120.62,22.3],[120.3,22.55],[120.17,22.9],[120.1,23.3],[120.12,23.7],[120.3,24.1],[120.6,24.5],[120.85,24.83],[121.05,25.05],[121.3,25.15]];
const JP = [
  [[141.2,45.4],[142.0,45.5],[143.5,44.2],[145.3,43.4],[145.5,43.2],[143.3,42.0],[141.8,42.6],[140.4,41.4],[139.9,42.2],[140.3,43.3],[141.4,43.4]],
  [[140.9,41.5],[141.5,40.5],[142.0,39.5],[141.0,38.3],[141.0,37.0],[140.6,35.7],[140.0,35.0],[139.2,35.2],[138.5,34.6],[137.0,34.6],[136.8,34.3],[135.8,33.5],[135.1,34.3],[134.0,34.6],[132.5,34.2],[130.9,33.9],[131.4,34.4],[132.6,35.5],[134.5,35.6],[136.0,35.7],[136.7,37.2],[137.3,36.9],[138.5,37.4],[139.5,38.3],[139.9,39.8],[140.1,40.8]],
  [[130.9,33.9],[131.6,33.2],[131.5,32.2],[131.0,31.3],[130.2,31.3],[130.3,32.5],[129.7,33.1],[130.4,33.6]],
  [[132.6,33.9],[133.5,34.3],[134.6,34.2],[134.7,33.8],[133.5,33.4],[132.5,32.8]],
];
function land(poly, cx, cy, k, lo0, la0, fill = '#34302c') {
  g.beginPath();
  poly.forEach(([lo, la], i) => { const x = cx + (lo - lo0) * k * Math.cos(la0 * G.D2R), y = cy - (la - la0) * k; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.closePath(); g.fillStyle = fill; g.fill(); g.lineWidth = 5; g.strokeStyle = rgba(CREAM, 0.6); g.stroke();
}
const lonlat = (lo, la, cx, cy, k, lo0, la0) => [cx + (lo - lo0) * k * Math.cos(la0 * G.D2R), cy - (la - la0) * k];
function taiwan(cx, cy, k, fill) { land(TW, cx, cy, k, 121, 23.7, fill); }

// ---------- 每張卡的舞台 ----------
// —— 鉤子 ——
function lottery(lt, R = 250, cx = 540, cy = 1130) {   // 搖獎機：滾筒轉、裡面是寶寶球，每 3 秒掉出一顆
  const rot = lt * 1.3;
  g.fillStyle = rgba(CREAM, 0.06); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
  G.ring(g, cx, cy, R, 8, rgba(CREAM, 0.7));
  for (let k = 0; k < 6; k++) { const a = rot + k * Math.PI / 3; G.seg(g, [cx, cy], [cx + Math.cos(a) * R, cy + Math.sin(a) * R], 3, rgba(CREAM, 0.25)); }
  for (let i = 0; i < 14; i++) {   // 每顆球繞自己的半徑轉，角速度不同
    const rr = R * (0.3 + 0.55 * ((i * 0.37) % 1)), a = rot * (1 + (i % 3) * 0.35) + i * 2.1;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 0.9;
    G.disc(g, x, y, 30, i % 4 ? CREAM : GOLD); G.disc(g, x - 6, y - 4, 5, BG); G.disc(g, x + 8, y - 4, 5, BG);
  }
  g.fillStyle = CREAM; g.fillRect(cx - 40, cy + R - 6, 80, 70);   // 出球口
  const u = loop(lt, 3), d = E.io(inv(0.6, 1.6, u));
  if (u > 0.6) { const by = cy + R + 60 + d * 160; G.disc(g, cx, by, 34, GOLD); G.disc(g, cx - 7, by - 5, 5, BG); G.disc(g, cx + 9, by - 5, 5, BG); }
  G.seg(g, [cx - 120, FLOOR + 60], [cx + 120, FLOOR + 60], 6, rgba(CREAM, 0.3));
}
function hook(lt) { stage(() => lottery(lt)); }
function fewSlots(lt) {   // 4 張床都滿了，一張虛線床慢慢長出來；左邊一排寶寶在等
  stage(() => {
    floor();
    for (let j = 0; j < 4; j++) crib(170 + j * 170, 1180, 140, CREAM, 1);
    const p = 0.15 + 0.25 * E.io(inv(0.3, 3.0, lt));   // 進度條爬得很慢
    g.save(); g.setLineDash([12, 10]); crib(850, 1180, 140, rgba(CREAM, 0.5), 0); g.restore();
    g.fillStyle = rgba(CREAM, 0.14); g.fillRect(780, 1215, 140, 16); g.fillStyle = GOLD; g.fillRect(780, 1215, 140 * p, 16);
    for (let j = 0; j < 9; j++) { const x = 140 + j * 92 + 6 * Math.sin(lt * 2 + j); baby(x, 1440, 80, j % 3 ? CREAM : GOLD); }
    plain('在等', 120, 1570, 34, DIM);
  });
}
const PER = 20;   // 排隊方陣每點 20 人
function queue(lt, ph) {   // 左：位子方陣；右：排隊方陣（ph 1 才長）
  stage(() => {
    const nS = Math.round(FACTS.TPE_PUBLIC_SLOTS / PER), nW = Math.round(FACTS.TPE_WAITLIST / PER);
    const pS = ph ? 1 : E.o2(inv(0.2, 2.2, lt)), pW = ph ? E.o2(inv(0.2, 1.6, lt)) : 0;
    plain('位子', 300, 880, 40, CREAM, { align: 'center' }); plain('排隊', 760, 880, 40, ph ? GOLD : DIM, { align: 'center' });
    dots(110, 910, 380, 12, nS, pS, CREAM);
    if (ph) dots(570, 910, 380, 12, nW, pW, GOLD);
    counter(fmt(FACTS.TPE_PUBLIC_SLOTS * pS), 300, 1590, 60);
    if (ph) counter(fmt(FACTS.TPE_WAITLIST * pW), 760, 1590, 60, GOLD);
    plain(`每點 ${PER} 人`, 960, 1460, 28, DIM, { mono: true, align: 'right' });
  });
}
// —— 機制 ——
function placePeople(lt) {   // 地方＋人：左邊公托蓋起來，右邊人形從虛線填滿
  stage(() => {
    floor();
    const a = pop(lt, 0.2, 0.7), b = E.io(inv(1.2, 2.2, lt));
    fade(a, () => { cam(300, FLOOR, lerp(0.85, 1, a), () => house(300, FLOOR, 300, CREAM)); });
    plain('＋', 540, 1360, 90, DIM, { align: 'center' });
    carer(780, FLOOR, 380, b);
    fade(a, () => plain('地方', 300, 1600, 40, CREAM, { align: 'center' }));
    fade(b, () => plain('人', 780, 1600, 40, GOLD, { align: 'center' }));
  });
}
function ratio(lt) {   // 一個托育人員，床一張張排上去：先 3 張，再第 4 張
  stage(() => {
    floor();
    person(230, FLOOR, 400, GOLD, { still: true });
    const pos = [[540, 1270], [790, 1270], [540, 1500], [790, 1500]];
    pos.forEach(([x, y], j) => { const k = pop(lt, 0.3 + j * 0.45, 0.4); if (k > 0) crib(x, y, 190, j < 3 ? CREAM : GOLD, k, k); });
    const n = lt < 0.3 + 3 * 0.45 ? FACTS.RATIO_LOW : FACTS.RATIO_HIGH;
    counter(`1 : ${n}`, 665, 920, 64, GOLD);
  });
}
function pay(lt) {   // 起薪長條長到 3.8 萬；底下 3–4 張床跟著亮
  stage(() => {
    const k = E.o3(inv(0.2, 1.4, lt)), max = 50000, w = 820 * FACTS.PAY_START_TWD / max * k;
    g.fillStyle = rgba(CREAM, 0.12); g.fillRect(130, 980, 820, 90);
    g.fillStyle = GOLD; g.fillRect(130, 980, w, 90);

  { ch: 4, head: '誰來顧', sub: '一起多關心', hud: '示意圖', draw: twGlow },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.25);
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };

// ---------- 背景：上方斜紋帶等速慢捲，讓每張卡都有連續動態 ----------
function band(t) {
  g.save(); g.beginPath(); g.rect(0, 0, W, 120); g.clip();
  g.fillStyle = BG2; g.fillRect(0, 0, W, 120);
  const off = (t * 40) % 80;
  for (let x = -160; x < W + 160; x += 80) G.poly(g, [[x + off, 0], [x + off + 40, 0], [x + off - 80, 120], [x + off - 120, 120]], rgba(OR, 0.35));
  g.restore();
}

// ---------- 字幕 ----------
function caption(t) {
  const L = TL.lines.find(l => t >= l.t0 - 0.1 && t < l.t1 + 0.2);
  if (!L) return;
  const s = L.text.replace(/[。！]$/, ''), px = 42, maxW = 1000;
  g.font = ZH(500, px);
  const fits = r => g.measureText(r).width <= maxW;
  // 在標點後斷行，貪婪裝滿一行；單段本身太長才逐字斷
  const segs = s.match(/[^，、；：]+[，、；：]?/g), rows = [];
  let cur = '';
  for (const sg of segs) {
    if (fits(cur + sg)) { cur += sg; continue; }
    if (cur) rows.push(cur);
    cur = '';
    for (const ch of sg) { if (!fits(cur + ch)) { rows.push(cur); cur = ''; } cur += ch; }
  }
  if (cur) rows.push(cur);
  const h = 50 + rows.length * 58;
  g.fillStyle = '#0f0e0d'; g.fillRect(0, 1880 - h, W, h);
  rows.forEach((r, j) => plain(r, W / 2, 1880 - h + 66 + j * 58, px, CREAM, { align: 'center', w: 500 }));
}

// ---------- 主持人 ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  // 嘴跟旁白開合；表情維持 idle
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：先畫上一張、存起來，再畫這一張，把上一張以漸弱透明度疊回去。
// 不滑入、不換底色、不插章名全屏卡（使用者 10-30；對標 DemDuhNk1ZR 66.9 秒 0 次硬切）。
const XF = 0.6;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = []; NOW = t;
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  band(t);
  plain('台北托育懶人包', 60, 186, 30, DIM, { mono: true, ls: '4px' });
  const ch = CH[cd.ch]; if (ch === undefined) throw new Error(`卡 ${i + 1} 沒有章名`);
  if (ch) plain(ch, 60, 246, 44, CREAM, { w: 600 });
  // 進度條按章分組，章與章之間空一格
  let gx = 60;
  for (let j = 0; j < N; j++) {
    if (j && CARDS[j].ch !== CARDS[j - 1].ch) gx += 14;
    g.fillStyle = j <= i ? OR : rgba(CREAM, 0.2); g.fillRect(gx, 276, 14, j === i ? 10 : 5); gx += 20;
  }
  // 大標＝這一段的主題，同主題連續幾張卡共用、不重播動畫（短句卡也讀得完）；副標＝這張卡的關鍵詞。
  // 第 0 卡第 0 幀就完整顯示（封面）。
  let gi = i; while (gi > 0 && CARDS[gi - 1].head === cd.head) gi--;
  const glt = t - T0[gi];
  const pin = i === 0 ? () => 1 : (a, b) => inv(a, b, lt);
  const big = cd.head.length > 6 ? 120 : cd.head.length > 4 ? 150 : 180, hy = 330 + big * 0.86 + 60;
  say(cd.head, 60, hy, big, CREAM, i === 0 ? 1 : inv(0.05, 0.6, glt), { id: 'head' + (gi + 1) });
  if (cd.sub) say(cd.sub, 64, hy + 110, 68, ORL, pin(0.15, 0.7), { id: 'sub' + (i + 1) });
  if (cd.tag) say(cd.tag, 64, hy + 190, 46, GOLD, pin(0.3, 0.85), { id: 'tag' + (i + 1) });
  plain(`來源｜${cd.hud}`, 60, 1690, 30, DIM, { mono: true });
  cd.draw(lt);
}
function finish(t) {
  caption(t);
  poseHost(t);
  const fade = t > DUR - 0.6 ? inv(DUR - 0.6, DUR, t) : 0;
  if (fade) { g.globalAlpha = fade; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.globalAlpha = 1 - fade; g.drawImage(img, 730, 60, 340, 340); g.globalAlpha = 1;
  });
}
let mascotTok = 0;

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = TL.lines.map(l => ({ t0: l.t0, t1: l.t1, text: l.text }));
window.SHAKES = [];
window.EV = (() => {
  const e = [{ t: 0, type: 'bed', len: DUR }];
  // 不加任何音效：換卡「登」一聲使用者 10-30 嫌吵拿掉，只留配樂
  return e.sort((a, b) => a.t - b.t);
})();
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字（卡片、標籤、圖表字），整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789';
await Promise.all([document.fonts.load(ZH(600, 180), allText), document.fonts.load(ZH(500, 42), allText), document.fonts.load(ZH(700, 46), allText), document.fonts.load(MONO(30), allText)]);
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
</body>
</html>
