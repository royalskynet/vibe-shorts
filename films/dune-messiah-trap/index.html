<!doctype html>
<html lang="zh-Hant">

<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#mascot{display:none}#mascot svg{width:340px;height:340px}</style>
<script src="engine.js"></script>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="mascot"></div>
<script type="module">
// 單人旁白科普，畫面照無邊探索（refs/boundless/ANALYSIS.md §3，使用者 11-03 採用）：
// 全片同一張米色底、不硬切；扁平小人＋四色；一句一個畫面狀態（CARDS），字幕一卡一個逗號短語（timeline.js 的 phrases）；
// 頂部系列標籤，片尾系列卡。米色插畫風、扁平風格，不要擬真。
// 使用者 11-04：小人與道具改用共用插畫庫 illust/illust.mjs（正本 assets/illust/，scripts/illust_install.sh 複製進來）；
// 只留封面大標：第 0 卡有大標，其餘卡只有系列標籤＋畫面＋字幕＋來源，畫面往上放大當主角（precheck「內頁大標」門）。
// 禁止清單（TREATMENT.md）：不畫 2026 候選人、不引 2026 民調、不畫政黨標誌。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
const SAGE = '#7FA57A', BLUE = '#6F8FB0', MUTE = '#B3A797', SOFT = '#EBE1D2', DIM = '#8C7B6B';
const BLUE_D = '#4F6F90', SAGE_D = '#557A51', MUST_D = '#9A6F1C';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '用腦袋看世界', EP = 1, HANDLE = '@paradoxbar';
const GY = 1270;   // 畫面地平線：小人腳底；字幕短橫線在 1308

// ---------- 事實數字來源（唯一來源），卡片裡所有阿拉伯數字一律寫 ${FACTS.X} 或由 FACTS 運算，不准裸寫 ----------
const FACTS = {
  Y_ESSAY: 1980,
  DEATH_TOLL: 61000000000,
  PLANETS_STERILIZED: 90,
};
const fmt = n => n.toLocaleString('en-US');

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });

// ---------- 40 人方陣：顏色照人數分配，換狀態時逐人換色；姿勢混搭 ----------
const PERM = (() => { const r = G.rng(11), a = [...Array(40).keys()]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const POSE_MIX = (() => { const r = G.rng(23); return Array.from({ length: 40 }, () => { const v = r(); return v < 0.62 ? ['stand', 1] : v < 0.72 ? ['armsUp', 1] : v < 0.82 ? ['think', 1] : v < 0.91 ? ['shrug', 1] : ['shrug', 1]; }); })();
function cols(spec) { const out = Array(40).fill(SOFT); let k = 0; for (const [c, n] of spec) for (let m = 0; m < n; m++) out[PERM[k++]] = c; return out; }
const C_IMPRESSION = cols([[BLUE, 26], [SAGE, 14]]);
const C_2018 = cols([[BLUE, 16], [SAGE, 11], [MUST, 13]]);
const C_SILENT = cols([[BLUE, 12], [SAGE, 9], [MUST, 7], [MUTE, 12]]);
function crowd(o) {
  const s = 120, nc = 8, dx = 116, dy = 146;
  const x0 = 540 - dx * (nc - 1) / 2 - dx * 0.25, y0 = o.y0;
  for (let k = 0; k < 40; k++) {
    const r = Math.floor(k / nc), c = k % nc;
    const x = x0 + c * dx + (r % 2 ? dx * 0.5 : 0), y = y0 + r * dy;
    const pk = o.from ? E.io(inv(0.1 + (k / 40) * 0.6, 0.5 + (k / 40) * 0.6, o.lt)) : 1;
    const col = o.from ? mix(o.from[k], o.to[k], pk) : o.to[k];
    const silent = o.q && o.to[k] === MUTE;
    const [pose, dir] = silent ? ['shrug', 1] : POSE_MIX[k];
    man(x, y, s, col, { pose, dir, face: silent && pk > 0.5 ? 'worried' : 'none' });
    if (silent) prop(g, 'question', { x: x + 4, y: y - s - 26 + Math.sin(o.lt * 2.5 + k) * 4, s: 26, color: DIM, alpha: pk });
  }
}

const CARDS = [
  { head: '沙丘其實在警告你', hud: '示意圖', hl: ['劇透'], draw: c0 },
  { head: '英雄故事', hud: '示意圖', hl: ['沙丘', '英雄'], draw: c1 },
  { head: '被放逐的王子', hud: '示意圖', hl: ['王子', '帝國'], draw: c2 },
  { head: '作者的警告', hud: `Dune Genesis ${FACTS.Y_ESSAY}`, hl: ['批判能力', '領袖'], draw: c3 },
  { head: '保羅的聖戰', hud: '示意圖', hl: ['保羅', '聖戰'], draw: c4 },
  { head: '六百一十億的代價', hud: '小說內統計', hl: ['六百一十億'], draw: c5 },
  { head: '九十個星球', hud: '小說內統計', hl: ['九十個', '星球'], draw: c6 },
  { head: '政治對稱', hud: '示意圖', hl: ['政治', '想法'], draw: c7 },
  { head: '自我認知', hud: '示意圖', hl: ['好人', '壞人'], draw: c8 },
  { head: '問題解決', hud: '示意圖', hl: ['贏', '問題'], draw: c9 },
  { head: '陣營對稱', hud: '示意圖', hl: ['陣營', '人'], draw: c10 },
  { head: '作者告誡', hud: `Dune Genesis ${FACTS.Y_ESSAY}`, hl: ['赫伯特', '領袖'], draw: c15 },
  { head: '判斷力外包', hud: '示意圖', hl: ['陣營', '判斷力'], draw: c16 },
  { head: '自由與決定', hud: '示意圖', hl: ['決定權', '生命'], draw: c17 },
];
const N = CARDS.length;
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾系列卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部系列標籤 ----------

// ---------- 長條：rows=[{name, val, col, tc, label}]，x0／w 是長條範圍 ----------
function bars(o) {
  const x0 = o.x0 ?? 120, w = o.w ?? 800, gap = o.gap ?? 200, bh = o.bh ?? 100;
  o.rows.forEach((r, j) => {
    const y = o.y + j * gap, pk = E.o3(inv(0.15 + j * 0.2, 1.1 + j * 0.2, o.lt));
    plain(r.name, x0, y - 20, 42, INK, { w: 600 });
    rr(x0, y, w, bh, 20, SOFT);
    rr(x0, y, Math.max(16, w * (r.val / o.max) * pk), bh, 20, r.col);
    g.globalAlpha = inv(0.5, 0.9, pk); plain(r.label, x0 + w, y - 20, 42, r.tc, { align: 'right', w: 800 }); g.globalAlpha = 1;
  });
}

// 白卡片放在米色底上，藏字檢查（textless_check）算不到畫面；要用卡片就加一圈有色外框
function framed(cx, cy, w, h, col, a = 1) {
  g.save(); g.globalAlpha *= a; rr(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36, 34, col); g.restore();
  prop(g, 'card', { x: cx, y: cy, w, h, alpha: a });
}

// ---------- 每張卡的畫面（畫在 y 500–1290；x≥875、y<480 是主播位置） ----------
const SAND = '#E8D5B0', SAND_D = '#D8BF93', GREY = '#CFC4B2';
const PT = (lt, a, d = 0.6) => E.o3(inv(a, a + d, lt));
function dunes() {
  g.save(); g.fillStyle = SAND; g.beginPath(); g.moveTo(0, GY + 20);
  g.bezierCurveTo(200, GY - 70, 360, GY - 55, 540, GY + 10); g.bezierCurveTo(720, GY - 55, 880, GY - 80, 1080, GY + 10);
  g.lineTo(1080, 1292); g.lineTo(0, 1292); g.closePath(); g.fill(); g.restore();
}
function crown(x, y, s, col = MUST) {
  g.save(); g.fillStyle = col; g.beginPath(); g.moveTo(x - s / 2, y); g.lineTo(x - s / 2, y - s * 0.45); g.lineTo(x - s / 4, y - s * 0.22);
  g.lineTo(x, y - s * 0.58); g.lineTo(x + s / 4, y - s * 0.22); g.lineTo(x + s / 2, y - s * 0.45); g.lineTo(x + s / 2, y); g.closePath(); g.fill();
  g.fillStyle = TERRA; for (const [dx, dy] of [[-0.5, -0.45], [0, -0.58], [0.5, -0.45]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, s * 0.07, 0, 7); g.fill(); }
  g.restore();
}
function gearBrain(x, y, r, rot = 0, col = TERRA) {
  g.save(); g.translate(x, y); g.fillStyle = col;
  for (let i = 0; i < 8; i++) { g.save(); g.rotate(rot + i * Math.PI / 4); g.beginPath(); g.roundRect(-r * 0.2, -r * 1.3, r * 0.4, r * 0.5, 4); g.fill(); g.restore(); }
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  g.fillStyle = CREAM; g.beginPath(); g.arc(0, 0, r * 0.42, 0, 7); g.fill();
  g.strokeStyle = col; g.lineWidth = r * 0.12; g.beginPath(); g.moveTo(-r * 0.2, 0); g.lineTo(r * 0.2, 0); g.moveTo(0, -r * 0.2); g.lineTo(0, r * 0.2); g.stroke();
  g.restore();
}
function pocketFigure(x, s, a = 1) {
  g.save(); g.globalAlpha *= a; man(x, GY, s, INK, { pose: 'stand', face: 'none', dir: -1 }); g.restore();
}

function c0(lt) {
  dunes();
  const p = PT(lt, 0, 0.5);
  g.save(); g.globalAlpha = 0.6 + 0.4 * p; g.fillStyle = MUST; g.beginPath();
  g.moveTo(540, 700); g.lineTo(760, 1080); g.lineTo(320, 1080); g.closePath(); g.fill();
  g.restore();
  const cd = lt - TL.lines[0].t1;   // 劇透句念完才開始倒數 3 秒
  if (cd >= 0) plain(String(Math.max(1, 3 - Math.floor(cd))), 540, 1050, 210, INK, { align: 'center', w: 800 });
  else { g.fillStyle = INK; g.beginPath(); g.roundRect(525, 800, 30, 160, 12); g.fill(); g.beginPath(); g.arc(540, 1020, 20, 0, 7); g.fill(); }
  man(200, GY, 330, TERRA, { pose: 'stand', face: 'worried' });
  man(880, GY, 300, COAT, { pose: 'stand', dir: -1, face: 'none' });
}
function c1(lt) {
  g.save(); g.fillStyle = MUST; g.globalAlpha = 0.5; g.beginPath(); g.arc(540, 830, 220, 0, 7); g.fill(); g.restore();
  g.save(); g.strokeStyle = MUST; g.globalAlpha = 0.5; g.lineWidth = 10; g.lineCap = 'round';
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 + lt * 0.2; g.beginPath(); g.moveTo(540 + Math.cos(a) * 235, 830 + Math.sin(a) * 235); g.lineTo(540 + Math.cos(a) * 290, 830 + Math.sin(a) * 290); g.stroke(); }
  g.restore();
  dunes(); rr(400, GY - 110, 280, 120, 18, MUTE);
  const p = 0.4 + 0.6 * PT(lt, 0.05, 0.6); g.save(); g.globalAlpha = p;
  man(540, GY - 110 + (1 - p) * 70, 340, TERRA, { pose: 'armsUp', face: 'smile' }); g.restore();
}
function c2(lt) {
  dunes();
  const tp = PT(lt, 0.3, 1.2);
  g.save(); g.translate(880, GY); g.rotate(tp * 1.15); rr(-130, -430, 130, 430, 12, INK);
  for (let k = 0; k < 4; k++) rr(-100, -380 + k * 90, 70, 40, 8, CREAM); g.restore();
  for (let k = 0; k < 4; k++) {
    const x = 110 + k * 105 + Math.sin(lt * 4 + k) * 6;
    man(x, GY, 200, TERRA, { pose: k % 2 ? 'armsUp' : 'point', face: 'none' });
  }
  man(580, GY, 270, TERRA, { pose: 'armsUp', face: 'smile' });
  const cp = PT(lt, 1.5, 0.5); if (cp > 0) { g.save(); g.globalAlpha = cp; crown(580, GY - 270 * 0.97 - 6 - (1 - cp) * 40, 96); g.restore(); }
}
function c3(lt) {
  prop(g, 'document', { x: 270, y: 660, s: 190 });
  man(270, GY, 330, TERRA, { pose: 'stand', face: 'worried' });
  rr(690, GY - 230, 160, 230, 16, INK); crown(770, GY - 236, 190);
  const p = PT(lt, 0.4, 1.3), x = lerp(270, 770, p), y = lerp(GY - 380, GY - 450, p) - Math.sin(p * Math.PI) * 150;
  gearBrain(x, y, 46, p * 5);
}
function c4(lt) {
  dunes();
  prop(g, 'flag', { x: 330, y: GY, s: 150, color: TERRA, t: lt }); prop(g, 'flag', { x: 750, y: GY, s: 150, color: TERRA, t: lt + 0.4 });
  for (const [x, d] of [[100, 1], [215, 1], [865, -1], [980, -1]]) man(x, GY, 190, COAT, { pose: 'armsUp', dir: d, face: 'none' });
  rr(430, GY - 190, 220, 200, 24, MUTE);
  const p = PT(lt, 0.2, 0.7); g.save(); g.globalAlpha = p; man(540, GY - 190, 290, TERRA, { pose: 'armsUp', face: 'smile' });
  crown(540, GY - 190 - 290 * 0.97 - 6, 100); g.restore();
}
function c5(lt) {
  g.save(); g.fillStyle = COAT; g.beginPath(); g.roundRect(215, 545, 650, 640, 40); g.fill(); g.restore();
  prop(g, 'document', { x: 540, y: 830, s: 440 });
  const n = FACTS.DEATH_TOLL / 1e8;
  say(`${n} 億`, 540, 860, 150, TERRA, 1, { align: 'center', bold: 0.02 });
  for (let k = 0; k < 18; k++) {
    const x = 100 + (k % 9) * 110, y = k < 9 ? 1195 : 1275;
    g.save(); g.globalAlpha = 0.45 + 0.55 * PT(lt, 0.2 + k * 0.06, 0.3); man(x, y, 78, COAT, { pose: 'stand', face: 'worried' }); g.restore();
  }
}
function c6(lt) {
  for (let k = 0; k < FACTS.PLANETS_STERILIZED; k++) {
    const c = k % 10, r = Math.floor(k / 10), x = 110 + c * 95.5, y = 610 + r * 84, td = 0.3 + k * 0.025;
    g.fillStyle = mix(SAGE, INK, PT(lt, td, 0.3)); g.beginPath(); g.arc(x, y, 34, 0, 7); g.fill();
    g.fillStyle = CREAM; g.globalAlpha = 0.35; g.beginPath(); g.arc(x - 10, y - 10, 8, 0, 7); g.fill(); g.globalAlpha = 1;
    g.strokeStyle = TERRA; g.lineWidth = 8; g.lineCap = 'round'; g.globalAlpha = PT(lt, td + 0.15, 0.2);
    g.beginPath(); g.moveTo(x - 16, y - 16); g.lineTo(x + 16, y + 16); g.moveTo(x + 16, y - 16); g.lineTo(x - 16, y + 16); g.stroke(); g.globalAlpha = 1;
  }
  say(`${FACTS.PLANETS_STERILIZED} 個星球`, 540, 520, 64, INK, 1, { align: 'center', bold: 0.02 });
}
function sides(lt, mode) {
  g.save();
  if (mode === 10) { const k = lerp(1, 0.92, PT(lt, 0, 0.8)); g.translate(540, 920); g.scale(k, k); g.translate(-540, -920); }
  const P = PT(lt, 0, 0.6);
  g.save(); g.globalAlpha = 0.2 * P; rr(70, 600, 440, 640, 32, TERRA); rr(570, 600, 440, 640, 32, MUST); g.restore();
  if (mode === 10) { g.save(); g.strokeStyle = DIM; g.lineWidth = 6; g.setLineDash([18, 16]); g.beginPath(); g.moveTo(540, 560); g.lineTo(540, 1280); g.stroke(); g.restore(); }
  for (const [side, col, flip] of [[0, TERRA, 1], [1, MUST, -1]]) {
    const X = x => (side ? 1080 - x : x), dir = flip;
    if (mode === 7) man(side ? 790 : 290, 1230, 400, col, { pose: 'stand', dir, face: 'none' });
    if (mode === 8) {
      for (const x of [120, 205, 290]) man(X(x), 1200, 190, col, { pose: 'point', dir, face: 'smile' });
      for (const x of [380, 455]) man(X(x), 1200, 170, INK, { pose: 'stand', dir: -dir, face: 'worried' });
    }
    if (mode === 9 || mode === 10) {
      for (const x of [140, 240, 340, 430]) man(X(x), 1200, 190, col, { pose: 'armsUp', dir, face: 'smile' });
      prop(g, 'bulb', { x: X(290), y: 760, s: 150, on: 1, t: lt });
    }
  }
  g.restore();
}
function c7(lt) { sides(lt, 7); }
function c8(lt) { sides(lt, 8); }
function c9(lt) { sides(lt, 9); }
function c10(lt) { sides(lt, 10); }
function c15(lt) {
  dunes();
  const p = PT(lt, 0.4, 1.0);
  man(330, GY, 440, INK, { pose: 'stand', face: 'smile' });
  const hx = 330, hy = GY - 440 * 0.97 - 6, cx = lerp(hx, 640, p), cy = lerp(hy, GY - 30, p) - Math.sin(p * Math.PI) * 120;
  crown(cx, cy, 120);
  prop(g, 'speech', { x: 640, y: 760, s: 280, tail: 'left', t: lt });
  man(860, GY, 240, TERRA, { pose: 'stand', face: 'smile' }); man(965, GY, 220, COAT, { pose: 'stand', dir: -1, face: 'smile' });
}
function machine(x) {
  rr(x - 100, GY - 430, 200, 430, 24, INK); rr(x - 70, GY - 390, 140, 90, 12, CREAM);
  rr(x - 32, GY - 250, 64, 14, 7, MUST); rr(x - 60, GY - 110, 120, 60, 12, MUTE);
}
function c16(lt) {
  man(260, GY, 330, TERRA, { pose: 'think', face: 'worried' });
  machine(770);
  const p = PT(lt, 0.4, 1.3), x = lerp(260, 770, p), y = lerp(GY - 360, GY - 244, p) - Math.sin(p * Math.PI) * 170;
  g.save(); g.globalAlpha = 1 - PT(lt, 1.7, 0.2); gearBrain(x, y, 46 * (1 - 0.35 * p), p * 6); g.restore();
}
function c17(lt) {
  dunes();
  man(230, GY, 290, TERRA, { pose: lt > 1.6 ? 'shrug' : 'stand', face: 'worried' });
  pocketFigure(780, 500);
  rr(715, GY - 215, 90, 70, 14, '#2B211D');
  const p = PT(lt, 0.3, 1.3), x = lerp(250, 760, p), y = lerp(GY - 300, GY - 190, p) - Math.sin(p * Math.PI) * 190;
  g.save(); g.globalAlpha = 1 - PT(lt, 1.6, 0.25); gearBrain(x, y, 46 * (1 - 0.45 * p), p * 6); g.restore();
}

// ---------- 頂部系列標籤 ----------
function series() {
  plain(`${SERIES}｜系列`, 540, 150, 34, DIM, { align: 'center', w: 600 });
  rr(510, 172, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 1400 - (rows.length - 1) * 36;
  rr(510, y0 - 92, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  say(SERIES, 540, 640, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  say(`第 ${EP} 集`, 540, 720, 44, TERRA, 1, { id: 'end-ep', align: 'center' });
  rr(510, 752, 60, 5, 3, SAGE);
  [[BLUE, 330, 'armsUp'], [MUST, 540, 'stand'], [SAGE, 750, 'armsUp']].forEach(([c, x, pose], k) => man(x, 1150, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1260, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角，寫法照 films/elected-dictator ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
// 畫框 x 875 起、y 260 起、邊長 224（框右緣的透明留白超出畫面無妨），可見身形約 x 906–1067、y 299–455：
// IG 主頁格把 9:16 置中裁成 3:4（上下各裁約 240px），整隻要在 y 240 以下；左邊讓開置中大標（最寬到 x 890）。
const MASCOT = { x: 875, y: 260, s: 224 };
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：底色一樣，看起來是小人與道具在原地換狀態，不是切鏡頭。
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series();
  // 只留封面大標（使用者 11-04）：第 0 卡第 0 幀就完整顯示，其他卡不畫大標副標，畫面當主角
  if (i === 0) { say(cd.head.slice(0, 4), 540, 300, 170, INK, 1, { id: 'head1', align: 'center' }); say(cd.head.slice(4), 540, 490, 170, INK, 1, { id: 'head2', align: 'center' }); }  // 170px 不描邊：bold 0.05 會糊（11-11 使用者回報）
  g.save(); cd.draw(lt); g.restore();
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1530, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
