// 專題報導懶人包：一句一卡（TREATMENT.md 分鏡表），Clawd Bot 當主播站右上。

const ZH = (w, px) => `${w} ${px}px "PingFang TC"`, MONO = (px, w = 500) => `${w} ${px}px Menlo, "PingFang TC"`;

// ---------- 地圖：法國本土輪廓（經緯度手描約 70 點，只當示意底圖） ----------
// ponytail: 輪廓是手描近似，誤差約 20 公里；要精確改抓 Natural Earth admin0 再投影。
const FR = [[2.55,51.09],[3.15,50.78],[4.05,50.35],[4.85,50.15],[4.9,49.8],[5.8,49.55],[6.4,49.47],[7.0,49.15],[7.6,49.05],[8.2,48.98],[7.75,48.3],[7.55,47.6],[7.0,47.45],[6.45,46.95],[6.1,46.4],[6.8,46.4],[7.05,45.9],[6.65,45.1],[7.0,44.7],[6.9,44.3],[7.5,43.8],[7.0,43.55],[6.6,43.15],[5.9,43.1],[5.3,43.35],[4.8,43.4],[4.2,43.45],[3.5,43.25],[3.05,42.9],[3.15,42.45],[2.5,42.35],[1.7,42.5],[0.7,42.8],[-0.3,42.8],[-1.2,43.05],[-1.78,43.37],[-1.45,43.6],[-1.25,44.5],[-1.15,45.6],[-1.5,46.2],[-2.15,46.9],[-2.5,47.3],[-3.5,47.7],[-4.4,47.8],[-4.75,48.35],[-4.5,48.65],[-3.6,48.8],[-2.7,48.55],[-1.6,48.65],[-1.55,49.2],[-1.9,49.7],[-1.25,49.65],[-0.25,49.3],[0.2,49.45],[1.0,49.9],[1.6,50.2],[1.6,50.85]];
const CITY = { 巴黎: [2.35, 48.86], 克雷泰伊: [2.46, 48.79], 朗斯: [2.83, 50.43], 利摩日: [1.26, 45.83], 里昂: [4.84, 45.76], 里爾: [3.06, 50.63], 尼斯: [7.27, 43.7] };
const MAP = { cx: 540, cy: 1180, k: 78 };
const proj = ([lo, la], m = MAP) => [m.cx + (lo - 1.7) * Math.cos(46.6 * G.D2R) * m.k, m.cy - (la - 46.7) * m.k];
function franceMap(m = MAP, a = 1) {
  g.save(); g.globalAlpha = a; g.beginPath();
  FR.forEach((p, i) => { const [x, y] = proj(p, m); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.closePath(); g.fillStyle = BG2; g.fill(); g.lineWidth = 4; g.strokeStyle = rgba(CREAM, 0.55); g.stroke();
  g.restore();
}
function inFrance(x, y, m = MAP) {   // 射線法
  let c = false; const P = FR.map(p => proj(p, m));
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const [xi, yi] = P[i], [xj, yj] = P[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function cityDot(name, lt, a, col = OR, m = MAP, side = 1) {
  const k = E.o3(inv(a, a + 0.5, lt)); if (k <= 0) return;
  const [x, y] = proj(CITY[name], m), pulse = 1;
  g.globalAlpha = 0.35 * clamp(k); G.disc(g, x, y, 34 * pulse * k, col); g.globalAlpha = 1;
  G.disc(g, x, y, 13 * k, col);
  say(name, x + side * 30, y + 14, 42, CREAM, inv(a + 0.1, a + 0.5, lt), { align: side > 0 ? 'left' : 'right' });
}

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。

  { head: '局部宵禁', sub: '10月19日晚', tag: '未宣布緊急狀態', hud: 'Ouest-France · AFP · 巴黎市政府', draw: curfew },
  { head: '請辭被拒', sub: '內政部長', hud: '總統府', draw: resign },
  { head: '預算暫停', sub: '先審社會安全預算', hud: 'Ouest-France · LCP', draw: budgetPause },
  { head: '下一波', sub: '黃背心 10/24、10/31 · 工會 11/5', hud: 'AA · The Local', draw: calendar },
  { head: '沒有穩定多數', sub: '年底前要通過明年預算', hud: '端傳媒', draw: assembly },
  { head: '責任歸屬', sub: '共和黨 · 社會黨', hud: 'franceinfo · Le Parisien', draw: twoSides },
  { head: '往哪裡去？', sub: '政治學者 科特雷', hud: '半島電視台', draw: cautres },
];
// 起承轉合四章：narration.md 的段名 → 畫面上的章名（鉤子不標）
const CHAP = { 鉤子: '', 起因: '一、起因', 升溫: '二、升溫', 轉折: '三、十月十七日', 落點: '四、善後與政局', 提問: '四、善後與政局' };
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.25);
const T1 = i => i + 1 < N ? T0[i + 1] : DUR;
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };

// ---------- 字 ----------
let TXT = [], NOW = 0;
function say(s, x, y, px, col, p, o = {}) {
  const font = o.mono ? MONO(px) : ZH(o.w || 600, px);
  const w = G.maskText(g, s, x, y, font, col, p, { align: o.align, ls: o.ls });
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = o.mono ? MONO(px) : ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.letterSpacing = o.ls || '0px'; g.fillStyle = col; g.fillText(s, x, y); g.letterSpacing = '0px';
}

// ---------- 圖形零件 ----------
// 點陣：n 個點，前 hi 個上 col；依 p 逐個出現。
function dots(x, y, w, cols, n, p, hi, col, base = rgba(CREAM, 0.22), r) {
  const rows = Math.ceil(n / cols), s = w / cols; r = r || s * 0.36;
  const shown = Math.floor(n * clamp(p));
  for (let i = 0; i < shown; i++) {
    const cx = x + (i % cols) * s + s / 2, cy = y + Math.floor(i / cols) * s + s / 2;
    g.fillStyle = i < hi ? col : base; g.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  return rows * s;
}
// 兩根並排長條：rows=[{v, label, col}]，max 是滿格值
function bars(lt, rows, max, y0 = 1000) {
  rows.forEach((r, j) => {
    const y = y0 + j * 260, k = E.o3(inv(0.3 + j * 0.6, 1.4 + j * 0.6, lt));
    plain(r.label, 80, y, 46, CREAM, { w: 500 });
    g.fillStyle = rgba(CREAM, 0.12); g.beginPath(); g.roundRect(80, y + 30, 920, 110, 14); g.fill();
    if (k > 0) { g.fillStyle = r.col; g.beginPath(); g.roundRect(80, y + 30, Math.max(28, 920 * k * r.v / max), 110, 14); g.fill(); }
    plain(r.show ? r.show(k) : fmt(r.v * k), 980, y + 108, 62, CREAM, { mono: true, align: 'right', w: 700 });
  });
}
// 引述框：同色同尺寸，who 在上、話在框內
function quote(x, y, w, h, who, text, p, px = 50) {
  if (p <= 0) return;
  const k = E.o3(p);
  g.save(); g.globalAlpha = clamp(p * 2); g.translate(0, (1 - k) * 40);
  g.fillStyle = BG2; g.strokeStyle = rgba(CREAM, 0.5); g.lineWidth = 3;
  g.beginPath(); g.roundRect(x, y, w, h, 18); g.fill(); g.stroke();
  g.fillStyle = OR; g.fillRect(x, y + 22, 8, h - 44);
  plain(who, x + 40, y + 62, 36, DIM, { w: 500 });
  wrap(text, x + 40, y + 62 + px * 1.35, w - 80, px, CREAM);
  g.restore();
}
function wrap(s, x, y, maxW, px, col) {
  g.font = ZH(600, px); let line = '', yy = y;
  for (const ch of s) {
    if (g.measureText(line + ch).width > maxW) { plain(line, x, yy, px, col); line = ''; yy += px * 1.3; }
    line += ch;
  }
  if (line) plain(line, x, yy, px, col);
}
function stamp(x, y, s, col, p, rot = -0.14) {
  if (p <= 0) return;
  const k = 1 + 0.12 * (1 - E.o3(p));
  g.save(); g.translate(x, y); g.scale(k, k); g.rotate(rot); g.globalAlpha = clamp(p * 4);
  g.font = ZH(800, 64); const w = g.measureText(s).width + 70;
  g.lineWidth = 8; g.strokeStyle = col; g.strokeRect(-w / 2, -60, w, 110);
  plain(s, 0, 20, 64, col, { align: 'center', w: 800 });
  g.restore();
}
function person(x, y, s, col) {   // 極簡人形：原點＝腳底，s＝身高
  y -= s * 0.012 * Math.sin(NOW * 2.1 + x * 0.01);
  g.fillStyle = col; G.disc(g, x, y - s * 0.86, s * 0.12, col);
  g.beginPath(); g.roundRect(x - s * 0.18, y - s * 0.7, s * 0.36, s * 0.7, [s * 0.18, s * 0.18, s * 0.04, s * 0.04]); g.fill();
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));   // 不用回彈（使用者 10-20：語氣要沉穩）

// ---------- 每張卡的舞台（y 820–1600）----------
function arrestsMap(lt) {
  franceMap();
  const r = G.rng(11), n = Math.floor(240 * E.o2(inv(0.2, 2.6, lt)));
  let k = 0;
  for (let i = 0; k < n && i < 4000; i++) {
    const x = 160 + r() * 760, y = 820 + r() * 760;
    if (!inFrance(x, y)) continue;
    G.disc(g, x, y, 7, ORL); k++;
  }
  plain('每點約 10 人', 80, 1640, 30, DIM, { mono: true });
  const q = pop(lt, 2.4); if (q > 0) { g.save(); g.translate(880, 980); g.scale(q, q); plain('？', 0, 60, 200, GOLD, { align: 'center' }); g.restore(); }
}
function unions(lt) {   // 第三股：工會，一排藍色人形依序站起
  for (let i = 0; i < 7; i++) { const k = E.o3(inv(0.2 + i * 0.12, 0.8 + i * 0.12, lt)); if (k > 0) person(150 + i * 130, 1560, 260 * k, BLUE); }
  stamp(540, 1000, '薪資 · 公共服務', BLUE, inv(1.0, 1.5, lt), -0.05);
}
function origin(lt) {
  const m = { cx: 540, cy: 1200, k: 78 };
  franceMap(m);
  cityDot('巴黎', lt, 0.2, CREAM, m, -1);
  cityDot('克雷泰伊', lt, 0.7, OR, m, 1);
  stamp(820, 1520, '9月中旬', GOLD, inv(1.0, 1.4, lt));
}
function gas(lt) {   // 手機貼文一則則冒出＋油價牌往上跳；不放平台標誌
  g.fillStyle = BG2; g.strokeStyle = rgba(CREAM, 0.6); g.lineWidth = 5;
  g.beginPath(); g.roundRect(100, 860, 400, 720, 50); g.fill(); g.stroke();
  for (let j = 0; j < 5; j++) {
    const k = E.o3(inv(0.2 + j * 0.45, 0.6 + j * 0.45, lt)); if (k <= 0) continue;
    g.globalAlpha = k; g.fillStyle = j % 2 ? rgba(GOLD, 0.8) : rgba(ORL, 0.8);

  }

  const p = E.io(inv(0.4, 3.0, lt));

  g.fillStyle = BG; g.fillRect(640, 1000, 300, 170);
  G.poly(g, [[790, 1150 - 110 * p], [740, 1150 - 60 * p], [840, 1150 - 60 * p]], GOLD); g.fillStyle = GOLD; g.fillRect(775, 1150 - 60 * p, 30, 60 * p + 5);
  g.fillStyle = DIM; g.fillRect(760, 1230, 60, 220);
}
function demands(lt) {
  const items = ['師資與人手不足', '校舍老舊', '課表過滿', '班級過大', '升學系統壓力'];
  items.forEach((s, j) => {
    const k = E.o3(inv(0.3 + j * 0.7, 0.8 + j * 0.7, lt)); if (k <= 0) return;
    const x = 80 + (j % 2) * 470, y = 860 + Math.floor(j / 2) * 230, rot = ((j * 37) % 7 - 3) * 0.012;
    g.save(); g.translate(x + 210, y + 90); g.globalAlpha = k; void rot;
    g.fillStyle = BG2; g.fillRect(-210, -90, 420, 180); g.fillStyle = OR; g.fillRect(-210, -90, 8, 180);
    plain(s, 0, 18, 46, CREAM, { align: 'center', w: 600 }); g.restore();
  });
}
function schools(lt) {
  dots(90, 860, 900, 74, 3700, E.o2(inv(0.1, 1.6, lt)), 0, OR, rgba(CREAM, 0.28), 4.4);
  // 受影響的 400 所在全部鋪完後轉橘；點的位置不代表地理
  const k = E.o2(inv(1.8, 3.0, lt)), hi = Math.floor(400 * k), s = 900 / 74;
  const r = G.rng(5), pick = new Set(); while (pick.size < 400) pick.add(Math.floor(r() * 3700));
  [...pick].slice(0, hi).forEach(i => { g.fillStyle = OR; g.fillRect(90 + (i % 74) * s + s / 2 - 5, 860 + Math.floor(i / 74) * s + s / 2 - 5, 10, 10); });
  plain(`${fmt(hi)} 所`, 990, 1640, 56, OR, { mono: true, align: 'right', w: 700 });
  plain('每點 1 所 · 位置不代表地理', 90, 1640, 30, DIM, { mono: true });
}
function budget(lt) {
  const k = E.o3(inv(0.4, 2.0, lt));                 // 歐元疊柱
  for (let j = 0; j < Math.round(18 * k); j++) { g.fillStyle = j % 2 ? GOLD : mix(GOLD, BG, 0.25); g.beginPath(); g.ellipse(760, 1560 - j * 36, 150, 34, 0, 0, Math.PI * 2); g.fill(); }
  plain(`${Math.round(FACTS.TAX_BN * k)} 億 €`, 760, 1600 - 18 * 36 * k - 60, 56, GOLD, { mono: true, align: 'center', w: 700 });
  const f = E.oExp(inv(1.2, 1.8, lt));               // 薪資條被凍住
  g.fillStyle = CREAM; g.fillRect(110, 1050, 320, 420);
  g.fillStyle = rgba(BG, 0.5); for (let j = 0; j < 6; j++) g.fillRect(150, 1110 + j * 55, j === 5 ? 140 : 240, 16);
  if (f > 0) { g.fillStyle = rgba(BLUE, 0.55 * f); g.fillRect(90, 1030, 360, 460); g.strokeStyle = rgba('#dfefff', f); g.lineWidth = 5; g.strokeRect(90, 1030, 360, 460); plain('凍薪', 270, 1560, 48, BLUE, { align: 'center' }); }
}
function lens(lt) {
  const m = { cx: 540, cy: 1200, k: 78 };
  franceMap(m);
  cityDot('朗斯', lt, 0.3, RED, m, 1);
  const k = E.o3(inv(1.2, 1.7, lt)); if (k <= 0) return;   // 調查卷宗
  g.save(); g.translate(250, lerp(1700, 1430, k));
  g.fillStyle = GOLD; g.beginPath(); g.roundRect(-140, -110, 280, 200, 10); g.fill();
  g.fillStyle = mix(GOLD, BG, 0.3); g.fillRect(-140, -130, 120, 30);
  plain('IGPN', 0, 20, 56, BG, { align: 'center', mono: true, w: 700 }); g.restore();
}
function oct6(lt) {
  bars(lt, [{ v: 45, label: '主辦方', col: OR, show: k => `${Math.round(45 * k)} 萬` },
    { v: 26.6, label: '內政部', col: BLUE, show: k => `${(26.6 * k).toFixed(1)} 萬` }], 50);
  [OR, GOLD, BLUE].forEach((c, j) => person(160 + j * 110, 1600, 150 * pop(lt, 0.2 + j * 0.2), c));
