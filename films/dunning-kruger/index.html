<!doctype html>
<html lang="zh-Hant">

<title>為什麼能力不足的人，最難看出自己有問題？</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#mascot{display:none}#mascot svg{width:340px;height:340px}</style>
<script src="engine.js"></script>

</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="mascot"></div>
<script type="module">
// 單人旁白科普，米色插畫風（範本 films/taipei-silence；版面上下往中間收照 films/democracy-noise，使用者 11-05）。
// 全片同一張米色底、換卡原地交叉淡化；一句一個畫面狀態（CARDS），字幕一卡一個逗號短語（timeline.js 的 phrases）。
// 只有封面有大標；其他卡只有品牌標籤＋畫面＋字幕＋來源。本片不屬於任何系列，片尾不寫集數。
// 顏色語意整片固定：最差的那一群＝芥末黃，最好的那一群＝鼠尾草綠，自估＝陶土紅，實際＝深棕。
// 禁止清單（TREATMENT.md）：不畫真人照片與可辨識人臉、不畫信心曲線、不畫槍枝與擬真搶劫（搶匪是剪影＋檸檬）。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat, PAPER = PALETTE.paper, LINE = PALETTE.line;
const SAGE = '#7FA57A', BLUE = '#6F8FB0', MUTE = '#B3A797', SOFT = '#EBE1D2', DIM = '#8C7B6B';
const SAGE_D = '#557A51', MUST_D = '#9A6F1C';
const TERRA_D = '#9C3F26', SAGE_DD = '#3C5E3D';   // 牛皮紙底板上的字用深一階，手機上才讀得出
const DESK = '#C8B79E';   // 資料卡的牛皮紙底板：比米色深一階，字藏掉後畫面才站得住（textless_check）
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const BRAND = '悖論小酒館', HANDLE = '@paradoxbar';
const GY = 1270;   // 畫面地平線：小人腳底（drawCard 縮 0.9 後在 1231）

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。
const FACTS = {
  ROBBERY_YEAR: 1995,              // SOURCES #1
  ROBBERY_CITY: '匹茲堡',          // #1
  QUOTE: '可是我有抹檸檬汁',       // #1 "But I wore the juice"
  PAPER_YEAR: 1999,                // #2
  LOGIC_BOTTOM_ACTUAL_PCT: 12,     // #2 Study 2
  LOGIC_BOTTOM_EST_PCT: 62,        // #2 Study 2
  GRAMMAR_PEERS_GRADED: 5,         // #2 Study 3
  GRAMMAR_TOP_BEFORE: 69.5,        // #2 Table 1
  GRAMMAR_TOP_AFTER: 79.7,
  GRAMMAR_BOTTOM_BEFORE: 60.5,
  GRAMMAR_BOTTOM_AFTER: 65.4,
  GRAMMAR_BOTTOM_ACTUAL: 10.1,
  TRAINING_MIN: 10,                // #2 Study 4
  LOGIC4_ITEMS: 10,
  LOGIC4_BOTTOM_ACTUAL: 0.4,       // #2 Table 2
  LOGIC4_BOTTOM_EST_BEFORE: 5.3,
  LOGIC4_BOTTOM_EST_AFTER: 1.0,
};

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  // PingFang 最粗只到 Semibold；o.bold 描同色邊加粗，大標在奶油底上才讀得出（封面 OCR）
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    // 卡片內容會被 drawCard 縮向中間，字框換回螢幕座標，readcheck／藏字檢查才量得準
    const m = g.getTransform();
    TXT.push({ id: o.id, text: s, x0: m.a * x0 + m.e, y0: m.d * (y - px) + m.f, x1: m.a * (x0 + w) + m.e, y1: m.d * (y + px * 0.25) + m.f, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });
// 畫面裡的數字標籤：比字幕大一點、遠小於大標（< precheck HEADLINE_PX），算插畫的一部分
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });

// ---------- 共用零件 ----------
const board = () => rr(60, 560, 960, 710, 32, DESK);
const seat = () => { rr(60, 1090, 960, 30, 14, '#A5835D'); rr(80, 1114, 920, GY - 1114, 10, '#C7A77F'); g.fillStyle = 'rgba(59,47,42,0.08)'; g.fillRect(80, 1114, 920, 16); };
function line(pts, col, w) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); }
function tick(x, y, s, col, p = 1, w = 12) {   // 打勾，p 控制畫到哪
  if (p <= 0) return;
  const A = [x - s, y], B = [x - s * 0.25, y + s * 0.7], C = [x + s, y - s * 0.8], q = clamp(p);
  const pts = q < 0.4 ? [A, [lerp(A[0], B[0], q / 0.4), lerp(A[1], B[1], q / 0.4)]] : [A, B, [lerp(B[0], C[0], (q - 0.4) / 0.6), lerp(B[1], C[1], (q - 0.4) / 0.6)]];
  line(pts, col, w);
}
function cross(x, y, s, col, w = 8) { line([[x - s, y - s], [x + s, y + s]], col, w); line([[x + s, y - s], [x - s, y + s]], col, w); }
function lemon(x, y, r, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = MUST; g.beginPath(); g.ellipse(0, 0, r, r * 0.74, 0, 0, Math.PI * 2); g.fill();
  G.disc(g, r * 1.0, 0, r * 0.16, MUST); G.disc(g, -r * 1.0, 0, r * 0.12, MUST_D);
  g.fillStyle = 'rgba(255,250,242,0.45)'; g.beginPath(); g.ellipse(-r * 0.25, -r * 0.3, r * 0.34, r * 0.14, -0.3, 0, Math.PI * 2); g.fill();
  g.strokeStyle = SAGE_D; g.lineWidth = r * 0.09; g.lineCap = 'round'; g.beginPath(); g.moveTo(-r * 1.05, 0); g.quadraticCurveTo(-r * 1.4, -r * 0.3, -r * 1.3, -r * 0.55); g.stroke();
  g.restore();
}
function pen(x, y, rot, col, s = 1) {   // 筆尖在 (x, y)，rot 0 ＝筆身朝右上
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.fillStyle = INK; g.beginPath(); g.moveTo(0, 0); g.lineTo(46, -14); g.lineTo(46, 14); g.closePath(); g.fill();
  rr(46, -18, 200, 36, 8, col); rr(246, -18, 34, 36, 10, MUTE);
  g.restore();
}
function sheet(x, y, w, h, rot, o = {}) {   // 一張考卷，(x, y) 是中心
  g.save(); g.translate(x, y); g.rotate(rot); g.globalAlpha *= o.alpha ?? 1;
  g.save(); g.shadowColor = 'rgba(59,47,42,0.22)'; g.shadowBlur = 16; g.shadowOffsetY = 5; rr(-w / 2, -h / 2, w, h, 12, PAPER); g.restore();
  rr(-w / 2 + w * 0.12, -h / 2 + h * 0.09, w * 0.42, h * 0.05, 4, o.head || INK);
  for (let k = 0; k < (o.rows ?? 5); k++) rr(-w / 2 + w * 0.12, -h / 2 + h * (0.24 + k * 0.14), w * 0.76, h * 0.035, 3, LINE);
  g.restore();
}

// 百分位尺：0–100 橫條，X(v) 換算位置
const RX0 = 130, RW = 820, RX = v => RX0 + RW * v / 100;
function ruler(y, a = 1) {
  g.save(); g.globalAlpha *= a;
  rr(RX0, y - 16, RW, 32, 16, PAPER);
  for (let v = 0; v <= 100; v += 10) { g.fillStyle = v % 50 ? DIM : INK; g.fillRect(RX(v) - 2, y + 22, 4, v % 50 ? 16 : 28); }
  [0, 50, 100].forEach(v => plain(String(v), RX(v), y + 92, 38, INK, { align: 'center', w: 600 }));
  g.restore();
}
function gap(y, a, b, p = 1) { if (b > a) { g.globalAlpha = p; rr(RX(a), y - 16, RX(b) - RX(a), 32, 16, TERRA); g.globalAlpha = 1; } }
function dot(x, y, col, p = 1) { if (p <= 0) return; G.disc(g, x, y, 34 * p, CREAM); G.disc(g, x, y, 26 * p, col); }

// 直式百分位尺（改考卷前後）：0 在下、100 在上
const VY0 = 1190, VH = 500, VY = v => VY0 - VH * v / 100;
function vruler(x, a = 1) {
  g.save(); g.globalAlpha *= a;
  rr(x - 18, VY(100), 36, VH, 18, PAPER);
  [0, 50, 100].forEach(v => { g.fillStyle = INK; g.fillRect(x - 54, VY(v) - 2, 26, 4); plain(String(v), x - 66, VY(v) + 13, 36, INK, { align: 'right', w: 600 }); });
  g.restore();
}
// 十格考卷：n 可以是小數（0.4 題＝第一格填四成）
function cells(y, n, col) {
  const cw = 76, gp = 8, x0 = 124;
  for (let k = 0; k < 10; k++) {
    const x = x0 + k * (cw + gp), f = clamp(n - k);
    rr(x, y, cw, 110, 14, PAPER);
    if (f > 0) rr(x, y, Math.max(14, cw * f), 110, 14, col);
  }
}

// ---------- 每張卡的畫面（畫在 y 540–1270；x≥830、y<530 是主播位置）；i＝卡號，beat(i,k)＝第 k 個字幕短語開始的卡內秒數 ----------
function c1(lt) {
  // 會議桌：最左邊那個人講個不停，對話框越長越大；其他人只是聽。第 0 幀對話框已在，封面不空
  const grow = E.io(inv(0, 3.2, lt));
  [[430, MUTE, 'think', 1], [640, MUTE, 'shrug', 1], [850, MUTE, 'think', -1]].forEach(([x, c, pose, dir], k) => man(x, GY, 300, c, { pose, dir, face: 'worried', shadow: false, tilt: Math.sin(lt * 1.8 + k) * 0.015 }));
  man(190, GY, 340, TERRA, { pose: 'armsUp', face: 'smile', shadow: false, tilt: Math.sin(lt * 4) * 0.03 });
  seat();
  prop(g, 'speech', { x: 330 + grow * 120, y: 850 - grow * 40 + Math.sin(lt * 3) * 5, s: 260 + grow * 190, tail: 'left', stroke: TERRA, color: TERRA });
}
function c2(lt, i) {
  // 大對話框上蓋「臉皮厚？」，蓋完再打一個問號：這個解釋先存疑
  man(190, GY, 440, TERRA, { pose: 'armsUp', face: 'smile', tilt: Math.sin(lt * 3.2) * 0.02 });
  prop(g, 'speech', { x: 610, y: 830 + Math.sin(lt * 2.4) * 5, s: 560, tail: 'left', stroke: TERRA, color: TERRA });
  const st = inv(0.5, 0.85, lt), k = lerp(1.7, 1, E.o3(st));
  if (st > 0) {
    g.save(); g.translate(610, 830); g.rotate(-0.09); g.scale(k, k); g.globalAlpha = clamp(st * 2);
    rr(-210, -70, 420, 140, 18, CREAM); g.strokeStyle = TERRA; g.lineWidth = 9; g.beginPath(); g.roundRect(-210, -70, 420, 140, 18); g.stroke();
    plain('臉皮厚？', 0, 22, 64, TERRA, { align: 'center', w: 800 }); g.restore();
  }
  const q = E.o3(inv(beat(i, 1), beat(i, 1) + 0.5, lt));
  if (q > 0) prop(g, 'question', { x: 860, y: 1120 + Math.sin(lt * 2.5) * 8, s: 200 * q });
}
function c3(lt) {
  // 視野扇形掃過，扇形裡有一塊看不到的黑色缺口
  const hx = 240, hy = 900, R = 760, a0 = -0.62, a1 = 0.46, sw = Math.sin(lt * 0.9) * 0.05;
  g.fillStyle = 'rgba(217,164,65,0.66)'; g.beginPath(); g.moveTo(hx, hy); g.arc(hx, hy, R, a0 + sw, a1 + sw); g.closePath(); g.fill();
  [[0.33, -0.34], [0.55, 0.3], [0.78, -0.42], [0.8, 0.28]].forEach(([d, a], k) => G.disc(g, hx + Math.cos(a + sw) * R * d, hy + Math.sin(a + sw) * R * d, 24, [SAGE, BLUE, SAGE, BLUE][k]));
  const o = E.o3(inv(0.1, 1.1, lt)), c = -0.06 + sw;
  g.fillStyle = INK; g.beginPath(); g.moveTo(hx, hy); g.arc(hx, hy, R, c - 0.2 * o, c + 0.2 * o); g.closePath(); g.fill();
  if (o > 0.5) prop(g, 'question', { x: hx + R * 0.72, y: hy - 44, s: 110, color: CREAM, alpha: inv(0.5, 1, o) });
  man(200, GY, 440, COAT, { pose: 'think', face: 'smile' });
}
function bank(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  rr(-150, -250, 300, 250, 8, '#D8C9B2');
  g.fillStyle = '#A5835D'; g.beginPath(); g.moveTo(-180, -250); g.lineTo(0, -340); g.lineTo(180, -250); g.closePath(); g.fill();
  [-105, -35, 35, 105].forEach(px => rr(px - 14, -230, 28, 230, 6, CREAM));
  plain('銀行', 0, -262, 44, CREAM, { align: 'center', w: 700 });
  g.restore();
}
function c4(lt, i) {
  // 剪影人形（不畫真人長相），檸檬擠汁抹過臉，右邊是銀行；1995 匹茲堡
  fig(`${FACTS.ROBBERY_YEAR} ${FACTS.ROBBERY_CITY}`, 300, 590, TERRA, 1, 'fig-year');
  bank(800, GY, 0.95);
  const hx = 300, hy = GY - 84 * 5.2, b = beat(i, 2);
  const walk = E.io(inv(b + 1.0, b + 2.4, lt)), x = lerp(hx, hx + 170, walk);
  man(x, GY, 520, INK, { pose: walk > 0 && walk < 1 ? 'walk' : 'stand', t: lt });
  const squeeze = clamp(inv(b - 0.2, b + 0.5, lt)) * (1 - inv(b + 1.0, b + 1.4, lt));
  lemon(hx + 170, hy - 100 + (1 - squeeze) * -40, 74 * (1 - 0.14 * Math.abs(Math.sin(lt * 7)) * squeeze), 0.6);
  for (let k = 0; k < 4; k++) { const q = loop(lt * 1.4 + k * 0.25, 1); if (squeeze > 0.2) G.disc(g, lerp(hx + 110, hx + 20, q), lerp(hy - 60, hy - 6, q), 11, MUST); }
  const sm = inv(b, b + 1.0, lt);
  if (sm > 0) { g.fillStyle = `rgba(217,164,65,${0.85 * sm})`; g.beginPath(); g.ellipse(x + 8, GY - 84 * 5.2, 46, 50, 0, 0, Math.PI * 2); g.fill(); }
}
function c5(lt, i) {
  // 監視器畫框：臉上黃黃的，但人拍得一清二楚；被抓時的話用引號卡
  rr(120, 570, 840, 500, 24, INK); rr(142, 592, 796, 456, 14, '#DDD2C0');
  man(540, 1030, 400, INK, { pose: 'stand' });
  g.fillStyle = 'rgba(217,164,65,0.85)'; g.beginPath(); g.ellipse(546, 1030 - 84 * 4, 38, 42, 0, 0, Math.PI * 2); g.fill();
  const y = 610 + loop(lt * 90, 420); g.fillStyle = 'rgba(59,47,42,0.08)'; g.fillRect(142, y, 796, 18);
  if (loop(lt, 1) < 0.6) G.disc(g, 188, 638, 15, TERRA);
  plain('REC', 216, 652, 38, INK, { w: 700 });
  const fr = E.o3(inv(0.5, 1.2, lt));
  g.strokeStyle = TERRA; g.lineWidth = 10; g.lineCap = 'round';
  const fx0 = 540 - 92, fx1 = 540 + 92, fy0 = 655, fy1 = 830, L = 44 * fr;
  [[fx0, fy0, 1, 1], [fx1, fy0, -1, 1], [fx0, fy1, 1, -1], [fx1, fy1, -1, -1]].forEach(([x, yy, sx, sy]) => { g.beginPath(); g.moveTo(x + sx * L, yy); g.lineTo(x, yy); g.lineTo(x, yy + sy * L); g.stroke(); });
  const q = pop(lt, beat(i, 2), 0.5);
  if (q > 0) { prop(g, 'card', { x: 540, y: 1165, w: 840, h: 150, alpha: q }); g.save(); g.globalAlpha = q; plain(`「${FACTS.QUOTE}」`, 540, 1188, 60, TERRA, { align: 'center', w: 800 }); g.restore(); }
}
function c6(lt, i) {
  // 剪報滑到桌上，旁邊一疊考卷，百分位尺升起
  board();
  const s = E.o3(inv(0.1, 0.9, lt));
  g.save(); g.translate(lerp(-260, 310, s), 760); g.rotate(-0.05);
  g.save(); g.shadowColor = 'rgba(59,47,42,0.22)'; g.shadowBlur = 16; g.shadowOffsetY = 5; rr(-210, -170, 420, 340, 10, PAPER); g.restore();
  plain('檸檬汁搶匪被捕', 0, -104, 46, INK, { align: 'center', w: 800 });
  rr(-180, -80, 150, 150, 8, SOFT); G.disc(g, -105, -22, 26, INK); rr(-132, 2, 54, 66, 10, INK); lemon(-60, -50, 20, 0.5);
  for (let k = 0; k < 6; k++) rr(-10, -74 + k * 25, 190, 9, 4, LINE);
  rr(-180, 96, 360, 9, 4, LINE); rr(-180, 124, 260, 9, 4, LINE);
  g.restore();
  const b = beat(i, 1), n = Math.round(clamp(inv(b, b + 0.8, lt)) * 5);
  for (let k = 0; k < n; k++) sheet(760 + k * 4, 780 - k * 12, 280, 360, 0.04 - k * 0.012, { rows: 5 });
  const r = E.o3(inv(beat(i, 2), beat(i, 2) + 0.7, lt));
  if (r > 0) { g.save(); g.translate(0, (1 - r) * 180); g.globalAlpha = r; ruler(1080); plain('贏過幾成同學', 540, 1040, 44, INK, { align: 'center', w: 700 }); g.restore(); }
}
function c7(lt, i) {
  // 百分位尺：實際停在 12，自估跑到 62，中間落差線拉長
  board();
  const y = 980, A = FACTS.LOGIC_BOTTOM_ACTUAL_PCT, Z = FACTS.LOGIC_BOTTOM_EST_PCT, b = beat(i, 2);
  ruler(y);
  plain('贏過幾成同學', 540, 630, 44, INK, { align: 'center', w: 600 });
  const p = E.io(inv(b, b + 1.5, lt)), v = lerp(A, Z, p);
  gap(y, A, v);
  const a = pop(lt, beat(i, 1), 0.5);
  dot(RX(A), y, INK, a);
  if (a > 0) { man(RX(A), y - 44, 200, MUST, { pose: 'stand', face: 'none', alpha: a }); plain(`實際 ${A}`, RX(A) + 40, y + 180, 60, INK, { align: 'center', w: 800 }); }
  if (p > 0) {
    dot(RX(v), y, TERRA);
    man(RX(v), y - 44, 280, MUST, { pose: p >= 1 ? 'armsUp' : 'walk', face: 'smile', t: lt, alpha: 0.95, shadow: false });
    if (p >= 1) plain(`以為 ${Z}`, RX(Z), y + 180, 60, TERRA_D, { align: 'center', w: 800 });
  }
}
function c8(lt, i) {
  // 同一支筆：先寫答案，翻過來打勾。寫的和改的是同一套能力
  board();
  prop(g, 'card', { x: 540, y: 850, w: 860, h: 480 });
  const b1 = beat(i, 1), b2 = beat(i, 2);
  plain('答案', 170, 730, 44, DIM, { w: 700 });
  const wp = clamp(inv(0, Math.max(0.8, b2), lt)), wx = lerp(180, 700, wp), wob = Math.sin(lt * 16) * 10;
  line([[180, 800], ...Array.from({ length: 24 }, (_, k) => [lerp(180, wx, k / 23), 800 + Math.sin(k * 1.6) * 16])], INK, 9);

}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }

function render(t) {

  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);

  g.save(); g.translate(540, 880); g.scale(z, z); g.translate(-540, -880); cd.draw(lt, i); g.restore();

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
