<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>沒看過漫威，也看得懂汪達幻視</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#mascot{display:none}#mascot svg{width:200px;height:200px}</style>
<script src="engine.js"></script>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="mascot"></div>
<script type="module">
// 單人旁白科普長片（16:9，WO-9）：米色底＋扁平小人＋插畫庫 illust/illust.mjs，畫法照無邊探索（11-03 採用）。
// 長片不一句一卡：一個「段落」一個畫面狀態（SECS 照 timeline.js 的 section 分組，換段原地交叉淡化），
// 字幕一卡一個逗號短語（phrases），關鍵詞陶土紅。頂部系列標籤＋段落標籤，片尾系列卡。
// 第二、三部開頭的劇透提醒句念完後，中央蓋 5 秒倒數卡（pace.json 的 pause_after 留空檔，時間從 TL 算，不寫死秒數）。
// 所有動作都是 t 的封閉式（seek_check.mjs 亂序重算同一幀）；循環用取餘數，不累積、不讀 Date.now()。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1920, H = 1080;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
const SAGE = PALETTE.sage, MUTE = PALETTE.mute, SOFT = PALETTE.soft, PAPER = PALETTE.paper, DIM = '#8C7B6B';
const SCAR = '#8E2F3C', SCAR_L = '#C24A52', PUR = '#5E4A75', PUR_L = '#7E68A0', STEEL = '#6E6A75', SKY = '#5B7FBE', WHITE_V = '#EFEAE0';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '漫威補課｜汪達幻視三部曲', EP = 1, HANDLE = '@paradoxbar';
const CX = 960, GY = 730;   // 畫面中線、地平線（小人腳底）

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });

// ---------- 共用道具 ----------
function gem(x, y, s, col, a = 1) {
  g.save(); g.globalAlpha *= a;
  G.poly(g, [[x, y - s], [x + s * 0.72, y], [x, y + s], [x - s * 0.72, y]], col);
  g.restore();
}
function tv(cx, cy, w, h, screen) {
  rr(cx - w / 2 - 30, cy - h / 2 - 30, w + 60, h + 60, 44, INK);
  G.seg(g, [cx - 40, cy - h / 2 - 28], [cx - 140, cy - h / 2 - 170], 12, INK);
  G.seg(g, [cx + 40, cy - h / 2 - 28], [cx + 140, cy - h / 2 - 160], 12, INK);
  G.disc(g, cx - 140, cy - h / 2 - 170, 12, TERRA); G.disc(g, cx + 140, cy - h / 2 - 160, 12, TERRA);
  rr(cx - w / 2 + 80, cy + h / 2 + 30, 36, 34, 10, INK); rr(cx + w / 2 - 116, cy + h / 2 + 30, 36, 34, 10, INK);
  rr(cx - w / 2, cy - h / 2, w, h, 26, screen);
}

// ---------- 各段畫面（畫在 y 120–730；右上角是主播） ----------
function s0(lt) {
  // 封面：黑白情境喜劇的電視機，裡面是汪達與幻視；前 7 秒蓋大標
  tv(CX, 440, 660, 430, PAPER);
  g.save(); g.beginPath(); g.roundRect(CX - 330, 225, 660, 430, 26); g.clip();
  man(CX - 110, 600, 200, SCAR, { face: 'smile', shadow: false });
  man(CX + 110, 600, 200, TERRA, { dir: -1, face: 'smile', shadow: false });
  g.globalAlpha = 0.07; g.fillStyle = INK;
  for (let y = 240; y < 640; y += 8) g.fillRect(CX - 330, y, 660, 3);
  g.restore();
  if (lt < 7) {
    const a = 1 - inv(6.2, 7, lt);
    g.save(); g.globalAlpha = a;
    g.fillStyle = 'rgba(245,239,230,0.9)'; g.fillRect(0, 0, W, H);
    say('汪達幻視三部曲', CX, 500, 150, INK, 1, { id: 'head1', align: 'center', bold: 0.04 });
    plain('沒看過漫威，也看得懂', CX, 590, 56, DIM, { align: 'center', w: 600 });
    g.restore();
  }
}
function s1(lt) {
  // 六顆無限寶石排開，心靈寶石（黃）最大、發光
  const cols = [SKY, MUST, SCAR_L, PUR, '#C77B3A', SAGE];
  for (let i = 0; i < 6; i++) {
    const x = 480 + i * 190, big = i === 1, s = big ? 74 + Math.sin(lt * 2.2) * 5 : 46;
    if (big) G.ring(g, x, 400, 120 + Math.sin(lt * 2.2) * 10, 8, mix(MUST, CREAM, 0.4));
    gem(x, 400, s, cols[i]);
  }
  plain('心靈寶石', 670, 540, 40, INK, { align: 'center', w: 700 });
  man(780, GY, 270, COAT, { pose: 'point', aim: -0.6 });
  man(1200, GY, 270, SCAR, { dir: -1, face: 'worried' });
}
function s2(lt) {
  // 沒爆的飛彈斜插在瓦礫裡，兩個孩子抬頭看；彈頭燈一閃一閃
  const bx = 1060, by = 560;
  g.save(); g.translate(bx, by); g.rotate(-0.5);
  rr(-40, -300, 80, 380, 40, STEEL);
  rr(-40, -300, 80, 62, 30, TERRA);
  G.poly(g, [[-40, 40], [-116, 130], [-40, 112]], MUTE);
  G.poly(g, [[40, 40], [116, 130], [40, 112]], MUTE);
  g.restore();
  const blink = 0.5 + 0.5 * Math.sin(lt * 6);
  G.disc(g, bx - 144, by - 263, 8 + 12 * blink, SCAR_L);
  [[880, 700], [990, 726], [1140, 716], [1230, 736], [780, 726]].forEach(([x, y], k) =>
    G.poly(g, [[x, y], [x + 70, y - 26 - k * 5], [x + 150, y]], mix(MUTE, SOFT, (k % 3) / 3)));
  man(660, GY, 190, SKY, { face: 'worried' });
  man(780, GY, 175, SAGE, { pose: 'point', aim: -0.9, face: 'worried' });
}
function s3(lt) {
  // 奧創：鋼色大頭、紅眼發光；角落的汪達別過頭
  const cx = 990, cy = 420;
  rr(cx - 140, cy + 120, 280, 70, 26, mix(STEEL, INK, 0.3));
  rr(cx - 200, cy - 170, 400, 300, 90, STEEL);
  g.save(); g.globalAlpha = 0.65 + 0.35 * Math.sin(lt * 3.1);
  G.poly(g, [[cx - 120, cy - 62], [cx - 28, cy - 40], [cx - 118, cy - 18]], SCAR_L);
  G.poly(g, [[cx + 120, cy - 62], [cx + 28, cy - 40], [cx + 118, cy - 18]], SCAR_L);
  g.restore();
  G.seg(g, [cx - 70, cy + 70], [cx + 70, cy + 70], 14, INK);
  man(560, GY, 300, SCAR, { dir: -1, face: 'worried', tilt: 0.1 });
}
function s4(lt) {
  // 幻視誕生：額頭的心靈寶石發光，背後一道光柱
  g.save(); g.globalAlpha = 0.10 + 0.05 * Math.sin(lt * 1.8);
  G.poly(g, [[CX - 170, 130], [CX + 170, 130], [CX + 60, GY], [CX - 60, GY]], MUST);
  g.restore();
  man(CX, GY, 420, TERRA, { face: 'none' });
  G.disc(g, CX + 7, 358, 14, MUST);
  G.ring(g, CX + 7, 358, 28 + Math.sin(lt * 2.4) * 5, 5, mix(MUST, CREAM, 0.3));
}
function s5(lt) {
  // 相戀：汪達與幻視面對面，中間一顆上下浮動的心
  man(CX - 190, GY, 300, SCAR, { face: 'smile' });
  man(CX + 190, GY, 300, TERRA, { dir: -1, face: 'smile' });
  const hy = 390 + Math.sin(lt * 2) * 12;
  G.disc(g, CX - 24, hy, 34, SCAR_L); G.disc(g, CX + 24, hy, 34, SCAR_L);
  G.poly(g, [[CX - 55, hy + 14], [CX + 55, hy + 14], [CX, hy + 84]], SCAR_L);
}
function s6(lt) {
  // 無限之戰：薩諾斯壓在畫面一側，寶石繞著他的手轉；汪達舉手在另一側
  man(650, GY, 560, PUR, { pose: 'point', aim: -1.0 });
  const hx = 930, hy = 360;
  const gc = [SKY, MUST, SCAR_L, '#C77B3A', SAGE];
  for (let i = 0; i < 5; i++) {
    const a = lt * 0.9 + i * Math.PI * 2 / 5;
    G.disc(g, hx + Math.cos(a) * 90, hy + Math.sin(a) * 60, 14, gc[i]);
  }
  man(1330, GY, 250, SCAR, { dir: -1, pose: 'armsUp', face: 'worried' });
}
function s7(lt) {
  // 回不來的人：有些人化成灰，上半身碎成點往上飄（緩慢循環，位置固定）
  const R = G.rng(7);
  const cols = [COAT, SKY, SAGE, TERRA, MUST, MUTE];
  for (let k = 0; k < 6; k++) {
    const x = 560 + k * 170, ph = loop(lt * 0.1 + k * 0.37, 1);
    if (ph < 0.6) {
      g.save(); g.globalAlpha = 1 - ph;
      man(x, GY, 240, cols[k], { face: 'worried', shadow: false });
      g.restore();
    }
    for (let d = 0; d < 10; d++) {
      const p = loop(ph + d * 0.09 + R() * 0.03, 1);
      if (p < 0.55) continue;
      g.save(); g.globalAlpha = (1 - p) * 1.5;
      G.disc(g, x + (R() - 0.5) * 130, GY - 60 - p * 260, 7, MUTE);
      g.restore();
    }
  }
}
function s8(lt) {
  // 最後一根稻草：大雨黑雲，她一個人站在底下
  [CX - 170, CX, CX + 170].forEach((x, k) => G.disc(g, x, 210 + (k % 2) * 26, 115, mix(MUTE, INK, 0.25)));
  g.strokeStyle = mix(SKY, INK, 0.35); g.lineWidth = 5; g.lineCap = 'round';
  for (let i = 0; i < 60; i++) {
    const x = loop(i * 137 + lt * 850, W + 60), y = 330 + (i * 97) % 380;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 14, y + 44); g.stroke();
  }
  man(CX, GY, 320, SCAR, { tilt: 0.14, face: 'worried' });
}
function s9(lt) {
  // 開播會遇到的臉：莫妮卡、達西、吉米·吳，還有鄰居艾格妮絲
  const cast = [['莫妮卡', SKY, 'stand'], ['達西', MUST, 'think'], ['吉米·吳', COAT, 'stand'], ['艾格妮絲', PUR, 'shrug']];
  cast.forEach(([name, col, pose], k) => {
    const x = 540 + k * 290;
    man(x, GY, 250, col, { pose, face: k === 3 ? 'smile' : 'none', tilt: Math.sin(lt * 1.6 + k) * 0.03 });
    plain(name, x, GY + 56, 36, INK, { align: 'center', w: 700 });
  });
}
function s10(lt) {
  // 收尾：暗下來的客廳，電視透出紅光，裡面一對夫妻剪影
  g.save(); g.fillStyle = mix(CREAM, INK, 0.14); g.fillRect(0, 0, W, H); g.restore();
  tv(CX, 420, 620, 400, mix(SCAR, INK, 0.2));
  g.save(); g.beginPath(); g.roundRect(CX - 310, 220, 620, 400, 26); g.clip();
  g.globalAlpha = 0.45 + 0.2 * Math.sin(lt * 2.4); G.disc(g, CX, 430, 310, SCAR_L); g.globalAlpha = 1;
  man(CX - 85, 560, 170, INK, { shadow: false });
  man(CX + 85, 560, 170, INK, { dir: -1, shadow: false });
  g.restore();
  g.save(); g.globalAlpha = 0.22 + 0.08 * Math.sin(lt * 2.4);
  G.poly(g, [[CX - 300, 645], [CX + 300, 645], [CX + 470, 850], [CX - 470, 850]], SCAR_L);
  g.restore();
}
function s11(lt) {
  // 第二部：鄰居其實是女巫——紫衣尖帽，黑書飄在旁邊
  man(780, GY, 340, PUR, { pose: 'point', aim: -0.3, face: 'smile' });
  G.poly(g, [[780 - 72, GY - 332], [780 + 72, GY - 332], [780 + 12, GY - 480]], PUR);
  rr(780 - 88, GY - 348, 176, 26, 12, PUR_L);
  g.save(); g.translate(1260, 430 + Math.sin(lt * 1.7) * 14); g.rotate(-0.12);
  rr(-110, -150, 220, 300, 14, mix(INK, PUR, 0.3));
  rr(-94, -134, 188, 268, 10, '#241C2E');
  G.poly(g, [[0, -72], [36, 42], [-36, 42]], PUR_L);
  g.restore();
}
function s12(lt) {
  // 第三部：女巫之路往遠處收，鬼魂阿嘉莎半透明，比利走在前頭
  G.poly(g, [[CX - 90, 250], [CX + 90, 250], [CX + 340, 840], [CX - 340, 840]], SOFT);
  G.seg(g, [CX - 90, 250], [CX - 340, 840], 8, MUTE);
  G.seg(g, [CX + 90, 250], [CX + 340, 840], 8, MUTE);
  g.save(); g.globalAlpha = 0.5;
  man(760, GY, 300, PUR_L, { pose: 'walk', t: lt, shadow: false });
  g.restore();
  man(1150, GY, 260, SKY, { pose: 'walk', t: lt + 0.4 });
}
function s13(lt) {
  // 幻視去了哪：白幻視斜著往上飛，下面的人抬頭看
  man(1150, 360 + Math.sin(lt * 1.5) * 10, 300, WHITE_V, { tilt: -0.5, shadow: false });
  g.strokeStyle = MUTE; g.lineWidth = 8; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const y = 470 + i * 60, sh = loop(lt * 60 + i * 30, 60);
    g.beginPath(); g.moveTo(1150 - 30, y + sh); g.lineTo(1150 - 30, y + sh + 30); g.stroke();
  }
  [620, 740, 860].forEach((x, k) => man(x, GY, 200, [COAT, SKY, SAGE][k], { face: 'worried' }));
}
function s14(lt) {
  // 幻視腦中的宅邸：大房子，窗裡一個個 AI 房客的臉
  prop(g, 'house', { x: CX, y: 680, s: 620 });
  [[CX - 160, 500], [CX, 460], [CX + 160, 500]].forEach(([x, y], k) => {
    rr(x - 48, y - 48, 96, 96, 16, mix(SKY, PAPER, 0.55));
    G.disc(g, x - 14, y - 8, 7, INK); G.disc(g, x + 14, y - 8, 7, INK);
    G.seg(g, [x - 14, y + 16], [x + 14, y + 16 + (k - 1) * 5], 5, INK);
  });
  man(CX - 360, GY, 230, TERRA, { face: 'worried' });
}
function s15(lt) {
  // 湯米：少年站在大問號前面
  prop(g, 'question', { x: 1150, y: 390, s: 320, color: DIM });
  man(850, GY, 300, SAGE, { pose: 'shrug', face: 'worried' });
  man(660, GY, 220, MUTE, { face: 'none' });
}
function s16(lt) {
  // 收尾：電視上的播放鍵亮起來，現在可以開播了
  tv(CX - 170, 430, 620, 400, PAPER);
  g.save(); g.globalAlpha = 0.75 + 0.25 * Math.sin(lt * 2.2);
  G.poly(g, [[CX - 230, 330], [CX - 230, 530], [CX - 80, 430]], SCAR);
  g.restore();
  man(1420, GY, 260, COAT, { pose: 'point', aim: -0.35, dir: -1, face: 'smile' });
}

const SCENES = [s0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11, s12, s13, s14, s15, s16];
// 每段字幕要標紅的關鍵詞
const HL = [
  ['汪達幻視', '三部曲'], ['心靈寶石', '寶石'], ['史塔克', '飛彈', '九頭蛇'], ['奧創', '幻覺'],
  ['幻視', '心靈寶石'], ['汪達', '幻視'], ['薩諾斯', '寶石'], ['化灰', '消失'],
  ['葬禮', '西景鎮', '幻視'], ['莫妮卡', '達西', '吉米', '艾格妮絲'], ['開播', '汪達幻視'],
  ['阿嘉莎', '緋紅女巫', '白幻視', '黑暗神書'], ['比利', '阿嘉莎', '女巫之路'], ['白幻視'],
  ['宅邸', '幻視'], ['湯米', '比利'], ['開播'],
];

// ---------- 段落分組（一句一卡太碎，長片一段一景） ----------
const SECS = [], LSEC = [];
TL.lines.forEach(l => {
  const s = SECS[SECS.length - 1];
  if (!s || s.name !== l.section) SECS.push({ name: l.section, t0: l.t0, t1: l.t1 });
  else s.t1 = l.t1;
  LSEC.push(SECS.length - 1);
});
const N = SECS.length;
if (N !== SCENES.length) throw new Error(`timeline.js 有 ${N} 段，場景 ${SCENES.length} 個，對不上`);
const T0 = SECS.map((s, i) => i === 0 ? 0 : s.t0 - 0.2);
const DUR = TL.dur;
const END0 = TL.lines[TL.lines.length - 1].t1 + 0.3;   // 片尾系列卡
const secAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, sec: LSEC[i] })));

// ---------- 劇透倒數卡：提醒句念完（t1）後的空檔蓋 5 秒倒數 ----------
const WARNS = TL.lines.filter(l => /先停|還沒看/.test(l.text))
  .map(l => ({ t0: l.t1 + 0.2, t1: l.t1 + 5.7, show: (l.text.match(/《([^》]+)》/) || [])[1] || '' }));
function countdown(t) {
  const w = WARNS.find(w => t >= w.t0 && t < w.t1);
  if (!w) return;
  const num = Math.max(1, 5 - Math.floor((t - w.t0) / 1.1));
  g.save(); g.fillStyle = 'rgba(21,17,28,0.55)'; g.fillRect(0, 0, W, H); g.restore();
  rr(CX - 466, 284, 932, 592, 44, SCAR);
  rr(CX - 450, 300, 900, 560, 34, PAPER);
  say('劇透警告', CX, 450, 92, SCAR, 1, { id: 'spoiler', align: 'center', bold: 0.05 });
  plain(String(num), CX, 730, 300, INK, { align: 'center', w: 800 });
  plain(`還沒看《${w.show}》的人，現在可以先關掉`, CX, 815, 42, DIM, { align: 'center', w: 600 });
}

// ---------- 頂部標籤 ----------
function series(secName) {
  plain(SERIES, CX, 70, 34, DIM, { align: 'center', w: 600 });
  rr(CX - 30, 90, 60, 5, 3, TERRA);
  plain(secName, 96, 70, 30, MUTE, { w: 600 });
}

// ---------- 字幕：下方 1/4，一卡一個逗號短語，關鍵詞陶土紅 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = HL[p.sec] || [];
  const px = 48, maxW = 1400;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 950 - (rows.length - 1) * 33;
  rr(CX - 30, y0 - 82, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, CX, y0 + k * 68, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  say(SERIES, CX, 400, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  rr(CX - 30, 432, 60, 5, 3, SAGE);
  [[SKY, CX - 260, 'armsUp'], [SCAR, CX, 'stand'], [PUR, CX + 260, 'armsUp']].forEach(([c, x, pose], k) =>
    man(x, 780, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, CX, 920, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角 ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 24, states: [{ t: 0, state: 'idle' }], looks: SECS.map((s, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
const MASCOT = { x: 1690, y: 90, s: 190 };
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
// 換段＝原地交叉淡化 XF 秒：底色一樣，看起來是小人與道具在原地換狀態，不是切鏡頭。
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawScene(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = secAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawScene(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawScene(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  countdown(t);
  return finish(t);
}
function drawScene(i, t) {
  const lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series(SECS[i].name);
  g.save(); SCENES[i](lt); g.restore();
  g.globalAlpha = 1;
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換段音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([800, 700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
