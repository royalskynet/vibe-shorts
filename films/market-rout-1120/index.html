<script type="module">
// 單人旁白科普，畫面格式照 taipei-silence（米色底、一句一個畫面狀態、字幕一卡一個逗號短語、只有封面大標）。
// 畫風試做：小人、道具、背景都是 AI 生成圖（Agnes 免費模型，見 SOURCES.md），圖表與動作用程式畫。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
// 貼背景前先不透明填滿（fix 12295：接縫半透明像素會漏出上一幀）。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, prop as vprop } from './illust/illust.mjs';
import { loadSprites, propSprite } from './illust/sprite.mjs';
import { person, loadPeople } from './illust/people.mjs';
import { finishGrade, motes, camera, loadPlate, plate } from './illust/scene.mjs';
const prop = (g, n, o) => propSprite(g, n, o, vprop);
await loadSprites('sprites/');
await loadPeople('people/');
const PLATE = await loadPlate('plates/city1.png');
const FP = {};
await Promise.all(['newspaper', 'magnifier', 'chip', 'arrow', 'coins', 'ledger', 'tower', 'siren', 'briefcase', 'domino'].map(async n => {
  const im = new Image(); im.src = `props/${n}.png`; await im.decode(); FP[n] = im;
}));
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
const MUTE = '#B3A797', DIM = '#8C7B6B', RED_D = '#9A3A28';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '用腦袋看世界', EP = 1, HANDLE = '@paradoxbar';
const GY = 1270;   // 小人腳底

// 會出現在畫面上的事實數字集中在這裡；每一個都要在 meta/facts.md 有一行附來源。
const FACTS = {
  SPX_DAY: 3.7,        // F1 標普 500 11/20 −3.70%
  NDX_DAY: 5.3,        // F1 Nasdaq 綜合 −5.28%
  NDX_WEEK_T: 4,       // F2 那一週 Nasdaq 成分股市值蒸發超過 4 兆美元
  NVDA_DAY: 14,        // F3 輝達 −14.01%
  NVDA_CLOSE: 125.53,  // F3 收盤價
  NVDA_WEEK: 23,       // F2 輝達當週 −23%
  Y2008: 2008,         // F2 金融海嘯以來最慘的一週
  AVGO: 12,            // F1 博通 −12.19%
  MU: 14,              // F1 美光 −13.89%
  AMD: 13,             // F1 超微 −13.25%
  SOX: 10.7,           // F1 費城半導體 −10.73%
  CORR: 10,            // F1 標普與道瓊都比紀錄高點低超過 10%
  SPX_WEEK: 8.6,       // F1 標普當週 −8.61%
};
const minus = n => `−${n}%`;

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });

// AI 道具圖：預設底邊置中；o.mid 改成中心；o.rot 弧度；o.dir -1 左右翻
function img(n, x, y, h, o = {}) {
  const im = FP[n], w = im.naturalWidth * h / im.naturalHeight;
  g.save(); g.translate(x, y);
  if (o.alpha != null) g.globalAlpha *= o.alpha;
  if (!o.mid && o.shadow !== false) {
    g.save(); g.scale(1, 0.16);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.55);
    gr.addColorStop(0, 'rgba(70,45,30,0.32)'); gr.addColorStop(1, 'rgba(70,45,30,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, w * 0.55, 0, 7); g.fill(); g.restore();
  }
  if (o.rot) g.rotate(o.rot);
  if ((o.dir ?? 1) < 0) g.scale(-1, 1);
  g.drawImage(im, -w / 2, o.mid ? -h / 2 : -h, w, h);
  g.restore();
  return w;
}

// ---------- 長條：rows=[{name, val, col, tc, label}] ----------
function bars(o) {
  const x0 = o.x0 ?? 120, w = o.w ?? 800, gap = o.gap ?? 200, bh = o.bh ?? 100;
  o.rows.forEach((r, j) => {
    const y = o.y + j * gap, pk = E.o3(inv(0.15 + j * 0.2, 1.1 + j * 0.2, o.lt));
    plain(r.name, x0, y - 16, 42, INK, { w: 600 });
    rr(x0, y, w, bh, 20, '#EBE1D2');
    rr(x0, y, Math.max(16, w * (r.val / o.max) * pk), bh, 20, r.col);
    g.globalAlpha = inv(0.5, 0.9, pk); plain(r.label, x0 + w, y - 16, 42, r.tc, { align: 'right', w: 800 }); g.globalAlpha = 1;
  });
}
// 白卡片加一圈有色外框（藏字檢查算得到畫面）
function framed(cx, cy, w, h, col, a = 1) {
  g.save(); g.globalAlpha *= a; rr(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36, 34, col); g.restore();
  prop(g, 'card', { x: cx, y: cy, w, h, alpha: a });
}
// 折線圖：pts 是 [0..1, 0..1]（y 往下為跌）；畫到 lt 對應的進度
function lineChart(lt, o) {
  const { x, y, w, h, pts, col = TERRA, t0 = 0.2, t1 = 2.2 } = o, p = E.o3(inv(t0, t1, lt));
  g.save(); g.strokeStyle = 'rgba(140,123,107,0.35)'; g.lineWidth = 3; g.setLineDash([10, 12]);
  g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + w, y + h); g.stroke(); g.setLineDash([]);
  const seg = pts.slice(1).map((q, i) => Math.hypot((q[0] - pts[i][0]) * w, (q[1] - pts[i][1]) * h));
  const tot = seg.reduce((a, b) => a + b, 0); let left = tot * p, lx = x + pts[0][0] * w, ly = y + pts[0][1] * h;
  g.strokeStyle = col; g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(lx, ly);
  for (let i = 0; i < seg.length; i++) {
    const a = pts[i], b = pts[i + 1], k = seg[i] ? Math.min(1, left / seg[i]) : 1;
    lx = x + (a[0] + (b[0] - a[0]) * k) * w; ly = y + (a[1] + (b[1] - a[1]) * k) * h; g.lineTo(lx, ly);
    left -= seg[i]; if (left <= 0) break;
  }
  g.stroke(); g.fillStyle = col; g.beginPath(); g.arc(lx, ly, 16, 0, 7); g.fill(); g.restore();
  return [lx, ly];
}
// 骨牌：n 張，從 x0 起每 gap 一張，依序往右倒；all=true 全倒
function dominoes(lt, x0, n, gap, h, all) {
  const w = FP.domino.naturalWidth * h / FP.domino.naturalHeight;
  for (let i = 0; i < n; i++) {
    const p = all ? 1 : E.io(inv(0.3 + i * 0.22, 0.85 + i * 0.22, lt)), x = x0 + i * gap;
    g.save(); g.translate(x + w / 2, GY); g.rotate(p * 1.25);
    g.drawImage(FP.domino, -w, -h, w, h); g.restore();
  }
}

// ---------- 每張卡的畫面（畫在 y 500–1290；x≥860、y<490 是主播位置） ----------

}

function c10(lt) {   // 標普與道瓊跌進修正區

  plain(`低於高點 ${FACTS.CORR}%　修正區`, 930, y0 + k * 0.5 - 14, 34, RED_D, { align: 'right', w: 700 });
  lineChart(lt, { x: 150, y: y0, w: 780, h: k * 0.62, pts: [[0, 0.02], [0.3, 0.12], [0.55, 0.3], [0.8, 0.7], [1, 1]] });
  img('siren', 150, GY, 240);
  man(890, GY, 360, COAT, { who: 'C', pose: 'stand', face: 'worried', dir: -1 });

function c11(lt) {   // 標普一週 −8.6%，2025 年 4 月以來最大

  plain('2025 年 4 月以來最大', 650, 930, 38, INK, { align: 'center', w: 700 });

  man(920, GY, 380, COAT, { who: 'B', pose: 'point', dir: -1, face: 'worried' });

const CARDS = [
  { head: '一則報導美股重挫', hud: 'WSJ／Swingfolio 2026-11-20', hl: ['三點七'], draw: c1 },
  { head: '被查帳', hud: '示意圖', hl: ['拖垮'], draw: c2 },
  { head: '納斯達克', hud: 'WSJ 2026-11-20', hl: ['五點三', '四兆'], draw: c3 },
  { head: '查帳報導', hud: 'Reuters 2026-11-20', hl: ['會計'], draw: c4 },
  { head: '輝達重挫', hud: 'Yahoo Finance 2026-11-20', hl: ['百分之十四', '一百二十五點五三'], draw: c5 },
  { head: '最慘一週', hud: 'WSJ／CNBC 2026-11-20', hl: ['百分之二十三', '最慘'], draw: c6 },
  { head: '連帶下跌', hud: '示意圖', hl: ['不只輝達'], draw: c7 },
  { head: '晶片股', hud: 'Swingfolio（Reuters）', hl: ['百分之十二', '百分之十四', '百分之十三'], draw: c8 },
  { head: '半導體指數', hud: 'Swingfolio 2026-11-20', hl: ['十點七'], draw: c9 },
  { head: '修正區', hud: 'WSJ 2026-11-20', hl: ['修正區'], draw: c10 },
  { head: '單週跌幅', hud: 'Swingfolio（Reuters）', hl: ['八點六', '最大'], draw: c11 },
  { head: '整排人工智慧股', hud: '示意圖', hl: ['拖下去'], draw: c12 },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾系列卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部系列標籤 ----------
function series() {
  plain(`${SERIES}｜系列`, 540, 150, 34, DIM, { align: 'center', w: 600 });
  rr(510, 172, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 1400 - (rows.length - 1) * 36;
  rr(510, y0 - 92, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  plate(g, PLATE, { hz: 0.67, gy: 1262 });
  const lt = t - END0;
  say(SERIES, 540, 640, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  say(`第 ${EP} 集`, 540, 720, 44, TERRA, 1, { id: 'end-ep', align: 'center' });
  rr(510, 752, 60, 5, 3, TERRA);
  [['A', 330, 'armsUp'], ['B', 540, 'stand'], ['C', 750, 'armsUp']].forEach(([w, x, pose], k) => man(x, 1170, 300, COAT, { who: w, pose, tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1290, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角 ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
const MASCOT = { x: 650, y: 172, s: 410 };
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, im = new Image();
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return im.decode().then(() => {
    if (tok !== mascotTok) return;
    g.drawImage(im, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);   // 先填滿不透明底（fix 12295）
  plate(g, PLATE, { hz: 0.67, gy: 1262 });
  series();
  // 只留封面大標：第 0 卡第 0 幀完整顯示，其他卡不畫大標
  if (i === 0) { say(cd.head.slice(0, 4), 40, 300, 150, INK, 1, { id: 'head1' }); say(cd.head.slice(4), 40, 470, 150, INK, 1, { id: 'head2' }); }
  g.save(); camera(g, clamp(lt / 6, 0, 1)); cd.draw(lt); g.restore();
  motes(g, t); finishGrade(g);
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1530, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂，不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%$−';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
</body>
