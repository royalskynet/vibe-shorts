<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>投資人為什麼要黃仁勳回來</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#mascot{display:none}#mascot svg{width:340px;height:340px}</style>
<script src="engine.js"></script>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="mascot"></div>
<script type="module">
// 單人旁白科普，米色插畫風（範本 films/taipei-silence，同系列 films/nvidia-short）：全片同一張底、不硬切，一句一個畫面，只有封面有大標。
// 禁止清單（TREATMENT.md）：不畫真人臉、不放公司 logo、不放新聞截圖；人物用扁平小人；私人感情與間諜指控不畫。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
// 角色色：黃仁勳＝深色皮衣、兩位投資人＝鼠尾草綠、董事會＝COAT、分析師＝芥末黃、斯卡拉穆奇＝梅紫、匿名消息來源＝灰
const JACKET = '#2F2723', PLUM = '#9A6A8C', SAGE = '#7FA57A', SAGE_D = '#557A51', MUTE = '#B3A797', SOFT = '#EBE1D2', DIM = '#8C7B6B';
const MUST_D = '#9A6F1C', TERRA_D = '#9E4A33', WOOD = '#A5835D';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '新聞背後的帳', EP = 2, HANDLE = '@paradoxbar';
const GY = 1270;   // 畫面地平線：小人腳底；字幕短橫線在 1308

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。
const FACTS = {
  M: 11,           // F1／F2 月份
  D_INV: 8,        // F2 董事會宣布獨立調查
  D_RES: 11,       // F1 董事會接受辭職（SEC 8-K，美東）
  PET: 180000,     // F8 連署近 18 萬（CNBC 2026-11-16）
};
const fmt = n => n.toLocaleString('en-US');

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  // PingFang 最粗只到 Semibold；o.bold 描同色邊加粗，大標在奶油底上才讀得出（封面 OCR）
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });
// 畫面裡的數字標籤：比字幕大一點、遠小於大標（< precheck HEADLINE_PX），算插畫的一部分
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });

// ---------- 40 人方陣（連署用）----------
const PERM = (() => { const r = G.rng(11), a = [...Array(40).keys()]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const POSE_MIX = (() => { const r = G.rng(23); return Array.from({ length: 40 }, () => { const v = r(); return v < 0.62 ? ['stand', 1] : v < 0.72 ? ['armsUp', 1] : v < 0.82 ? ['point', r() < 0.5 ? 1 : -1] : v < 0.91 ? ['think', 1] : ['shrug', 1]; }); })();
function crowd(o) {
  const s = 120, nc = 8, dx = 116, dy = 146;
  const x0 = 540 - dx * (nc - 1) / 2 - dx * 0.25, y0 = o.y0;
  for (let k = 0; k < 40; k++) {
    const r = Math.floor(k / nc), c = k % nc;
    const x = x0 + c * dx + (r % 2 ? dx * 0.5 : 0), y = y0 + r * dy;
    const pk = E.io(inv(0.1 + (PERM[k] / 40) * 1.6, 0.5 + (PERM[k] / 40) * 1.6, o.lt));
    const [pose, dir] = pk > 0.5 ? POSE_MIX[k] : ['stand', 1];
    man(x, y, s, mix(SOFT, SAGE, pk), { pose, dir, face: 'none' });
  }
}

function framed(cx, cy, w, h, col, a = 1) {
  g.save(); g.globalAlpha *= a; rr(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36, 34, col); g.restore();
  prop(g, 'card', { x: cx, y: cy, w, h, alpha: a });
}

// ---------- 小道具 ----------
const doc = o => prop(g, 'document', { fill: '#E3BE78', lineColor: '#9A7646', ...o });
function chart(x0, y0, w, h, pts, col, p) {
  const n = pts.length - 1, upto = p * n;
  g.strokeStyle = col; g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let k = 0; k <= Math.floor(upto); k++) { const x = x0 + w * k / n, y = y0 + h * (1 - pts[k]); k ? g.lineTo(x, y) : g.moveTo(x, y); }
  const k0 = Math.floor(upto), f = upto - k0;
  if (k0 < n) g.lineTo(x0 + w * (k0 + f) / n, y0 + h * (1 - lerp(pts[k0], pts[k0 + 1], f)));
  g.stroke();
}
function lens(x, y, r) {
  g.strokeStyle = INK; g.lineWidth = r * 0.22; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + r * 0.7, y + r * 0.7); g.lineTo(x + r * 1.6, y + r * 1.6); g.stroke();
  g.fillStyle = 'rgba(255,250,242,0.55)'; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.lineWidth = r * 0.16; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
}
function table() {
  rr(60, 1080, 960, 34, 14, WOOD);
  rr(80, 1106, 920, GY - 1106, 10, '#C7A77F');
  g.fillStyle = 'rgba(59,47,42,0.08)'; g.fillRect(80, 1106, 920, 18);
}
function door(cx, top, w, open, light) {
  rr(cx - w / 2 - 16, top - 16, w + 32, GY - top + 16, 18, WOOD);
  rr(cx - w / 2, top, w, GY - top, 10, light ? '#F2D48A' : SOFT);
  const lw = w * (1 - open);
  rr(cx - w / 2, top, lw, GY - top, 10, '#C7A77F');
  if (lw > 20) G.disc(g, cx - w / 2 + lw - 26, (top + GY) / 2, 9, INK);
}

// ---------- 每張卡的畫面（畫在 y 500–1290；x≥875、y<480 是主播位置）----------
function c1(lt) {
  // 封面：三個投資人在原地聳肩，黃仁勳往門走
  const p = E.io(inv(0.2, 3.0, lt));
  door(960, 700, 190, 0, false);
  [170, 370, 570].forEach((x, k) => {
    man(x, GY, 340, SAGE, { pose: 'shrug', face: 'worried', tilt: Math.sin(lt * 2.2 + k) * 0.03 });
    prop(g, 'question', { x: x + 6, y: GY - 400 + Math.sin(lt * 2.5 + k) * 8, s: 70, color: DIM });
  });
  man(lerp(690, 830, p), GY, 380, JACKET, { pose: p > 0 && p < 1 ? 'walk' : 'stand', t: lt, face: 'worried' });
}
function c2(lt) {
  // 兩位投資人把公開信遞向董事會
  const p = E.io(inv(0.2, 1.8, lt));
  [130, 290].forEach(x => man(x, GY, 360, SAGE, { pose: 'point', aim: -0.15, face: 'smile' }));
  doc({ x: lerp(450, 640, p), y: 880, s: 380, title: '公開信', titlePx: 11, lines: 3 });
  [860, 990].forEach(x => man(x, GY, 330, COAT, { pose: 'stand', dir: -1, face: 'none' }));
  plain('董事會', 925, 800, 40, INK, { align: 'center', w: 700 });
}
function c3(lt) {
  // 門開著，黃仁勳往回走，旁邊的人指著門、頭上燈泡亮
  door(250, 640, 230, E.io(inv(0.1, 1.6, lt)) * 0.6, false);
  const p = E.io(inv(0.3, 2.4, lt));
  man(lerp(640, 430, p), GY, 400, JACKET, { pose: p > 0 && p < 1 ? 'walk' : 'stand', dir: -1, t: lt, face: 'smile' });
  man(850, GY, 400, SAGE, { pose: 'point', dir: -1, aim: -0.25, face: 'smile' });
  prop(g, 'bulb', { x: 840, y: 700, s: 180, on: pop(lt, 0.8, 0.6), t: lt });
}
function c4(lt) {
  // 董事會開會，桌上一份獨立調查文件
  [190, 380, 570, 760].forEach((x, k) => man(x, GY, 300, COAT, { pose: k === 1 ? 'point' : 'stand', aim: -0.2, face: 'worried', shadow: false, tilt: Math.sin(lt * 2 + k) * 0.02 }));
  table();
  plain('輝達董事會', 540, 620, 48, INK, { align: 'center', w: 700 });
  plain(`${FACTS.M} 月 ${FACTS.D_INV} 日`, 540, 690, 40, TERRA_D, { align: 'center', w: 700 });
  doc({ x: 540, y: 960, s: 220, title: '獨立調查', titlePx: 11, lines: 3, alpha: pop(lt, 0.4) });
  lens(900 + Math.sin(lt * 1.6) * 20, 900, 50);
}
function c5(lt) {
  // 一份報導旁邊立著靶心（「目標」的意思），黃仁勳站在一旁，靶心不套在人身上
  doc({ x: 200, y: 860, s: 380, title: '報導', titlePx: 11, lines: 3 });
  [[200, MUTE], [150, SOFT], [100, MUTE], [50, TERRA]].forEach(([r, c]) => G.disc(g, 600, 900, r * (0.6 + 0.4 * E.o3(inv(0.1, 1.2, lt))), c));
  man(930, GY, 380, JACKET, { pose: 'stand', dir: -1, face: 'worried' });
}

function c6(lt) {
  // 董事會說「沒有理由」：鎖住的箱子打勾
  man(180, GY, 400, COAT, { pose: 'point', aim: -0.2, face: 'none' });
  plain('董事會', 180, 760, 40, INK, { align: 'center', w: 700 });
  rr(400, 900, 300, 240, 36, SAGE_D);
  g.strokeStyle = INK; g.lineWidth = 36; g.lineCap = 'round'; g.beginPath(); g.arc(550, 900, 80, Math.PI, Math.PI * 2); g.stroke();
  G.disc(g, 550, 1000, 22, CREAM); rr(541, 1000, 18, 48, 8, CREAM);
  const q = pop(lt, 0.7, 0.5);
  if (q > 0) {
    g.globalAlpha = q; g.strokeStyle = TERRA; g.lineWidth = 22; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath(); g.moveTo(800, 880); g.lineTo(850, 940); g.lineTo(960, 800); g.stroke(); g.globalAlpha = 1;
  }
  plain('國安與機密', 550, 780, 40, DIM, { align: 'center', w: 700 });
}
function c7(lt) {
  // 時間軸：三天後辭職；公告是一張空白文件加問號
  const y = 800, e = E.io(inv(0.1, 1.4, lt));
  g.strokeStyle = INK; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(140, y); g.lineTo(140 + 800 * e, y); g.stroke();
  G.disc(g, 260, y, 22, TERRA); G.disc(g, 700, y, 22, TERRA);
  plain(`${FACTS.M}/${FACTS.D_INV}`, 260, y - 50, 56, INK, { align: 'center', w: 800 });
  plain(`${FACTS.M}/${FACTS.D_RES}`, 700, y - 50, 56, INK, { align: 'center', w: 800 });
  plain('三天', 480, y + 80, 44, TERRA_D, { align: 'center', w: 700 });
  doc({ x: 380, y: 1080, s: 280, title: '公告', titlePx: 11, lines: 1, alpha: pop(lt, 0.9) });
  prop(g, 'question', { x: 700, y: 1060 + Math.sin(lt * 2.5) * 8, s: 170, color: INK, alpha: pop(lt, 1.2) });
}
function c8(lt) {
  // 兩位基金負責人
  [[300, '格斯納'], [780, '貝克']].forEach(([x, name], k) => {
    rr(x - 150, 620, 300, 76, 38, SOFT);
    plain(name, x, 672, 46, INK, { align: 'center', w: 700 });
    plain('基金負責人', x, 756, 34, DIM, { align: 'center', w: 600 });
    man(x, GY, 420, SAGE, { pose: k ? 'stand' : 'armsUp', face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.03 });
  });
}
function c9(lt) {
  // 選項清單，黃仁勳回任那一列被標出來
  framed(540, 840, 840, 520, SAGE);
  const rows = ['內部人選', '外部人選', '黃仁勳回任'];
  rows.forEach((s, j) => {
    const y = 700 + j * 150, last = j === 2, q = last ? pop(lt, 0.9, 0.5) : 1;
    rr(150, y - 56, 780, 108, 26, last ? mix(SOFT, TERRA, q) : SOFT);
    plain(s, 200, y + 14, 50, last && q > 0.5 ? CREAM : INK, { w: 700 });
  });
}
function c10(lt) {
  // 別急：時鐘走得慢，兩邊的人舉手示意
  const cx = 540, cy = 880, a = -Math.PI / 2 + lt * 0.9;
  G.disc(g, cx, cy, 262, INK); G.disc(g, cx, cy, 246, '#F2ECE2');
  for (let k = 0; k < 12; k++) { const t = k / 12 * Math.PI * 2; g.strokeStyle = INK; g.lineWidth = 8; g.beginPath(); g.moveTo(cx + Math.cos(t) * 205, cy + Math.sin(t) * 205); g.lineTo(cx + Math.cos(t) * 232, cy + Math.sin(t) * 232); g.stroke(); }
  g.strokeStyle = INK; g.lineCap = 'round'; g.lineWidth = 16; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(-0.6) * 120, cy + Math.sin(-0.6) * 120); g.stroke();
  g.strokeStyle = TERRA; g.lineWidth = 10; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * 190, cy + Math.sin(a) * 190); g.stroke();
  G.disc(g, cx, cy, 16, INK);
  man(130, GY, 340, SAGE, { pose: 'armsUp', face: 'worried' });
  man(950, GY, 340, SAGE, { pose: 'armsUp', dir: -1, face: 'worried' });
}
function c11(lt) {
  // 信沒有寫「立刻復職」：這四個字被劃掉
  framed(540, 800, 800, 260, TERRA);
  plain('立刻復職', 540, 830, 64, INK, { align: 'center', w: 800 });
  const e = E.io(inv(0.5, 1.5, lt));
  g.strokeStyle = TERRA_D; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(240, 810); g.lineTo(240 + 600 * e, 810); g.stroke();
  man(540, GY, 330, JACKET, { pose: 'shrug', face: 'worried' });
}
function c12(lt) {
  // 分析師說股價：折線往上
  framed(540, 790, 880, 420, SAGE);
  plain('股價', 170, 650, 44, INK, { w: 700 });
  chart(170, 680, 740, 220, [0.15, 0.3, 0.22, 0.45, 0.6, 0.82], SAGE_D, E.io(inv(0.2, 2.0, lt)));
  man(200, GY, 250, MUST, { pose: 'point', aim: -0.5, face: 'smile' });
  plain('Counterpoint 分析師', 480, 1215, 46, INK, { w: 700 });
}
function c13(lt) {
  // 一個節奏點，八個節點繞著它轉
  const cx = 540, cy = 800, p = E.io(inv(0.1, 1.2, lt));
  for (let k = 0; k < 8; k++) {
    const a = lt * 0.5 + k * Math.PI / 4, x = cx + Math.cos(a) * 250 * p, y = cy + Math.sin(a) * 250 * p;
    g.globalAlpha = 0.4; g.strokeStyle = INK; g.lineWidth = 6; g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke(); g.globalAlpha = 1;
    G.disc(g, x, y, 46, [SAGE, MUST, COAT, MUTE][k % 4]);
  }
  G.disc(g, cx, cy, 86 + Math.sin(lt * 4) * 6, TERRA);
  plain('節奏', cx, cy + 14, 44, CREAM, { align: 'center', w: 800 });
  man(150, GY, 280, MUST, { pose: 'point', aim: -0.4, face: 'smile' });
}
function c14(lt) {
  // 連署：方陣逐人變綠，上方一個大數字
  crowd({ y0: 700, lt });
  fig(`近 ${FACTS.PET / 10000} 萬筆簽名`, 540, 540, TERRA_D, inv(0.4, 0.9, lt), 'fig-pet');
}
function c15(lt) {
  // 也有人不看好：聳肩搖頭，頭上問號
  man(540, GY, 440, PLUM, { pose: 'shrug', face: 'worried', tilt: Math.sin(lt * 3) * 0.04 });
  [-1, 1].forEach(s => prop(g, 'question', { x: 540 + s * 190, y: 850 + Math.sin(lt * 2.5 + s) * 10, s: 100, color: DIM, alpha: pop(lt, 0.5) }));
  man(160, GY, 260, MUTE, { pose: 'shrug', face: 'worried' });
  man(920, GY, 260, MUTE, { pose: 'shrug', dir: -1, face: 'worried' });
}
function c16(lt) {
  // 連署撞上調查這道牆
  const e = E.io(inv(0.2, 1.6, lt)), bounce = 36 * pop(lt, 1.7, 0.4);
  rr(640, 620, 170, GY - 620, 16, '#5A463C');
  plain('調查', 725, 590, 48, INK, { align: 'center', w: 700 });
  lens(725, 900, 66);
  doc({ x: lerp(120, 470, e) - bounce, y: 900, s: 330, title: '連署', titlePx: 11, lines: 3 });
  man(940, GY, 380, PLUM, { pose: 'point', dir: -1, aim: -0.3, face: 'worried' });
}
function c17(lt) {
  // 匿名消息來源對董事會桌：董事會沒在考慮
  [190, 380, 570].forEach((x, k) => man(x, GY, 360, COAT, { pose: k === 1 ? 'think' : 'stand', face: 'worried', shadow: false, tilt: Math.sin(lt * 2 + k) * 0.02 }));
  table();
  plain('董事會', 380, 660, 46, INK, { align: 'center', w: 700 });
  man(880, GY, 380, MUTE, { pose: 'point', dir: -1, aim: -0.25, face: 'none' });
  plain('ABC', 880, 660, 44, INK, { align: 'center', w: 800 });
  plain('知情人士', 880, 725, 44, INK, { align: 'center', w: 700 });
  prop(g, 'speech', { x: 840, y: 850 + Math.sin(lt * 3) * 6, s: 120, tail: 'left', color: DIM, alpha: pop(lt, 0.5) });
}
function c18(lt) {
  // 門留一道縫，光漏出來；兩位投資人守在兩側
  door(540, 640, 260, lerp(0.15, 0.4, E.io(inv(0.2, 3.0, lt))), true);
  man(240, GY, 380, SAGE, { pose: 'stand', face: 'smile', tilt: Math.sin(lt * 2) * 0.03 });
  man(850, GY, 380, SAGE, { pose: 'stand', dir: -1, face: 'smile', tilt: Math.sin(lt * 2 + 1) * 0.03 });
}

// head：卡名。只有封面（第 0 卡）畫成大標。
const CARDS = [
  { head: '要他回來', hud: '示意圖', hl: ['辭職', '換人'], draw: c1 },
  { head: '公開信', hud: 'CNBC', hl: ['公開寫信', '別急著'], draw: c2 },
  { head: '回來的可能', hud: 'CNBC', hl: ['回來的可能', '先留著'], draw: c3 },
  { head: '獨立調查', hud: '輝達董事會聲明', hl: ['獨立調查'], draw: c4 },
  { head: '情報行動', hud: '輝達董事會聲明', hl: ['外國情報行動'], draw: c5 },
  { head: '沒有理由', hud: '輝達董事會聲明', hl: ['沒有理由'], draw: c6 },
  { head: '辭職', hud: 'SEC 公開文件', hl: ['沒寫原因'], draw: c7 },
  { head: '寫信的人', hud: 'CNBC', hl: ['格斯納', '貝克'], draw: c8 },
  { head: '選項', hud: 'CNBC｜選項列為示意', hl: ['黃仁勳回任的可能'], draw: c9 },
  { head: '別急', hud: 'CNBC', hl: ['別急著換掉他'], draw: c10 },
  { head: '沒有要求', hud: 'CNBC', hl: ['沒有要求'], draw: c11 },
  { head: '股價', hud: 'CNBC｜折線為示意', hl: ['好事'], draw: c12 },
  { head: '節奏', hud: 'CNBC', hl: ['節奏'], draw: c13 },
  { head: '連署', hud: 'CNBC｜人像為示意', hl: ['近十八萬人'], draw: c14 },
  { head: '不看好', hud: '示意圖', hl: ['不看好'], draw: c15 },
  { head: '調查', hud: 'CNBC', hl: ['改變不了'], draw: c16 },
  { head: '董事會', hud: 'ABC News', hl: ['沒在考慮'], draw: c17 },
  { head: '門', hud: '示意圖', hl: ['先別關上'], draw: c18 },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾系列卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部系列標籤 ----------
function series() {
  plain(`${SERIES}｜系列`, 540, 150, 34, DIM, { align: 'center', w: 600 });
  rr(510, 172, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 1400 - (rows.length - 1) * 36;
  rr(510, y0 - 92, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  // 系列名比照參考帳號片尾：中等字級（< precheck HEADLINE_PX），三個小人是主角
  say(SERIES, 540, 640, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  say(`第 ${EP} 集`, 540, 720, 44, TERRA, 1, { id: 'end-ep', align: 'center' });
  rr(510, 752, 60, 5, 3, SAGE);
  [[SAGE, 330, 'armsUp'], [MUST, 540, 'stand'], [TERRA, 750, 'armsUp']].forEach(([c, x, pose], k) => man(x, 1150, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1260, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角，寫法照 films/elected-dictator ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  // 嘴跟旁白開合；表情維持 idle
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
// 畫框 x 875 起、y 260 起、邊長 224（框右緣的透明留白超出畫面無妨），可見身形約 x 906–1067、y 299–455：
// IG 主頁格把 9:16 置中裁成 3:4（上下各裁約 240px），整隻要在 y 240 以下；左邊讓開置中大標（最寬到 x 890）。
const MASCOT = { x: 875, y: 260, s: 224 };
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：底色一樣，看起來是小人與道具在原地換狀態，不是切鏡頭。
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series();
  // 只留封面大標（使用者 11-04）：第 0 卡第 0 幀就完整顯示，其他卡不畫大標副標，畫面當主角
  if (i === 0) say(cd.head, 540, 370, 170, INK, 1, { id: 'head1', align: 'center' });  // 170px 不描邊：bold 0.05 會糊（11-11 使用者回報）
  g.save(); cd.draw(lt); g.restore();
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1530, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
</body>
</html>
