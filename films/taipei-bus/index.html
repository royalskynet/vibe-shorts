const g = document.getElementById('c').getContext('2d', { alpha: false });

  NARROW_LANE_M: 3,          // 外車道 3 公尺

// ---------- 字 ----------
let TXT = [], NOW = 0;
function say(s, x, y, px, col, p, o = {}) {

  // 原地淡入，不往上滑（使用者 10-30：頻繁滑入眼睛不舒服；對標 @boundless__explorer DemDuhNk1ZR 全片無滑入）
  g.save(); g.font = font; g.letterSpacing = o.ls || '0px'; g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y); g.restore();
  if (o.id) {

    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });

}
function plain(s, x, y, px, col, o = {}) {
  g.font = o.mono ? MONO(px, o.w || 500) : ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.letterSpacing = o.ls || '0px'; g.fillStyle = col; g.fillText(s, x, y); g.letterSpacing = '0px';

const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));   // 不用回彈（語氣沉穩）
const loop = (x, n) => ((x % n) + n) % n;

// ---------- 舞台：y 800–1630 的圓角框，框內畫什麼都裁在裡面 ----------
const ST = { x: 60, y: 800, w: 960, h: 830 };
function stage(fn) {
  g.save(); g.beginPath(); g.roundRect(ST.x, ST.y, ST.w, ST.h, 28); g.clip();
  g.fillStyle = BG2; g.fillRect(ST.x, ST.y, ST.w, ST.h);

function cam(px, py, k, fn) { g.save(); g.translate(px, py); g.scale(k, k); g.translate(-px, -py); fn(); g.restore(); }

// ---------- 俯視路口 ----------

  return { lw, lanes, hw, r, set, d0, zw: 78 };

const ARMS = [[1, 0], [-1, 0], [0, 1], [0, -1]];   // 東西南北四支

// 北上外側車道右轉往東：回傳走了 s 像素時的位置與車頭方向
function turnAt(o, s, y0 = o.cy + 900) {
  const { lw, hw, r } = geo(o), R = r + lw / 2, Cx = o.cx + hw + r, Cy = o.cy + hw + r;

function car(x, y, a, col = ORL, len = 96, wid = 48) {
  g.save(); g.translate(x, y); g.rotate(a);
  g.fillStyle = col; g.beginPath(); g.roundRect(-len / 2, -wid / 2, len, wid, 12); g.fill();

// ---------- 側視人形 ----------
function person(x, y, s, col, o = {}) {   // 原點＝腳底，s＝身高；o.cane 拐杖、o.bag 書包、o.ph 走路相位

// ---------- 圖表零件 ----------

}
// —— 落點 ——
function calmCross(lt) {   // 路口收小，同一台車轉彎變慢、停在斑馬線前
  const k = E.io(inv(0.2, 2.0, lt));
  const o = { ...X0, r: lerp(130, 40, k), bulb: k, set: 40 * k };
  stage(() => {
    crossing(o);
    const s = loop(lt * 300 + 600, 2200), p = turnAt(o, s);
    car(p.x, p.y, p.a); arrow(p.x, p.y, p.a, lerp(120, 30, k), GREEN);
  });
}
function elders(lt) {   // 阿公阿嬤慢慢走過斑馬線，車停在線前
  stage(() => {
    g.fillStyle = '#2c2926'; g.fillRect(ST.x, 1520, ST.w, 110);
    zebraSide(330, 820, 1480);
    sideCar(280, 1480, DIM, 0.9);
    const x = 360 + lt * 45;
    person(x, 1480, 260, CREAM, { cane: true, ph: lt * 2.2 });
    person(x + 150, 1480, 250, ORL, { cane: true, ph: lt * 2.2 + 1.5 });
    G.disc(g, 920, 920, 50, rgba(GOLD, 0.5));
  });
}
function kids(lt) {   // 放學：小朋友沿人行道慢慢走
  stage(() => {
    g.fillStyle = '#2c2926'; g.fillRect(ST.x, 1500, ST.w, 130);
    school(220, 1300, 260, rgba(CREAM, 0.5), GOLD);
    const cols = [GOLD, BLUE, GREEN, ORL];
    for (let j = 0; j < 4; j++) person(360 + j * 140 + lt * 40, 1500, 170 + (j % 2) * 20, CREAM, { bag: cols[j], ph: lt * 2.6 + j });
    G.disc(g, 880, 940, 60, rgba(OR, 0.55));
  });
}
function everyone(lt) {   // 每個人：老、小、大人一起慢慢走
  stage(() => {
    g.fillStyle = '#2c2926'; g.fillRect(ST.x, 1520, ST.w, 110);
    zebraSide(170, 960, 1480);
    const crowd = [[200, CREAM, { cane: true }, 250], [340, ORL, { bag: GOLD }, 170], [470, GOLD, {}, 290], [620, CREAM, { bag: BLUE }, 160], [740, BLUE, {}, 280], [870, ORL, { cane: true }, 240]];
    crowd.forEach(([x, col, o, s], j) => person(x + lt * 30 - 60, 1480, s, col, { ...o, ph: lt * 2.4 + j }));
    g.globalAlpha = 0.5; sideCar(160, 1480, DIM, 0.6); g.globalAlpha = 1;
  });
}
function question(lt) {   // 線稿路口留兩條轉彎軌跡：慢的貼轉角、快的大弧度
  stage(() => {
    const o = { ...X0, r: 110, line: true }; crossing(o);
    const slow = { ...X0, r: 30 }, fast = { ...X0, r: 170 };
    [[slow, GREEN, 260], [fast, RED, 620]].forEach(([q, col, v]) => {
      g.strokeStyle = rgba(col, 0.8); g.lineWidth = 8; g.setLineDash([16, 14]); g.beginPath();
      for (let s = 0; s < 1800; s += 20) { const p = turnAt(q, s); s ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); }
      g.stroke(); g.setLineDash([]);
      const p = turnAt(q, loop(lt * v, 1800)); car(p.x, p.y, p.a, col, 80, 40);
    });
    const k = pop(lt, 0.8); if (k > 0) { g.save(); g.translate(860, 1000); g.scale(k, k); plain('？', 0, 60, 220, GOLD, { align: 'center', w: 800 }); g.restore(); }
  });
}

// ---------- 卡 ----------
// 一張卡對一句旁白（timeline.js 第 i 句）；卡的起點＝那句開口前 0.25 秒。hud＝數字的出處。
const CARDS = [
  { head: '行人地獄', sub: '為什麼要用跑的？', hud: '示意圖', draw: hookCross },
  { head: '行人地獄', sub: '想開快', hud: '道路設計通論', draw: wideLanes },
  { head: '行人地獄', sub: `CNN · ${FACTS.CNN_YEAR}`, hud: 'CNN Travel', draw: cnn },
  { head: `${FACTS.PED_DEATHS_2024} 人`, sub: `${FACTS.PED_YEAR} · 全台行人失去生命`, hud: '交通部（經 TVBS、公視）', draw: lt => deaths(lt, 0) },
  { head: '路寬', hud: '示意圖', draw: tape },
  { head: '路寬', sub: '越寬越敢踩', hud: '示意圖', draw: throttle },
  { head: '路寬', sub: `營建署 ${FACTS.LANE_STUDY_YEAR}`, hud: '中央社 · 公視', draw: lt => laneCompare(lt, 0) },
  { head: '路寬', sub: `≥ ${FACTS.WIDE_LANE_M} m`, hud: '中央社', draw: lt => laneCompare(lt, E.o3(inv(0.2, 0.8, lt))) },
  { head: '路寬', sub: `事故 +${FACTS.WIDE_LANE_EXTRA_PCT}%`, hud: '中央社', draw: laneBars },
  { head: '轉角', hud: '示意圖', draw: cornerZoom },
  { head: '轉角', hud: '示意圖', draw: cornerGrow },
  { head: '轉角', sub: '全速', hud: '示意圖', draw: lt => bigTurn(lt, 0) },
  { head: '轉角', sub: '斑馬線', hud: '示意圖', draw: lt => bigTurn(lt, E.o3(inv(1.2, 1.8, lt))) },
  { head: '轉角', sub: `${FACTS.NO_YIELD_DEATHS_2024} / ${FACTS.PED_DEATHS_2024} 人`, tag: '車子沒停下來讓', hud: '交通部（經 TVBS、公視）', draw: lt => deaths(lt, E.io(inv(0.3, 2.0, lt))) },
  { head: '車速', hud: '示意圖', draw: speedIntro },
  { head: '車速', sub: `${FACTS.SPEED_LOW_KMH} → ${FACTS.SPEED_HIGH_KMH} · ${FACTS.FATALITY_RATIO} 倍以上`, hud: 'Rosén & Sander 2009', draw: speedRisk },
  { head: '霍博肯', sub: '紐澤西', hud: '示意地圖', draw: hobokenMap },
  { head: '霍博肯', sub: '停車格 ↓', hud: 'Fox 5 NY · BD+C', draw: daylight },
  { head: '霍博肯', sub: `${FACTS.HOBOKEN_CURB_EXT} 多處外推`, hud: 'BD+C', draw: curbExt },
  { head: '霍博肯', sub: `${FACTS.HOBOKEN_MPH} 英里 ≈ ${FACTS.HOBOKEN_KMH} km/h`, tag: `${FACTS.HOBOKEN_20MPH_YEAR} 年起`, hud: 'BD+C · 霍博肯市府', draw: speedLimit },
  { head: '霍博肯', sub: `${FACTS.HOBOKEN_YEARS} 年 0 人`, tag: `${FACTS.HOBOKEN_SINCE} 年 1 月起`, hud: 'Fox 5 NY · OPB', draw: zeroYears },
  { head: '從路口改', hud: '公視 · TVBS 車勢', draw: tpBase },
  { head: '從路口改', sub: '斑馬線後退 · 安全島', hud: '公視 · TVBS 車勢', draw: tpSetback },
  { head: '從路口改', sub: '減速丘', hud: '自由時報', draw: tpBulb },
  { head: '從路口改', sub: '代價', hud: '做法本身', draw: tpCost },
  { head: '從路口改', sub: `${FACTS.TPE_PLAN_START} 起 · ${FACTS.TPE_PLAN_YEARS} 年`, hud: 'TVBS 車勢', draw: tpYears },
  { head: '從學校改', hud: 'NOWnews · 公視', draw: scBase },
  { head: '從學校改', sub: `${FACTS.SCHOOL_ZONE_M} 公尺通學區`, hud: 'NOWnews · 公視', draw: scZone },
  { head: '從學校改', sub: '前後量車速', hud: 'NOWnews', draw: scMeasure },
  { head: '從學校改', sub: '要開更慢', hud: '公視', draw: scSlow },
  { head: '從學校改', sub: `${FACTS.SCHOOL_COUNT}+ 所 · ${FACTS.SCHOOL_ZONE_YEARS} 年`, hud: 'NOWnews · 公視', draw: scAll },
  { head: '慢慢走', sub: '小路口', hud: '示意圖', draw: calmCross },
  { head: '慢慢走', sub: '阿公阿嬤', hud: '示意圖', draw: elders },
  { head: '慢慢走', sub: '小朋友', hud: '示意圖', draw: kids },
  { head: '你家路口呢？', sub: '慢慢轉，還是直接切？', hud: '示意圖', draw: question },
  { head: '好好走', sub: '每個人', hud: '示意圖', draw: everyone },
];
// 段名 → 畫面上的章名（鉤子不標）。懶人包段 10-30 拿掉（使用者：整支就是懶人包，片尾不必重講）
const CHAP = { 鉤子: '', 機制: '一、路怎麼讓車變快', 轉折: '二、怎麼讓車慢下來', 落點: '三、慢慢走', 提問: '三、慢慢走', 收尾: '三、慢慢走' };
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.25);
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };

// ---------- 背景：上方斜紋帶等速慢捲，讓每張卡都有連續動態 ----------
function band(t) {
  g.save(); g.beginPath(); g.rect(0, 0, W, 120); g.clip();
  g.fillStyle = BG2; g.fillRect(0, 0, W, 120);
  const off = (t * 40) % 80;
  for (let x = -160; x < W + 160; x += 80) G.poly(g, [[x + off, 0], [x + off + 40, 0], [x + off - 80, 120], [x + off - 120, 120]], rgba(OR, 0.35));
  g.restore();
}

// ---------- 字幕 ----------
function caption(t) {
  const L = TL.lines.find(l => t >= l.t0 - 0.1 && t < l.t1 + 0.2);
  if (!L) return;
  const s = L.text.replace(/[。！]$/, ''), px = 42, maxW = 1000;
  g.font = ZH(500, px);
  const fits = r => g.measureText(r).width <= maxW;
  // 在標點後斷行，貪婪裝滿一行；單段本身太長才逐字斷
  const segs = s.match(/[^，、；：]+[，、；：]?/g), rows = [];
  let cur = '';
  for (const sg of segs) {
    if (fits(cur + sg)) { cur += sg; continue; }
    if (cur) rows.push(cur);
    cur = '';
    for (const ch of sg) { if (!fits(cur + ch)) { rows.push(cur); cur = ''; } cur += ch; }
  }
  if (cur) rows.push(cur);
  const h = 50 + rows.length * 58;
  g.fillStyle = '#0f0e0d'; g.fillRect(0, 1880 - h, W, h);
  rows.forEach((r, j) => plain(r, W / 2, 1880 - h + 66 + j * 58, px, CREAM, { align: 'center', w: 500 }));
}

// ---------- 主持人 ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  // 嘴跟旁白開合；表情維持 idle
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：先畫上一張、存起來，再畫這一張，把上一張以漸弱透明度疊回去。
// 不滑入、不換底色、不插章名全屏卡（使用者 10-30；對標 DemDuhNk1ZR 66.9 秒 0 次硬切）。
const XF = 0.6;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = []; NOW = t;
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  band(t);
  plain('行人地獄懶人包', 60, 186, 30, DIM, { mono: true, ls: '4px' });
  const ch = CHAP[TL.lines[i].section]; if (ch === undefined) throw new Error(`段名 ${TL.lines[i].section} 沒有章名`);
  if (ch) plain(ch, 60, 246, 44, CREAM, { w: 600 });
  // 進度條按章分組，章與章之間空一格
  let gx = 60;
  for (let j = 0; j < N; j++) {
    if (j && CHAP[TL.lines[j].section] !== CHAP[TL.lines[j - 1].section]) gx += 14;
    g.fillStyle = j <= i ? OR : rgba(CREAM, 0.2); g.fillRect(gx, 276, 14, j === i ? 10 : 5); gx += 20;
  }
  // 大標＝這一段的主題，同主題連續幾張卡共用、不重播動畫（短句卡也讀得完）；副標＝這張卡的關鍵詞。
  // 第 0 卡第 0 幀就完整顯示（封面）。
  let gi = i; while (gi > 0 && CARDS[gi - 1].head === cd.head) gi--;
  const glt = t - T0[gi];
  const pin = i === 0 ? () => 1 : (a, b) => inv(a, b, lt);
  const big = cd.head.length > 6 ? 120 : cd.head.length > 4 ? 150 : 180, hy = 330 + big * 0.86 + 60;
  say(cd.head, 60, hy, big, CREAM, i === 0 ? 1 : inv(0.05, 0.6, glt), { id: 'head' + (gi + 1) });
  if (cd.sub) say(cd.sub, 64, hy + 110, 68, ORL, pin(0.15, 0.7), { id: 'sub' + (i + 1) });
  if (cd.tag) say(cd.tag, 64, hy + 190, 46, GOLD, pin(0.3, 0.85), { id: 'tag' + (i + 1) });
  plain(`來源｜${cd.hud}`, 60, 1690, 30, DIM, { mono: true });
  cd.draw(lt);
}
function finish(t) {
  caption(t);
  poseHost(t);
  const fade = t > DUR - 0.6 ? inv(DUR - 0.6, DUR, t) : 0;
  if (fade) { g.globalAlpha = fade; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.globalAlpha = 1 - fade; g.drawImage(img, 730, 60, 340, 340); g.globalAlpha = 1;
  });
}
let mascotTok = 0;

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = TL.lines.map(l => ({ t0: l.t0, t1: l.t1, text: l.text }));
window.SHAKES = [];
window.EV = (() => {
  const e = [{ t: 0, type: 'bed', len: DUR }];
  // 不加任何音效：換卡「登」一聲使用者 10-30 嫌吵拿掉，只留配樂
  return e.sort((a, b) => a.t - b.t);
})();
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字（卡片、標籤、圖表字），整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789';
await Promise.all([document.fonts.load(ZH(600, 180), allText), document.fonts.load(ZH(500, 42), allText), document.fonts.load(ZH(700, 46), allText), document.fonts.load(MONO(30), allText)]);
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
</body>
</html>
