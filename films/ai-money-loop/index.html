<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>AI 的錢繞了一圈：循環融資</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#mascot{display:none}#mascot svg{width:340px;height:340px}</style>
<script src="engine.js"></script>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="mascot"></div>
<script type="module">
// 單人旁白科普，米色插畫風（範本 films/taipei-silence，同系列 films/nvidia-short）：全片同一張底、不硬切，一句一個畫面，只有封面有大標。
// 禁止清單（TREATMENT.md）：不畫真人臉、不放公司 logo、不放新聞截圖；人物用扁平小人；私人感情與間諜指控不畫。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
// 角色色：黃仁勳＝深色皮衣、兩位投資人＝鼠尾草綠、董事會＝COAT、分析師＝芥末黃、斯卡拉穆奇＝梅紫、匿名消息來源＝灰
const PLUM = '#9A6A8C', SAGE = '#7FA57A', MUTE = '#B3A797', SOFT = '#EBE1D2', DIM = '#8C7B6B';
const MUST_D = '#9A6F1C', TERRA_D = '#9E4A33', WOOD = '#A5835D';
// 公司色：輝達＝綠、OpenAI＝芥末、甲骨文＝陶土、AMD＝灰藍；貝瑞＝梅紫剪影
const C_NV = '#557A51', C_OAI = '#9A6F1C', C_ORCL = '#9E4A33', C_AMD = '#6F8FB0';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '新聞背後的帳', EP = 4, HANDLE = '@paradoxbar';
const GY = 1270;   // 畫面地平線：小人腳底；字幕短橫線在 1308

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。
const FACTS = {
  OAI_YI: 1000,      // F1 輝達投 OpenAI 最高 1,000 億美元
  ORCL_YI: 3000,     // F3 OpenAI–甲骨文五年 3,000 億美元
  AMD_PCT: 10,       // F5 認股權約 10%
  WEEKS: 2,          // F6 兩週
  COMMIT_ZHAO: 1,    // F6 將近一兆美元
  DEP_YI: 1760,      // F8 Burry 估少提折舊 1,760 億美元
  MEMO_PAGES: 7,     // F9 七頁備忘錄
  A100_YRS: 6,       // F9 A100 六年還滿載
  USERS_YI: 7,       // F11 ChatGPT 每週 7 億人
};
const fmt = n => n.toLocaleString('en-US');
// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  // PingFang 最粗只到 Semibold；o.bold 描同色邊加粗，大標在奶油底上才讀得出（封面 OCR）
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });
// 畫面裡的數字標籤：比字幕大一點、遠小於大標（< precheck HEADLINE_PX），算插畫的一部分
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });

// ---------- 40 人方陣（連署用）----------
const PERM = (() => { const r = G.rng(11), a = [...Array(40).keys()]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const POSE_MIX = (() => { const r = G.rng(23); return Array.from({ length: 40 }, () => { const v = r(); return v < 0.62 ? ['stand', 1] : v < 0.72 ? ['armsUp', 1] : v < 0.82 ? ['point', r() < 0.5 ? 1 : -1] : v < 0.91 ? ['think', 1] : ['shrug', 1]; }); })();
function crowd(o) {
  const s = 120, nc = 8, dx = 116, dy = 146;
  const x0 = 540 - dx * (nc - 1) / 2 - dx * 0.25, y0 = o.y0;
  for (let k = 0; k < 40; k++) {
    const r = Math.floor(k / nc), c = k % nc;
    const x = x0 + c * dx + (r % 2 ? dx * 0.5 : 0), y = y0 + r * dy;
    const pk = E.io(inv(0.1 + (PERM[k] / 40) * 1.6, 0.5 + (PERM[k] / 40) * 1.6, o.lt));
    const [pose, dir] = pk > 0.5 ? POSE_MIX[k] : ['stand', 1];
    man(x, y, s, mix(SOFT, SAGE, pk), { pose, dir, face: 'none' });
  }
}

function framed(cx, cy, w, h, col, a = 1) {
  g.save(); g.globalAlpha *= a; rr(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36, 34, col); g.restore();
  prop(g, 'card', { x: cx, y: cy, w, h, alpha: a });
}

// ---------- 小道具 ----------
const doc = o => prop(g, 'document', { fill: '#E3BE78', lineColor: '#9A7646', ...o });
function chart(x0, y0, w, h, pts, col, p) {
  const n = pts.length - 1, upto = p * n;
  g.strokeStyle = col; g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let k = 0; k <= Math.floor(upto); k++) { const x = x0 + w * k / n, y = y0 + h * (1 - pts[k]); k ? g.lineTo(x, y) : g.moveTo(x, y); }
  const k0 = Math.floor(upto), f = upto - k0;
  if (k0 < n) g.lineTo(x0 + w * (k0 + f) / n, y0 + h * (1 - lerp(pts[k0], pts[k0 + 1], f)));
  g.stroke();
}
function lens(x, y, r) {
  g.strokeStyle = INK; g.lineWidth = r * 0.22; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + r * 0.7, y + r * 0.7); g.lineTo(x + r * 1.6, y + r * 1.6); g.stroke();
  g.fillStyle = 'rgba(255,250,242,0.55)'; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.lineWidth = r * 0.16; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
}
function table() {
  rr(60, 1080, 960, 34, 14, WOOD);
  rr(80, 1106, 920, GY - 1106, 10, '#C7A77F');
  g.fillStyle = 'rgba(59,47,42,0.08)'; g.fillRect(80, 1106, 920, 18);
}
function door(cx, top, w, open, light) {
  rr(cx - w / 2 - 16, top - 16, w + 32, GY - top + 16, 18, WOOD);
  rr(cx - w / 2, top, w, GY - top, 10, light ? '#F2D48A' : SOFT);
  const lw = w * (1 - open);
  rr(cx - w / 2, top, lw, GY - top, 10, '#C7A77F');
  if (lw > 20) G.disc(g, cx - w / 2 + lw - 26, (top + GY) / 2, 9, INK);
}
const SAGE_D = C_NV;

// ---------- 本片專用道具 ----------
function building(x, yB, w, h, col, label) {
  rr(x - w / 2, yB - h, w, h, 14, col);
  g.fillStyle = 'rgba(255,250,242,0.25)';
  const rows = Math.max(2, Math.floor(h / 90)), cols = Math.max(2, Math.floor(w / 80));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) g.fillRect(x - w / 2 + 18 + c * ((w - 36) / (cols - 1)) - 9, yB - h + 22 + r * ((h - 50) / (rows - 1)), 18, 14);
  if (label) { rr(x - w / 2 - 14, yB - h - 74, w + 28, 58, 29, SOFT); plain(label, x, yB - h - 34, 40, INK, { align: 'center', w: 700 }); }
}
function chip(x, y, s, col, label) {
  rr(x - s / 2, y - s / 2, s, s, s * 0.12, col);
  g.strokeStyle = col; g.lineWidth = s * 0.05;
  for (let i = -1; i <= 1; i++) {
    g.beginPath(); g.moveTo(x - s / 2 - s * 0.18, y + i * s * 0.28); g.lineTo(x - s / 2, y + i * s * 0.28); g.stroke();
    g.beginPath(); g.moveTo(x + s / 2, y + i * s * 0.28); g.lineTo(x + s / 2 + s * 0.18, y + i * s * 0.28); g.stroke();
    g.beginPath(); g.moveTo(x + i * s * 0.28, y - s / 2 - s * 0.18); g.lineTo(x + i * s * 0.28, y - s / 2); g.stroke();
    g.beginPath(); g.moveTo(x + i * s * 0.28, y + s / 2); g.lineTo(x + i * s * 0.28, y + s / 2 + s * 0.18); g.stroke();
  }
  if (label) plain(label, x, y + s * 0.12, s * 0.3, CREAM, { align: 'center', w: 800 });
}
function money(x, y, r) {
  G.disc(g, x, y, r, MUST); plain('$', x, y + r * 0.38, r * 1.15, CREAM, { align: 'center', w: 800 });
}
function arc(cx, cy, r, a0, a1, col, lw, p = 1) {
  const sweep = a0 + (a1 - a0) * p;
  g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, r, a0, sweep); g.stroke();
  if (p > 0.02) {
    const dx = -Math.sin(sweep), dy = Math.cos(sweep), hs = lw * 2.2;
    const ex = cx + Math.cos(sweep) * r, ey = cy + Math.sin(sweep) * r;
    g.fillStyle = col; g.beginPath();
    g.moveTo(ex + dx * hs, ey + dy * hs); g.lineTo(ex - dx * hs * 0.4 + dy * hs, ey - dy * hs * 0.4 - dx * hs); g.lineTo(ex - dx * hs * 0.4 - dy * hs, ey - dy * hs * 0.4 + dx * hs);
    g.closePath(); g.fill();
  }
}

// ---------- 每張卡的畫面（畫在 y 500–1290；x≥875、y<480 是主播位置）----------
function c1(lt) {
  // 封面：三棟樓三角排列，錢在樓之間繞
  building(240, 1150, 200, 320, C_NV, '輝達');
  building(830, 1150, 210, 380, C_OAI, 'OpenAI');
  building(540, 900, 190, 240, C_ORCL, '甲骨文');
  const a = lt * 1.2;
  money(540 + Math.cos(a) * 320, 1010 + Math.sin(a) * 160, 34);
  [a - 0.9, a - 1.8].forEach(t => G.disc(g, 540 + Math.cos(t) * 320, 1010 + Math.sin(t) * 160, 10, MUST));
}
function c2(lt) {
  // 輝達投 OpenAI 一千億：錢袋從輝達樓移向 OpenAI 樓
  building(200, GY, 220, 400, C_NV, '輝達');
  building(880, GY, 240, 440, C_OAI, 'OpenAI');
  const p = E.io(inv(0.3, 2.0, lt));
  money(lerp(310, 760, p), 980 - Math.sin(p * Math.PI) * 80, 50);
  fig(`${fmt(FACTS.OAI_YI)} 億美元`, 540, 620, TERRA_D, inv(0.5, 1.2, lt), 'fig-oai');
}
function c3(lt) {
  // OpenAI 蓋資料中心用輝達晶片：晶片方塊排進樓裡
  building(540, GY, 520, 560, C_OAI, 'OpenAI');
  for (let k = 0; k < 6; k++) {
    const px = 380 + (k % 3) * 160, py = 1080 - Math.floor(k / 3) * 130;
    const q = pop(lt, 0.3 + k * 0.25, 0.4);
    if (q > 0) { g.globalAlpha = q; chip(px, py, 90, C_NV); g.globalAlpha = 1; }
  }
}
function c4(lt) {
  // 錢繞一圈變輝達營收：圓弧繞回輝達樓
  building(540, GY, 240, 380, C_NV, '輝達');
  arc(540, 930, 300, Math.PI * 0.5, Math.PI * 2.5, TERRA, 16, E.io(inv(0.2, 2.4, lt)));
  const p = E.io(inv(0.2, 2.4, lt));
  money(540 + Math.cos(Math.PI * 0.5 + Math.PI * 2 * p) * 300, 930 + Math.sin(Math.PI * 0.5 + Math.PI * 2 * p) * 300, 44);
  plain('營收', 540, 640, 52, INK, { align: 'center', w: 700 });
}
function c5(lt) {
  // 名詞卡：大圓環＋循環融資
  const p = E.io(inv(0.1, 1.4, lt));
  g.strokeStyle = SAGE_D; g.lineWidth = 34; g.lineCap = 'round';
  g.beginPath(); g.arc(540, 880, 240, 0, Math.PI * 2 * p); g.stroke();
  if (p >= 1) { const q = pop(lt, 1.6, 0.5); g.globalAlpha = q; plain('循環融資', 540, 910, 92, INK, { align: 'center', w: 800 }); g.globalAlpha = 1; }
}
function c6(lt) {
  // 賣方融資：賣方樓把錢袋遞給買方小人
  building(200, GY, 220, 400, C_NV, '賣方');
  man(860, GY, 380, MUTE, { pose: 'stand', dir: -1, face: 'smile' });
  plain('買方', 860, 700, 42, INK, { align: 'center', w: 700 });
  const p = E.io(inv(0.3, 1.8, lt));
  money(lerp(340, 800, p), 1000 - Math.sin(p * Math.PI) * 40, 46);
}
function c7(lt) {
  // OpenAI 跟甲骨文三千億：兩棟樓之間合約
  building(210, GY, 220, 380, C_OAI, 'OpenAI');
  building(870, GY, 230, 420, C_ORCL, '甲骨文');
  doc({ x: 540, y: 880, s: 330, title: '雲端合約', titlePx: 11, lines: 3, alpha: pop(lt, 0.4) });
  fig(`${fmt(FACTS.ORCL_YI)} 億美元`, 540, 620, TERRA_D, inv(0.5, 1.2, lt), 'fig-orcl');
}
function c8(lt) {
  // 三角循環：OpenAI→甲骨文→輝達
  building(540, 820, 200, 200, C_OAI, 'OpenAI');
  building(230, GY, 200, 280, C_ORCL, '甲骨文');
  building(850, GY, 200, 280, C_NV, '輝達');
  const p = E.io(inv(0.2, 2.2, lt));
  const path = [[540, 860, 300, 1150], [300, 1150, 780, 1150], [780, 1150, 600, 860]];
  path.forEach(([x0, y0, x1, y1], k) => {
    const q = clamp((p * 3 - k), 0, 1);
    if (q <= 0) return;
    g.strokeStyle = TERRA; g.lineWidth = 12; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(lerp(x0, x1, q), lerp(y0, y1, q)); g.stroke();
  });
}
function c9(lt) {
  // AMD 一成股權：AMD 樓＋認購權文件 10%
  building(280, GY, 240, 400, C_AMD, 'AMD');
  chip(280, 940, 110, '#41607E');
  doc({ x: 720, y: 900, s: 320, title: '認股權證', titlePx: 11, lines: 2, alpha: pop(lt, 0.4) });
  fig(`${FACTS.AMD_PCT}% 股權`, 720, 640, TERRA_D, inv(0.5, 1.2, lt), 'fig-amd');
}
function c10(lt) {
  // 兩週承諾近一兆：14 格日曆＋大數字
  const p = E.io(inv(0.1, 1.4, lt));
  for (let k = 0; k < 14; k++) {
    const x = 150 + (k % 7) * 130, y = 760 + Math.floor(k / 7) * 130;
    const q = pop(lt, 0.1 + k * 0.08, 0.3);
    rr(x, y, 110, 110, 16, mix(SOFT, MUST, q));
  }
  fig(`近 ${FACTS.COMMIT_ZHAO} 兆美元`, 540, 1180, TERRA_D, inv(0.6, 1.4, lt), 'fig-commit');
}
function c11(lt) {
  // 貝瑞放空：剪影小人＋向下折線
  rr(160, 600, 200, 70, 35, SOFT);
  plain('貝瑞', 260, 648, 46, INK, { align: 'center', w: 700 });
  man(260, GY, 420, PLUM, { pose: 'point', aim: 0.3, face: 'none' });
  framed(680, 830, 540, 380, SOFT);
  chart(480, 710, 400, 240, [0.85, 0.6, 0.68, 0.4, 0.2], TERRA_D, E.io(inv(0.3, 1.8, lt)));
}
function c12(lt) {
  // 終端需求小得離譜：大圓對小點
  G.disc(g, 330, 900, 200 * E.io(inv(0.1, 1.0, lt)), MUTE);
  plain('承諾的支出', 330, 640, 42, INK, { align: 'center', w: 700 });
  G.disc(g, 830, 1000, 26 * E.io(inv(0.6, 1.4, lt)), TERRA);
  plain('終端需求', 830, 640, 42, INK, { align: 'center', w: 700 });
  plain('他說', 830, 560, 34, DIM, { align: 'center', w: 600 });
}
function c13(lt) {
  // 客戶是賣方養的：賣方樓一直餵錢給客戶小人
  building(220, GY, 220, 400, C_NV, '賣方');
  man(860, GY, 380, MUTE, { pose: 'stand', dir: -1, face: 'smile' });
  plain('客戶', 860, 700, 42, INK, { align: 'center', w: 700 });
  for (let k = 0; k < 3; k++) {
    const p = ((lt * 0.8 + k * 0.33) % 1 + 1) % 1;
    money(lerp(340, 800, p), 1000 - Math.sin(p * Math.PI) * 40, 34);
  }
}
function c14(lt) {
  // 折舊少算 1,760 億：晶片生鏽老化
  chip(400, 900, 220, MUTE);
  g.globalAlpha = 0.5; g.strokeStyle = TERRA_D; g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(330, 830); g.lineTo(370, 870); g.moveTo(430, 950); g.lineTo(470, 990); g.stroke();
  g.globalAlpha = 1;
  const cx = 700, cy = 830, a = -Math.PI / 2 + lt * 1.2;
  G.disc(g, cx, cy, 130, INK); G.disc(g, cx, cy, 118, '#F2ECE2');
  g.strokeStyle = TERRA; g.lineWidth = 8; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * 90, cy + Math.sin(a) * 90); g.stroke();
  fig(`${fmt(FACTS.DEP_YI)} 億美元`, 540, 1180, TERRA_D, inv(0.5, 1.2, lt), 'fig-dep');
}
function c15(lt) {
  // 七頁備忘錄：七份文件疊放
  for (let k = 0; k < FACTS.MEMO_PAGES; k++) {
    doc({ x: 540 + (k - 3) * 60, y: 940 - Math.abs(k - 3) * 24, s: 300, title: k === 0 ? '備忘錄' : '', titlePx: 11, lines: 3, alpha: pop(lt, 0.2 + k * 0.18, 0.35) });
  }
}
function c16(lt) {
  // A100 滿載在跑：晶片發亮＋光暈呼吸
  const pulse = 0.7 + 0.3 * Math.sin(lt * 3);
  const gl = g.createRadialGradient(540, 880, 40, 540, 880, 320);
  gl.addColorStop(0, `rgba(240,196,92,${0.4 * pulse})`); gl.addColorStop(1, 'rgba(240,196,92,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(540, 880, 320, 0, Math.PI * 2); g.fill();
  chip(540, 880, 260, C_NV, 'A100');
  fig(`${FACTS.A100_YRS} 年還在跑`, 540, 1180, TERRA_D, inv(0.5, 1.2, lt), 'fig-a100');
}
function c17(lt) {
  // ChatGPT 每週七億人：方陣＋大數字
  crowd({ y0: 700, lt });
  fig(`每週 ${FACTS.USERS_YI} 億人`, 540, 540, TERRA_D, inv(0.4, 0.9, lt), 'fig-users');
}
function c18(lt) {
  // 匯豐策略師：小人聳肩＋名牌
  rr(440, 600, 260, 70, 35, SOFT);
  plain('匯豐策略師', 570, 648, 42, INK, { align: 'center', w: 700 });
  man(540, GY, 440, SAGE, { pose: 'shrug', face: 'smile', tilt: Math.sin(lt * 3) * 0.04 });
  prop(g, 'speech', { x: 540, y: 760, s: 130, tail: 'none', text: '生意', px: 34, fill: '#FFFFFF', color: INK, alpha: pop(lt, 0.7) });
}
function c19(lt) {
  // 天平：飛輪 vs 泡沫，微微晃動
  prop(g, 'balance', { x: 540, y: 1130, s: 460, tilt: Math.sin(lt * 1.4) * 0.08 });
  plain('飛輪', 300, 700, 52, SAGE_D, { align: 'center', w: 800 });
  plain('泡沫', 780, 700, 52, TERRA_D, { align: 'center', w: 800 });
}
function c20(lt) {
  // 落點：人群的小錢袋 vs 一兆大合約，天平微晃
  prop(g, 'balance', { x: 540, y: 1130, s: 460, tilt: 0.06 + Math.sin(lt * 1.2) * 0.05 });
  [300, 350, 250].forEach((x, k) => man(x, GY, 200, [SAGE, MUTE, MUST][k], { pose: 'stand', face: 'smile' }));
  money(300, 1080, 30);
  doc({ x: 780, y: 1020, s: 200, title: '一兆美元', titlePx: 10, lines: 2 });
}

// head：卡名。只有封面（第 0 卡）畫成大標。
const CARDS = [
  { head: '錢繞了一圈', hud: '示意圖', hl: ['出錢請客戶'], draw: c1 },
  { head: '一千億', hud: 'Reuters', hl: ['一千億美元'], draw: c2 },
  { head: '晶片', hud: 'Reuters', hl: ['輝達晶片'], draw: c3 },
  { head: '營收', hud: '示意圖', hl: ['繞一圈', '營收'], draw: c4 },
  { head: '循環融資', hud: 'Fortune', hl: ['循環融資'], draw: c5 },
  { head: '賣方融資', hud: 'Fortune', hl: ['賣方融資'], draw: c6 },
  { head: '三千億', hud: 'Reuters／WSJ', hl: ['三千億美元'], draw: c7 },
  { head: '不只一圈', hud: 'Fortune｜循環為示意', hl: ['回頭買輝達晶片'], draw: c8 },
  { head: '一成股權', hud: 'Reuters／AMD', hl: ['一成股權', '認購'], draw: c9 },
  { head: '一兆', hud: 'CNBC｜日曆為示意', hl: ['近一兆美元', '建廠支出'], draw: c10 },
  { head: '放空', hud: 'Benzinga', hl: ['放空輝達'], draw: c11 },
  { head: '終端需求', hud: 'Benzinga｜大小為示意', hl: ['小得離譜'], draw: c12 },
  { head: '賣方出錢', hud: 'Benzinga', hl: ['賣方自己出錢養'], draw: c13 },
  { head: '折舊', hud: 'CNBC', hl: ['一千七百六十億美元', '折舊費'], draw: c14 },
  { head: '備忘錄', hud: 'CNBC', hl: ['七頁'], draw: c15 },
  { head: 'A100', hud: 'CNBC', hl: ['滿載'], draw: c16 },
  { head: '七億人', hud: 'TechSpot｜人像為示意', hl: ['七億人', '需求端'], draw: c17 },
  { head: '匯豐', hud: 'Axios', hl: ['賣方融資', '一兆美元'], draw: c18 },
  { head: '追一個問題', hud: '示意圖', hl: ['只追一個問題'], draw: c19 },
  { head: '付得起嗎', hud: 'CNBC｜示意圖', hl: ['按合約', '付掉'], draw: c20 },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾系列卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部系列標籤 ----------
function series() {
  plain(`${SERIES}｜系列`, 540, 150, 34, DIM, { align: 'center', w: 600 });
  rr(510, 172, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 1400 - (rows.length - 1) * 36;
  rr(510, y0 - 92, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  // 系列名比照參考帳號片尾：中等字級（< precheck HEADLINE_PX），三個小人是主角
  say(SERIES, 540, 640, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  say(`第 ${EP} 集`, 540, 720, 44, TERRA, 1, { id: 'end-ep', align: 'center' });
  rr(510, 752, 60, 5, 3, SAGE);
  [[SAGE, 330, 'armsUp'], [MUST, 540, 'stand'], [TERRA, 750, 'armsUp']].forEach(([c, x, pose], k) => man(x, 1150, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1260, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角，寫法照 films/elected-dictator ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  // 嘴跟旁白開合；表情維持 idle
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
// 畫框 x 875 起、y 260 起、邊長 224（框右緣的透明留白超出畫面無妨），可見身形約 x 906–1067、y 299–455：
// IG 主頁格把 9:16 置中裁成 3:4（上下各裁約 240px），整隻要在 y 240 以下；左邊讓開置中大標（最寬到 x 890）。
const MASCOT = { x: 875, y: 260, s: 224 };
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：底色一樣，看起來是小人與道具在原地換狀態，不是切鏡頭。
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series();
  // 只留封面大標（使用者 11-04）：第 0 卡第 0 幀就完整顯示，其他卡不畫大標副標，畫面當主角
  if (i === 0) say(cd.head, 540, 370, 170, INK, 1, { id: 'head1', align: 'center' });  // 170px 不描邊：bold 0.05 會糊（11-11 使用者回報）
  g.save(); cd.draw(lt); g.restore();
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1530, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
