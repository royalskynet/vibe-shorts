<script type="module">
// 單人旁白科普，畫面照無邊探索（refs/boundless/ANALYSIS.md §3，使用者 11-03 採用）：
// 全片同一張米色底、不硬切；扁平小人＋四色；一句一個畫面狀態（CARDS），字幕一卡一個逗號短語（timeline.js 的 phrases）；
// 頂部系列標籤，片尾系列卡。主題色陰藍／鼠尾草綠，中間選民芥末黃，不開口的人灰色。
// 使用者 11-04：小人與道具改用共用插畫庫 illust/illust.mjs（正本 assets/illust/，scripts/illust_install.sh 複製進來）；
// 只留封面大標：第 0 卡有大標，其餘卡只有系列標籤＋畫面＋字幕＋來源，畫面往上放大當主角（precheck「內頁大標」門）。
// 禁止清單：不畫政黨標誌、不引用生產力統計。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
const SAGE = '#7FA57A', BLUE = '#6F8FB0', MUTE = '#B3A797', SOFT = '#EBE1D2', DIM = '#8C7B6B';
const BLUE_D = '#4F6F90', SAGE_D = '#557A51', MUST_D = '#9A6F1C';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '皮克敏公告風波', EP = 1, HANDLE = '@paradoxbar';
const GY = 1270;

// ---------- 事實數字集中在这裡，每一個都要在 meta/facts.md 有一行附來源 ----------
const FACTS = {

  TW_REV_WAN: 1850,       // 台灣 2026 上半年內購營收估算，萬美元
  GLOBAL_REV_WAN: 3570,   // 全球同口徑，萬美元

// ---------- 15 張卡，順序與旁白行一一對應 ----------
const CARDS = [
  { head: '稱呼台灣', hud: '示意圖', hl: ['稱呼台灣'], draw: c1 },
  { head: '兩個樣子', hud: '示意圖', hl: ['兩個樣子'], draw: c2 },

  { head: '台灣估算', hud: 'PocketGamer.biz', hl: ['一千八百五十'], draw: c6 },
  { head: 'AppMagic 估算', hud: 'AppMagic', hl: ['AppMagic'], draw: c7 },
  { head: '占比', hud: 'PocketGamer.biz', hl: ['百分之五十二'], draw: c8 },
  { head: '一塊多', hud: '依 AppMagic 估算', hl: ['一塊多'], draw: c9 },
  { head: '沒有上架', hud: 'NOWnews', hl: ['沒有正式'], draw: c10 },
  { head: '玩家反應', hud: 'NOWnews', hl: ['刪帳號', '退坑', '不再消費'], draw: c11 },
  { head: '官方調整', hud: 'NOWnews、UDN、自由時報', hl: ['拿掉', 'Taiwan'], draw: c12 },
  { head: '沒有說明', hud: 'NOWnews', hl: ['沒有公開說明'], draw: c13 },
  { head: '用投入投票', hud: '示意圖', hl: ['投入時間或金錢', '投票'], draw: c14 },
  { head: '個人自由', hud: '示意圖', hl: ['個人自由'], draw: c15 },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾系列卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部系列標籤 ----------
function series() {
  plain(`${SERIES}｜系列`, 540, 150, 34, DIM, { align: 'center', w: 600 });
  rr(510, 172, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 1400 - (rows.length - 1) * 36;
  rr(510, y0 - 92, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  say(SERIES, 540, 640, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  say(`第 ${EP} 集`, 540, 720, 44, TERRA, 1, { id: 'end-ep', align: 'center' });
  rr(510, 752, 60, 5, 3, SAGE);
  [[BLUE, 330, 'armsUp'], [MUST, 540, 'stand'], [SAGE, 750, 'armsUp']].forEach(([c, x, pose], k) => man(x, 1150, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1260, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: o.txt ?? s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}

// ---------- 小工具 ----------
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });

// 畫面裡的數字標籤：比字幕大一點、遠小於大標（< precheck HEADLINE_PX），算插畫的一部分
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });


// 白卡片放在米色底上，藏字檢查（textless_check）算不到畫面；要用卡片就加一圈有色外框
function framed(cx, cy, w, h, col, a = 1) {
  g.save(); g.globalAlpha *= a; rr(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36, 34, col); g.restore();
  prop(g, 'card', { x: cx, y: cy, w, h, alpha: a });
}
// 把引文拆成每行 n 字，逐字著色（hl 的詞用陶土紅），整句只登記成一筆螢幕文字
function quote(s, cx, y, px, hl, id, a, n = 6) {
  const rows = []; for (let i = 0; i < s.length; i += n) rows.push(s.slice(i, i + n));
  const hits = Array(s.length).fill(false);
  for (const w of hl) { const i = s.indexOf(w); if (i >= 0) for (let k = 0; k < w.length; k++) hits[i + k] = true; }
  g.save(); g.globalAlpha *= a;
  let off = 0, x0 = 1e9, x1 = -1e9;
  rows.forEach((r, k) => {
    g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    const wr = g.measureText(r).width;
    let x = cx - wr / 2; x0 = Math.min(x0, x); x1 = Math.max(x1, x + wr);
    for (let j = 0; j < r.length; j++) { g.fillStyle = hits[off + j] ? TERRA : INK; g.fillText(r[j], x, y + k * (px + 18)); x += g.measureText(r[j]).width; }
    off += r.length;
  });
  g.restore();
  rows.forEach((r, k) => {   // 每行各登記一筆：字級由單行框高推算，整句一筆會被誤算成大標
    g.font = ZH(700, px); const wr = g.measureText(r).width;
    TXT.push({ id: `${id}-${k}`, text: r, x0: cx - wr / 2, y0: y + k * (px + 18) - px, x1: cx + wr / 2, y1: y + k * (px + 18) + px * 0.25, screen: true });
  });
}
const GRAY = '#C9BFB0';

// ---------- 15 張卡的畫面 ----------
function c1(lt) {
  const a = pop(lt, 0.0, 0.3);
  man(330, GY + 40, 470, COAT, { pose: 'think', face: 'worried', tilt: Math.sin(lt * 2) * 0.02 });
  prop(g, 'phone', { x: 150, y: 1090, s: 230, alpha: a });
  prop(g, 'document', { x: 700, y: 900 + Math.sin(lt * 2.2) * 12, s: 600, title: '公告', lines: 5, alpha: a, lineColor: INK });
  g.save(); g.translate(930, 640); g.rotate(Math.sin(lt * 4) * 0.18); prop(g, 'question', { x: 0, y: 0, s: 330, alpha: pop(lt, 0.1, 0.3) }); g.restore();
}
function c2(lt) {
  const a = pop(lt, 0.0, 0.3), b = pop(lt, 0.3, 0.3);
  prop(g, 'document', { x: 280, y: 880, s: 560, title: '繁中', lines: 6, alpha: a, lineColor: INK });
  prop(g, 'document', { x: 800, y: 892, s: 560, title: '簡中', lines: 6, alpha: b, lineColor: MUST_D });
  say('繁中', 280, 1260, 64, INK, a, { id: 'lab-tw', align: 'center', bold: 0.02 });
  say('簡中', 800, 1260, 64, INK, b, { id: 'lab-cn', align: 'center', bold: 0.02 });
  rr(534, 600, 12, 700, 6, INK);
}
function c3(lt) {
  const a = pop(lt, 0.0, 0.3), p = 0.25 + 0.75 * E.o3(inv(0.2, 4.6, lt));
  const cx = 540, cy = 640, r = 230;
  g.fillStyle = SOFT; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = TERRA; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * p); g.closePath(); g.fill();
  g.strokeStyle = INK; g.lineWidth = 12; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  say('估算', 540, 985, 60, DIM, inv(1.2, 1.7, lt), { id: 'est', align: 'center', bold: 0.02 });
  prop(g, 'phone', { x: 260, y: 1075, s: 280, alpha: a });
  prop(g, 'phone', { x: 820, y: 1075, s: 280, alpha: pop(lt, 0.2, 0.3), hl: 1 });
  say('App Store', 260, 1290, 44, INK, a, { id: 'lab-as', align: 'center' });
  say('Google Play', 820, 1290, 44, INK, pop(lt, 0.2, 0.3), { id: 'lab-gp', align: 'center' });
}
function c4(lt) {
  const a = pop(lt, 0.15);
  g.save(); g.globalAlpha *= a;
  rr(150, 640, 440, 460, 36, SOFT); rr(150, 640, 440, 130, 36, TERRA); rr(150, 735, 440, 35, 0, TERRA);
  g.restore();
  say(`${FACTS.EVENT_MONTH}/${FACTS.EVENT_DAY}`, 370, 960, 70, INK, a, { id: 'date', align: 'center', bold: 0.03 });
  say('五週年', 370, 725, 56, CREAM, a, { id: 'ann', align: 'center', bold: 0.02 });
  prop(g, 'house', { x: 810, y: 1060, s: 420, alpha: pop(lt, 0.5) });
  man(930, GY, 240, COAT, { pose: 'armsUp', face: 'smile', tilt: Math.sin(lt * 3) * 0.03 });
}
function c5(lt) {
  const a = pop(lt, 0.0, 0.3), b = pop(lt, 0.4, 0.3);
  framed(290, 920, 460, 560, SAGE, a);
  framed(790, 920, 460, 560, BLUE, b);
  g.save(); g.globalAlpha *= a; rr(60, 640, 460, 110, 30, SAGE); g.restore();
  g.save(); g.globalAlpha *= b; rr(560, 640, 460, 110, 30, BLUE); g.restore();
  say('繁中', 290, 722, 58, CREAM, a, { id: 'q-lab-tw', align: 'center', bold: 0.02 });
  say('簡中', 790, 722, 58, CREAM, b, { id: 'q-lab-cn', align: 'center', bold: 0.02 });
  quote(QUOTE_ZH_TW, 290, 860, 54, [], 'quote-tw', a);
  quote(QUOTE_ZH_CN, 790, 860, 54, ['中國'], 'quote-cn', b);
}
function c6(lt) {
  const p = 0.3 + 0.7 * E.o3(inv(0.2, 3.6, lt)), a = pop(lt, 0.0, 0.3);
  say(`${FACTS.Y2026} 上半年　台灣`, 540, 690, 50, INK, a, { id: 'h1-lab', align: 'center' });
  g.save(); g.globalAlpha *= a; rr(100, 740, 880, 260, 40, SOFT); g.restore();
  rr(100, 740, Math.max(30, 880 * (FACTS.TW_REV_WAN / FACTS.GLOBAL_REV_WAN) * p), 260, 40, TERRA);
  g.strokeStyle = INK; g.lineWidth = 12; g.beginPath(); g.roundRect(100, 740, 880, 260, 40); g.stroke();
  say(`${FACTS.TW_REV_WAN} 萬美元`, 540, 1140, 66, TERRA, inv(0.4, 0.8, lt), { id: 'fig-tw', align: 'center', bold: 0.03 });
  say('內購營收估算', 540, 1220, 46, DIM, inv(0.6, 1.0, lt), { id: 'fig-tw-est', align: 'center' });
}
function c7(lt) {
  const a = pop(lt, 0.0, 0.3), b = pop(lt, 0.2, 0.3), c = pop(lt, 0.8, 0.4);
  framed(290, 840, 400, 300, SAGE, a); rr(70, 710, 440, 90, 28, SAGE); say('App Store', 290, 775, 52, CREAM, a, { id: 'st-as', align: 'center' });
  framed(790, 840, 400, 300, SAGE, b); rr(570, 710, 440, 90, 28, SAGE); say('Google Play', 790, 775, 52, CREAM, b, { id: 'st-gp', align: 'center' });
  framed(540, 1130, 400, 190, GRAY, c * 0.7);
  g.save(); g.globalAlpha *= c * 0.7; say('官方網路商店', 540, 1145, 46, DIM, 1, { id: 'st-web', align: 'center' }); g.restore();
  g.save(); g.globalAlpha *= c; g.strokeStyle = TERRA; g.lineWidth = 16; g.lineCap = 'round'; g.beginPath(); g.moveTo(360, 1050); g.lineTo(720, 1210); g.stroke(); g.restore();
  say('估算，不含官方網路商店', 540, 620, 48, INK, a, { id: 'st-note', align: 'center' });
}
function c8(lt) {
  const p = 0.3 + 0.7 * E.o3(inv(0.2, 3.0, lt)), a = pop(lt, 0.0, 0.3);
  say(`全球 ${FACTS.GLOBAL_REV_WAN} 萬`, 540, 700, 56, INK, a, { id: 'fig-gl', align: 'center', bold: 0.02 });
  g.save(); g.globalAlpha *= a; rr(100, 760, 880, 260, 40, SOFT); g.restore();
  rr(100, 760, Math.max(30, 880 * (FACTS.TW_SHARE / 100) * p), 260, 40, TERRA);
  g.strokeStyle = INK; g.lineWidth = 12; g.beginPath(); g.roundRect(100, 760, 880, 260, 40); g.stroke();
  say(`${FACTS.TW_SHARE}%`, 540, 1160, 66, TERRA, inv(0.4, 0.8, lt), { id: 'fig-share', align: 'center', bold: 0.03 });
  say('台灣占比（估算）', 540, 1240, 46, DIM, inv(0.6, 1.0, lt), { id: 'fig-share-lab', align: 'center' });
}
function c9(lt) {
  for (let r = 0; r < 3; r++) {
    const a = pop(lt, 0.0 + r * 0.5, 0.3), y = 690 + r * 210;
    g.save(); g.globalAlpha *= a;
    [[400, TERRA], [680, SOFT]].forEach(([x, c]) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, 92, 0, Math.PI * 2); g.fill(); g.strokeStyle = INK; g.lineWidth = 10; g.stroke(); g.beginPath(); g.arc(x, y, 60, 0, Math.PI * 2); g.lineWidth = 7; g.stroke(); });
    g.restore();
  }
}
function c10(lt) {
  const xs = [400, 610, 820], ys = [700, 880, 1060];
  ys.forEach((y, r) => xs.forEach((x, c) => {
    const k = r * 3 + c, a = pop(lt, 0.1 + k * 0.06, 0.4), none = k === 4;
    framed(x, y, 170, 120, none ? GRAY : SAGE, a);
    if (none) { g.save(); g.globalAlpha *= pop(lt, 1.0); say('未上架', x, y + 16, 44, TERRA, 1, { id: 'stamp', align: 'center', bold: 0.03 }); g.restore(); }
  }));
  say('中國', 610, 570, 60, INK, pop(lt, 0.3, 0.3), { id: 'cn-label', align: 'center', bold: 0.02 });
  man(150, GY, 230, COAT, { pose: 'shrug', face: 'worried' });
}
function c11(lt) {
  [220, 540, 860].forEach((x, k) => {
    const on = 1 - pop(lt, 0.8 + k * 0.7, 0.4);
    prop(g, 'phone', { x, y: 860, s: 300, on, alpha: pop(lt, 0.0 + k * 0.1, 0.3) });
  });
  prop(g, 'speech', { x: 540, y: 560, s: 330, w: 100, h: 60, text: '退坑', px: 22, alpha: pop(lt, 0.2, 0.3) });
  man(540, GY - 70, 380, COAT, { pose: 'shrug', face: 'worried' });
}
function c12(lt) {
  const a = pop(lt, 0.0, 0.3), f = inv(0.9, 1.5, lt);
  framed(540, 840, 780, 460, SAGE, a);
  rr(150, 590, 780, 110, 30, SAGE);
  [['繁中', 0], ['簡中', 1], ['English', 2]].forEach(([n, k]) => {
    const y = 790 + k * 105, al = k === 1 ? 1 - 0.7 * f : 1;
    g.save(); g.globalAlpha *= a * al; rr(220, y - 56, 640, 84, 16, SOFT); g.restore();
    g.save(); g.globalAlpha *= a * al; plain(n, 540, y, 52, INK, { align: 'center', w: 700 }); g.restore();
  });
  g.save(); g.globalAlpha *= f; g.strokeStyle = TERRA; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); g.moveTo(300, 895); g.lineTo(780, 895); g.stroke(); g.restore();
  const sw = lt > 1.6;
  rr(150, 1130, 780, 110, 26, SOFT); g.strokeStyle = INK; g.lineWidth = 8; g.beginPath(); g.roundRect(150, 1130, 780, 110, 26); g.stroke();
  if (lt < 2.0) plain(sw ? 'English' : '簡中', 540, 1204, 54, INK, { align: 'center', w: 700 });
  say('Taiwan', 540, 1204, 54, TERRA, pop(lt, 2.0, 0.3), { id: 'taiwan', align: 'center', bold: 0.03 });
}
function c13(lt) {
  man(120, GY + 50, 400, COAT, { pose: 'shrug', face: 'worried' });
  prop(g, 'megaphone', { x: 400, y: 900, s: 440, t: lt, alpha: pop(lt, 0.0, 0.3) });
  prop(g, 'speech', { x: 780, y: 840 + Math.sin(lt * 2) * 8, s: 440, alpha: pop(lt, 0.2, 0.3) });
  say(`${FACTS.EVENT_MONTH}/${FACTS.STATUS_DAY} 晚間`, 780, 1130, 60, DIM, inv(1.2, 1.7, lt), { id: 'status-date', align: 'center', bold: 0.02 });
}
function c14(lt) {
  const drop = (y0, y1, t0) => y0 + (y1 - y0) * E.o3(inv(t0, t0 + 1.0, lt));
  [330, 750].forEach(x => {
    rr(x - 120, 900, 240, 250, 28, MUST_D); rr(x - 70, 920, 140, 14, 7, INK);
  });
  const cy1 = drop(560, 890, 0.3), cy2 = drop(560, 890, 1.0);
  g.save(); g.globalAlpha *= pop(lt, 0.2);
  g.strokeStyle = INK; g.lineWidth = 8; g.fillStyle = CREAM; g.beginPath(); g.arc(330, cy1, 64, 0, Math.PI * 2); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(330, cy1); g.lineTo(330, cy1 - 40); g.moveTo(330, cy1); g.lineTo(358, cy1 + 10); g.stroke();
  g.restore();
  g.save(); g.globalAlpha *= pop(lt, 0.9);
  g.fillStyle = MUST; g.beginPath(); g.arc(750, cy2, 58, 0, Math.PI * 2); g.fill(); g.strokeStyle = INK; g.lineWidth = 6; g.stroke(); g.beginPath(); g.arc(750, cy2, 38, 0, Math.PI * 2); g.lineWidth = 4; g.stroke();
  g.restore();
  man(540, GY, 220, COAT, { pose: 'stand', face: 'smile' });
}
function c15(lt) {
  const p = E.o3(inv(0.2, 2.2, lt));
  rr(80, GY + 40, 920, 12, 6, INK);
  man(540 - 260 * p, GY + 40, 440, BLUE, { pose: 'stand', face: 'smile', dir: -1, tilt: Math.sin(lt * 5) * 0.025 * p });
  man(540 + 260 * p, GY + 40, 440, SAGE, { pose: 'stand', face: 'smile', dir: 1, tilt: Math.sin(lt * 5 + 1) * 0.025 * p });
}
// ---------- 主播 Paradox（Clawd Bot）：右上角，寫法照 films/elected-dictator ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
// 畫框 x 875 起、y 260 起、邊長 224（框右緣的透明留白超出畫面無妨），可見身形約 x 906–1067、y 299–455：
// IG 主頁格把 9:16 置中裁成 3:4（上下各裁約 240px），整隻要在 y 240 以下；左邊讓開置中大標（最寬到 x 890）。
const MASCOT = { x: 875, y: 260, s: 224 };
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series();
  // 只留封面大標（使用者 11-04）：第 0 卡第 0 幀就完整顯示，其他卡不畫大標副標，畫面當主角
  if (i === 0) say(cd.head, 540, 370, 170, INK, 1, { id: 'head1', align: 'center' });  // 170px 不描邊：bold 0.05 會糊（11-11 使用者回報）
  // 緩推鏡頭：整句期間畫面主體從 1.00 倍推到 1.05 倍，讓每張卡整句都在動（不是進場完就凍住）
  const span = (TL.lines[i].t1 - TL.lines[i].t0) + 0.5, zp = Math.min(1, Math.max(0, lt / span)), zs = 1 + 0.05 * zp;
  g.save(); g.translate(540, 960); g.scale(zs, zs); g.translate(-540, -960); cd.draw(lt); g.restore();
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1530, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
