import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {

// ---------- 本片道具（全部是 t 的純函數） ----------
const TARMAC = '#6B625B';
function plane(x, y, s, rot = 0, col = INK, a = 1) {

function tree(x, y, s, a = 1) {

  g.beginPath(); g.moveTo(cx - s * 0.45, cy - s * 0.45); g.lineTo(cx + s * 0.45, cy + s * 0.45); g.moveTo(cx + s * 0.45, cy - s * 0.45); g.lineTo(cx - s * 0.45, cy + s * 0.45); g.stroke(); g.restore();

const JOBS = ['載客', '醫療後送', '備降', '軍事任務'];

// ---------- 每張卡的畫面（畫在 y 500–1290；x≥875、y<480 是主播位置） ----------
function skyline(a = 1) {

}
function c0(lt) {

}
function c1(lt) {

  [[150, 'armsUp'], [280, 'point'], [410, 'armsUp']].forEach(([x, pose], k) => man(x, GY, 300, MUST, { pose, aim: -0.3, face: 'worried', tilt: Math.sin(lt * 2.6 + k) * 0.04 }));
  [[670, 'armsUp'], [800, 'point'], [930, 'shrug']].forEach(([x, pose], k) => man(x, GY, 300, PURP, { pose, dir: -1, aim: -0.3, face: 'worried', tilt: Math.sin(lt * 2.6 + k + 2) * 0.04 }));

  g.strokeStyle = TERRA; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  [[540, 560], [505, 680], [575, 780], [505, 880], [575, 980], [540, 1090]].forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
}
function c2(lt) {

  g.globalAlpha = 0.6;
  man(150, GY, 300, MUST, { pose: 'stand' }); man(930, GY, 300, PURP, { pose: 'stand', dir: -1 });
  g.globalAlpha = 1;
  rr(310, 600, 460, 460, 40, MUTE);
  const q = E.o3(inv(0.2, 0.9, lt));
  prop(g, 'question', { x: 540, y: 850 + Math.sin(lt * 2.5) * 8, s: 340 * q });
  man(540, GY, 300, COAT, { pose: 'think', face: 'worried' });
}
function jobGrid(lt, y0 = 860) {

}
function c3(lt) {
  // 一座機場四份工作
  runway(540, 640, 900, 100);
  plane(540 + Math.sin(lt * 0.8) * 40, 640, 200, 0, CREAM);
  jobGrid(lt);
}
function c4(lt) {
  // 金門、馬祖、澎湖 ⇄ 松山（239 萬是往來運量）
  const dst = [800, 900];
  runway(dst[0], dst[1] + 90, 360, 70);
  tile('松山', dst[0], dst[1] + 190, 200, 90, COAT, CREAM, 1, 46);
  [['馬祖', 190, 660], ['金門', 150, 900], ['澎湖', 230, 1130]].forEach(([n, x, y], k) => {
    G.disc(g, x, y, 62, SAGE); G.disc(g, x + 30, y + 22, 34, SAGE_D);
    plain(n, x, y + 112, 42, INK, { align: 'center', w: 700 });
    g.save(); g.strokeStyle = MUTE; g.lineWidth = 8; g.setLineDash([18, 16]); g.lineCap = 'round';
    g.beginPath(); g.moveTo(x + 80, y); g.lineTo(dst[0] - 120, dst[1] + 40); g.stroke(); g.restore();
    const p = loop(lt * 0.45 + k * 0.33, 1), px = lerp(x + 80, dst[0] - 120, p), py = lerp(y, dst[1] + 40, p);

}
function c5(lt) {

  plane(200, 1180, 130, 0, CREAM);
  const p = E.io(inv(0.3, 2.6, lt));
  man(lerp(250, 520, p), GY, 250, MUST, { pose: p < 1 ? 'walk' : 'stand', t: lt, face: 'worried' });

  g.globalAlpha = inv(0.9, 1.4, lt); plain('離島來台就醫', 330, 710, 44, INK, { align: 'center', w: 700 }); g.globalAlpha = 1;
}
function c6(lt) {

  for (let k = 0; k < 5; k++) { g.globalAlpha = 0.85; G.disc(g, 400 + k * 100 + Math.sin(lt * 0.9 + k) * 14, 690 + (k % 2) * 26, 70, SOFT); }

function c8(lt) {

  g.save(); g.globalAlpha = q; rr(660, 1010, 30, 190, 8, INK); rr(820, 1010, 30, 190, 8, INK); rr(630, 1030, 250, 90, 14, TERRA); cross(755, 1075, 60, CREAM); g.restore();
}

}
