let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;

}

const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });

// ---------- 電扶梯零件 ----------
const STEP = '#DCD0BD', STEP_L = '#B9AA93', RAIL = '#5A463C', SKIRT = '#C8B79E', TOPL = '#EFE6D8';
// 正面透視：d＝0 靠近鏡頭、1 爬到頂；u＝-1 左緣、1 右緣。s(d)=1/(1+Kd) 是透視縮放。
function frontEsc(o) {
  const { cx = 540, top = 500, bot = GY, wB = 860, wT = 340, lt = 0, riders = [], lanes = true } = o;
  const K = wB / wT - 1, yv = (top * (1 + K) - bot) / K;

  rr(cx - wT / 2 - 90, top - 34, wT + 180, 44, 12, TOPL);          // 梯頂平台

  quad(-1, 1, 0, 1, STEP);

  });

}
// 側面斜坡：(x0,y0) 梯底到 (x1,y1) 梯頂，p＝0–1 是沿梯的位置。
function sideEsc(o) {
  const { x0, y0, x1, y1, lt = 0, riders = [], col = STEP, th = 56 } = o;
  const P = p => [lerp(x0, x1, p), lerp(y0, y1, p)];

  g.save(); g.translate(x0, y0); g.rotate(ang);
  rr(-12, 0, L + 24, th, 18, SKIRT); rr(-12, 0, L + 24, 16, 8, col);
  g.fillStyle = STEP_L;
  const n = Math.round(L / 46);
  for (let k = 0; k < n; k++) g.fillRect(loop(k / n + lt * 0.035, 1) * L, 0, 8, 16);
  g.restore();
  // 人站在斜面上；後畫的蓋前面，照 p 由低到高
  [...riders].sort((a, b) => a.p - b.p).forEach(r => {
    const [x, y] = P(r.p);
    man(x, y + 4, r.s || 280, r.c, { pose: r.pose || 'stand', dir: r.dir, aim: r.aim, face: r.face || 'none', t: lt, speed: r.speed, tilt: r.tilt, shadow: false });
  });

  g.beginPath(); g.moveTo(x0 - 30, y0 + hy + 40); g.lineTo(x0, y0 + hy); g.lineTo(x1, y1 + hy); g.lineTo(x1 + 30, y1 + hy + 2); g.stroke();

}
// 高度尺：x 固定，從 yb 長到 yb-h；刻度每 5 公尺一格
function ruler(x, yb, h, pxm, p = 1) {
  g.strokeStyle = INK; g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, yb); g.lineTo(x, yb - h * p); g.stroke();
  g.lineWidth = 5;
  for (let m = 0; m * pxm <= h * p; m += 5) { g.beginPath(); g.moveTo(x - 16, yb - m * pxm); g.lineTo(x + 16, yb - m * pxm); g.stroke(); }
  g.lineWidth = 8; g.beginPath(); g.moveTo(x - 28, yb - h * p); g.lineTo(x + 28, yb - h * p); g.stroke();
}
function tag(s, x, y, bg, fg, id, px = 56, p = 1) {
  g.font = ZH(700, px); const w = g.measureText(s).width + 56;
  g.save(); g.globalAlpha *= p; rr(x - w / 2, y - px - 12, w, px + 36, 20, bg); g.restore();

function sign(cx, cy, s, strike = 0) {

  say(s, cx - 40, cy + 26, 68, CREAM, 1, { id: 'sign', align: 'center' });

  const ax = cx + 130 + Math.sin(rtime * 3) * 8 * (1 - strike);
  g.beginPath(); g.moveTo(ax, cy); g.lineTo(ax + 60, cy); g.moveTo(ax + 34, cy - 28); g.lineTo(ax + 62, cy); g.lineTo(ax + 34, cy + 28); g.stroke();
  if (strike > 0) { g.strokeStyle = TERRA; g.lineWidth = 20; g.beginPath(); g.moveTo(cx - 250, cy + 8); g.lineTo(cx - 250 + 500 * strike, cy - 8); g.stroke(); }
}
function mark(x, y, r, ok, p = 1) {
  if (p <= 0) return;
  g.save(); g.globalAlpha *= p; G.disc(g, x, y, r, ok ? SAGE_D : TERRA);
  g.strokeStyle = CREAM; g.lineWidth = r * 0.24; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();

  g.stroke(); g.restore();
}
const STANDERS = (n, d0 = 0.12, dd = 0.15, u = 0.5, s = 320) => Array.from({ length: n }, (_, k) => ({ u, d: d0 + k * dd, c: k % 2 ? BLUE : SAGE, s }));

// ---------- 每張卡的畫面（畫布座標，drawCard 以 (540,880) 縮 0.9；右上 x≥829、y<520 是主播位置） ----------

}
function c2(lt) {
  const sh = Math.sin(lt * 34) * 0.016;
  const e = sideEsc({ x0: 150, y0: 1200, x1: 830, y1: 650, lt, hand: 110, riders: [
    { p: 0.12, c: BLUE, s: 290, pose: 'stand', face: 'worried' },
    { p: 0.40, c: TERRA, s: 290, pose: 'point', aim: -0.5, face: 'worried' },
    { p: 0.76, c: MUST, s: 290, face: 'worried', dir: -1, tilt: sh }] });

  const [ax, ay] = e.P(0.40), [bx, by] = e.P(0.76), q = E.o3(inv(0.2, 0.9, lt));

    g.strokeStyle = TERRA; g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x0, y0);
    for (let k = 1; k <= 8; k++) { const f = k / 8; g.lineTo(lerp(x0, x1, f) + (k % 2 ? 9 : -9), lerp(y0, y1, f) + (k % 2 ? -15 : 15) * (k === 8 ? 0 : 1)); }
    g.stroke();
  }
  // 冷汗：取餘數循環
  for (let k = 0; k < 3; k++) { const f = loop(lt * 0.9 + k / 3, 1); g.globalAlpha = 1 - f; G.disc(g, bx + 62 + k * 18, by - 280 + f * 90, 10, BLUE); }
  g.globalAlpha = 1;
}
function c3(lt) {
  frontEsc({ top: 520, lt, riders: [...STANDERS(3, 0.2, 0.24), { u: -0.5, d: 0.08 + lt * 0.11, c: TERRA, s: 320, pose: 'walk', speed: 1.8 }, { u: -0.5, d: 0.42 + lt * 0.11, c: TERRA, s: 320, pose: 'walk', speed: 1.8 }] });

}

  const q = E.io(inv(0.9, 1.7, lt)), a = q * Math.PI, c = mix(SAGE, TERRA, q);

}
function c7(lt, i) {

  say('站穩踏階', 660, 750, 68, INK, q, { id: 'bubble', align: 'center' });

function c8(lt, i) {

    const d = 0.1 + k * 0.2, a = 0.25 + 0.75 * Math.max(0, Math.sin(lt * 4 - k * 1.1)), s = e.sc(d) * 74, x = e.X(-0.5, d), y = e.Y(d) - 8;

const PXM = 28;   // 長梯卡的比例：1 公尺 28px，三張卡共用，高度才比得起來

function tall(lt, riders, o = {}) {
  const h = FACTS.H_HOLBORN * PXM;
  // 斜坡下方的牛皮紙三角：長梯線條細，字藏掉後要有塊面撐畫面（textless_check）
  g.fillStyle = DESK; g.beginPath(); g.moveTo(200, BOT + 30); g.lineTo(200 + h * 0.86, BOT - h + 30); g.lineTo(200 + h * 0.86, BOT + 30); g.closePath(); g.fill();
  return sideEsc({ x0: 200, y0: BOT, x1: 200 + h * 0.86, y1: BOT - h, lt, riders, hand: 46, handW: 9, th: 40, ...o });
}
function c12(lt) {
  const p = E.o3(inv(0.3, 1.7, lt));
  tall(lt, [0.1, 0.3, 0.5, 0.7].map((q, k) => ({ p: q + lt * 0.008, c: k % 2 ? BLUE : SAGE, s: 96 })));
  ruler(860, BOT, FACTS.H_HOLBORN * PXM, PXM, p);
  fig(`${FACTS.H_HOLBORN} 公尺`, 600, 1150, TERRA_D, inv(1.0, 1.5, lt), 'h-holborn');
  man(92, BOT + 6, 96, MUST);
  say('霍爾本站', 280, 640, 52, INK, 1, { id: 'station', align: 'center' });
}
function c13(lt, i) {
  // 上半：同一比例尺的長梯，尺長到 24 公尺畫虛線。下半：十個小人＝100%，四個走、六個站，個數跟比例成正比。
  const hw = FACTS.H_WALK * PXM, yl = BOT - hw, ps = E.io(inv(0.2, 1.1, lt)), b1 = beat(i, 1), b2 = beat(i, 2);
  tall(lt, [{ p: 0.14 + lt * 0.008, c: SAGE, s: 96 }, { p: 0.62 + lt * 0.008, c: BLUE, s: 96 }, { p: 0.8 + lt * 0.008, c: SAGE, s: 96 }]);
  ruler(860, BOT, hw, PXM, E.o3(inv(b1 - 0.4, b1 + 0.5, lt)));
  g.setLineDash([26, 20]); g.strokeStyle = TERRA; g.lineWidth = 8; g.beginPath(); g.moveTo(860 - 640 * ps, yl); g.lineTo(860, yl); g.stroke(); g.setLineDash([]);
  fig(`${FACTS.H_WALK} 公尺`, 330, yl + 76, TERRA, inv(b1 - 0.1, b1 + 0.4, lt), 'h-walk');
  const n = 10, walkers = FACTS.WALK_PCT / 100 * n, q = pop(lt, b2 - 0.1, 0.5);
  for (let k = 0; k < n; k++) {
    const w = k < walkers, x = 130 + k * 92;
    man(x, BOT + 40, 150, w ? TERRA : (q > 0 ? mix(MUTE, SAGE, q) : MUTE), { pose: w && q > 0 ? 'walk' : 'stand', speed: 2, t: lt, shadow: false });
  }
  fig(`${FACTS.WALK_PCT}%`, 660, 1090, TERRA_D, q, 'walk-pct');
}
function c14(lt) {
  frontEsc({ cx: 370, top: 560, wB: 600, wT: 260, lt, riders: STANDERS(5, 0.06, 0.18, 0.5, 270) });
  const row = [640, 730, 820, 910, 1000, 690, 790, 890, 985];
  row.forEach((x, k) => {
    const q = pop(lt, 0.3 + k * 0.32, 0.3); if (q <= 0) return;
    man(x, k < 5 ? GY : GY - 74, 250 * (0.85 + 0.15 * q) * (k < 5 ? 1 : 0.86), k % 2 ? BLUE : SAGE, { face: k === 0 ? 'worried' : 'none', alpha: q });
  });
}
// 落點數字卡：全片唯一不縮放（flat）的畫面，字用內頁上限內最大的 70px，長條佔滿畫面寬。
// 比例是真的：長條長度與小人個數都跟運量成正比（1 個小人＝1,000 人）。
const BX = 96, BW = 888, BH = 148, PER = 1000;
function barRow(y, label, val, col, txtCol, p, id, shown) {
  plain(label, BX, y - 24, 46, INK, { w: 700 });
  rr(BX, y, BW, BH, 26, 'rgba(59,47,42,0.10)');
  const w = BW * (val / FACTS.CAP_BOTH) * p;
  if (w > 8) rr(BX, y, w, BH, 26, col);
  const n = Math.floor(val / PER * p);
  for (let k = 0; k < n; k++) man(BX + 24 + k * (BW - 34) / (FACTS.CAP_BOTH / PER), y + BH - 10, 118, CREAM, { head: INK, shadow: false });
  // 跳數途中不登記 TEXTS：閱讀時長只算定格的數字，過程的 12,744 不用讀
  if (shown != null) say(fmt(shown), BX + BW, y - 22, 70, txtCol, 1, { id: shown === val ? id : undefined, align: 'right', bold: 0.03 });
}
function numBoard() { rr(48, 540, 984, 690, 36, DESK); plain('霍爾本站同一座手扶梯｜早上尖峰一週', 540, 596, 34, INK, { align: 'center', w: 600 }); }
function c15(lt, i) {
  numBoard();
  const p = E.o3(inv(0.1, 1.5, lt));
  barRow(700, '一邊站一邊走', FACTS.CAP_NORMAL, SAGE_D, INK, p, 'cap-a', Math.round(FACTS.CAP_NORMAL * p));
  barRow(960, '兩邊都站', 0, TERRA, TERRA_D, 0, 'cap-b', null);
}
function c16(lt, i) {
  numBoard();
  const a = beat(i, 1) - 0.1, p = E.o3(inv(a, a + 1.4, lt)), hit = pop(lt, beat(i, 2) - 0.1, 0.35);
  barRow(700, '一邊站一邊走', FACTS.CAP_NORMAL, SAGE_D, INK, 1, 'cap-a', FACTS.CAP_NORMAL);
  barRow(960, '兩邊都站', FACTS.CAP_BOTH, TERRA, TERRA_D, p, 'cap-b', Math.round(FACTS.CAP_BOTH * p));
  say(`+${FACTS.CAP_PCT}%`, 540, 1190, 70, TERRA_D, hit, { id: 'cap-pct', align: 'center', bold: 0.03 });
}
function c17(lt, i) {
  numBoard();
  const a = beat(i, 1), q = E.io(inv(a, a + 0.9, lt)), hit = pop(lt, a + 0.3, 0.4);
  barRow(700, '一邊站一邊走', FACTS.CAP_NORMAL, SAGE_D, INK, 1, 'cap-a', FACTS.CAP_NORMAL);
  barRow(960, '兩邊都站', FACTS.CAP_BOTH, MUTE, INK, 1, 'cap-b', FACTS.CAP_BOTH);
  // 少載的那一段：第一條長條後面的虛線缺口
  const x0 = BX + BW * FACTS.CAP_NORMAL / FACTS.CAP_BOTH, x1 = BX + BW;
  g.setLineDash([22, 16]); g.strokeStyle = TERRA_D; g.lineWidth = 9; g.beginPath();
  g.roundRect(x0 + 5, 705, (x1 - x0 - 10) * q, BH - 10, 20); if (q > 0.02) g.stroke(); g.setLineDash([]);
  g.globalAlpha = 0.28 * q; rr(x0 + 5, 705, x1 - x0 - 10, BH - 10, 20, TERRA); g.globalAlpha = 1;
  say(`一週少載 ${fmt(FACTS.CAP_DIFF)} 人`, 540, 1190, 70, TERRA_D, hit, { id: 'cap-diff', align: 'center', bold: 0.03 });
}
function c18(lt) {
  // 長梯留虛線當對照，短梯畫在前面；同一個比例尺
  const h = FACTS.H_HOLBORN * PXM, hs = FACTS.H_SHORT * PXM;
  g.setLineDash([22, 18]); g.strokeStyle = LINE; g.lineWidth = 10; g.beginPath(); g.moveTo(200, BOT); g.lineTo(200 + h * 0.86, BOT - h); g.stroke(); g.setLineDash([]);
  const pw = E.io(inv(0.2, 2.2, lt));
  rr(60, BOT + 14, 960, 40, 16, DESK);   // 地面（再厚會壓到字幕）
  g.fillStyle = DESK; g.beginPath(); g.moveTo(200, BOT + 30); g.lineTo(200 + hs * 0.86, BOT - hs + 30); g.lineTo(200 + hs * 0.86, BOT + 30); g.closePath(); g.fill();
  sideEsc({ x0: 200, y0: BOT, x1: 200 + hs * 0.86, y1: BOT - hs, lt, hand: 100, handW: 11, riders: [
    { p: 0.4 + lt * 0.01, c: SAGE, s: 230 }, { p: lerp(0, 1, pw), c: TERRA, s: 230, pose: pw < 1 ? 'walk' : 'armsUp', speed: 2, face: 'smile' }] });
  ruler(660, BOT, hs, PXM, E.o3(inv(0.2, 1, lt)));
  fig(`${FACTS.H_SHORT} 公尺`, 830, BOT - hs / 2 + 20, TERRA, inv(0.6, 1.1, lt), 'h-short');
}
function c19(lt) {
  const rows = [0.06, 0.26, 0.46, 0.66], R = rows.flatMap((d, k) => [{ u: -0.5, d, c: k % 2 ? BLUE : MUST, s: 320 }, { u: 0.5, d, c: k % 2 ? SAGE : BLUE, s: 320 }]);
  frontEsc({ top: 620, lt, riders: R });
  tag(`${FACTS.Y2024} 兩側皆可站立`, 440, 540, TERRA, CREAM, 'both', 60, pop(lt, 0.2));
}
function c20(lt) {
  frontEsc({ top: 520, wB: 940, wT: 380, lt, riders: [
    { u: 0.5, d: 0.3, c: SAGE, s: 560, pose: 'stand', face: 'none' },
    { u: 0.5, d: 0.75, c: BLUE, s: 520 },
    { u: -0.56, d: 0.12, c: MUST, s: 640, pose: 'point', dir: -1, aim: 0.5, face: 'smile' }] });

// head：卡名。只有封面（第 0 卡）畫成大標（陣列＝一行一個），其他卡不畫（precheck「內頁大標」門）。flat：不做 0.9 縮放的卡。
const TFL = '倫敦交通局 TfL', REP = 'Harrison 等，TfL Holborn 試行論文';
const CARDS = [
  { head: ['捷運手扶梯', '敢站左邊嗎'], hud: '示意圖', hl: ['站左邊'], draw: c1 },
  { head: '被瞪', hud: '示意圖', hl: ['瞪到發毛'], draw: c2 },
  { head: '左行右立', hud: '台灣英文新聞／遠見', hl: ['載更多人'], draw: c3 },
  { head: '相反', hud: '示意圖', hl: ['相反'], draw: c4 },
  { head: '靠右站', hud: '台灣英文新聞／遠見', hl: ['靠右站'], draw: c5 },
  { head: '流得快', hud: '台灣英文新聞／遠見', hl: ['流得快'], draw: c6 },
  { head: '站穩踏階', hud: '台灣英文新聞／遠見', hl: ['站穩踏階'], draw: c7 },
  { head: '法律', hud: '大眾捷運法第 50 條', hl: ['沒規定', '不聽勸'], draw: c8 },
  { head: '不講了', hud: '台灣英文新聞／遠見', hl: ['就不講了'], draw: c9 },
  { head: '反直覺', hud: '示意圖', hl: ['反直覺'], draw: c10 },
  { head: '比較快嗎', hud: '示意圖', hl: ['比較快'], draw: c11 },
  { head: 'Holborn', hud: TFL, hl: ['23.4公尺'], draw: c12 },
  { head: '願意走', hud: REP, hl: ['24公尺', '四成'], draw: c13 },
  { head: '越排越長', hud: REP, hl: ['空著', '越排越長'], draw: c14 },
  { head: '平常', hud: REP, hl: ['一萬兩千七百四十五'], draw: c15, flat: true },
  { head: '兩邊都站', hud: REP, hl: ['一萬六千兩百二十', '快三成'], draw: c16, flat: true },
  { head: '少載', hud: REP, hl: ['一週反而少載三千多人'], draw: c17, flat: true },
  { head: '短梯', hud: '倫敦地鐵 Canary Wharf 站觀察（TfL 報告）', hl: ['10公尺', '比較快'], draw: c18 },
  { head: '兩側站', hud: `北捷新聞稿 ${FACTS.Y2024}-10-23`, hl: ['兩側皆可站立'], draw: c19 },
  { head: '不用怕', hud: '示意圖', hl: ['不用再怕'], draw: c20 },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
// 封面多留到 2.8 秒：大標兩行各 5 字要讀 2.61 秒（readcheck），第 2 句開頭還蓋在封面上
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : i === 1 ? Math.max(l.t0 - 0.2, 2.8) : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾品牌卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const beat = (i, k) => { const p = TL.lines[i].phrases; return (p && p[k] ? p[k].t0 : TL.lines[i].t0) - T0[i]; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部品牌標籤 ----------
function series() {
  // 上下往中間收（使用者 11-05）：IG 網格 3:4 上下各裁約 240px，Shorts 底部有說明欄
  plain(BRAND, 540, 290, 34, DIM, { align: 'center', w: 600 });
  rr(510, 312, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = rows.length > 1 ? 1330 : 1340;
  rr(510, y0 - 80, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾品牌卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  // 中等字級（< precheck HEADLINE_PX），三個小人是主角
  say(BRAND, 540, 640, 68, INK, 1, { id: 'end-brand', align: 'center', bold: 0.03 });
  rr(510, 680, 60, 5, 3, SAGE);
  [[SAGE, 330, 'armsUp'], [MUST, 540, 'armsUp'], [TERRA, 750, 'armsUp']].forEach(([c, x, pose], k) => man(x, 1150, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1260, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角，寫法照 films/elected-dictator ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  // 嘴跟旁白開合；表情維持 idle
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
// 畫框 x 875 起、y 260 起、邊長 224（框右緣的透明留白超出畫面無妨），可見身形約 x 906–1067、y 299–455：
// IG 主頁格把 9:16 置中裁成 3:4（上下各裁約 240px），整隻要在 y 240 以下；左邊讓開置中大標（最寬到 x 890）。
const MASCOT = { x: 800, y: 300, s: 260 };   // 放大、左移，整隻在畫面與 IG 網格內
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：底色一樣，看起來是小人與道具在原地換狀態，不是切鏡頭。
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = []; rtime = t;
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series();
  // 只留封面大標（使用者 11-04）：第 0 卡第 0 幀就完整顯示，其他卡不畫大標副標，畫面當主角
  // 五個字一行：145px、往左讓開右上主播，封面 OCR 才認得到（democracy-noise 的做法），兩行疊放
  if (i === 0) cd.head.forEach((s, k) => say(s, 440, 470 + k * 160, 145, INK, 1, { id: `head${k + 1}`, align: 'center', bold: 0.022 }));
  // 插畫以 (540, 880) 為中心縮 0.9：地平線 1270→1231，讓字幕與來源往上收
  const z = cd.flat ? 1 : 0.9 + 0.005 * Math.min(lt, 7);   // 緩慢推近，只吃卡內秒數；calm 片型的畫面呼吸。數字卡 flat：字級要是真的 70px
  g.save(); g.translate(540, 880); g.scale(z, z); g.translate(-540, -880); cd.draw(lt, i); g.restore();
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1460, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
