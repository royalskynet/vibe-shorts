let TXT = [];
function say(s, x, y, px, col, p, o = {}) {

}

const PERM = (() => { const r = G.rng(11), a = [...Array(40).keys()]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();

}

// ---------- 長條：rows=[{name, val, col, tc, label}]，x0／w 是長條範圍 ----------
function bars(o) {
  const x0 = o.x0 ?? 120, w = o.w ?? 800, gap = o.gap ?? 200, bh = o.bh ?? 100;
  o.rows.forEach((r, j) => {

const C_MIX = cols([[BLUE, 18], [SAGE, 18], [MUST, 4]]);

function bubbles(lt, n, seed, x0, x1, y0, y1, col) {
  const R = G.rng(seed);
  for (let k = 0; k < n; k++) {
    const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0), tl = R() < 0.5 ? 'left' : 'right';

function c03(lt) {

  man(840, GY, 420, MUST, { pose: 'think', dir: -1, face: p > 0.6 ? 'smile' : 'worried' });

}
function c05(lt) {
  for (let k = 0; k < 10; k++) { const loud = k === 0; man(110 + k * 96, 1010, 150, loud ? TERRA : MUTE, { pose: loud ? 'armsUp' : 'stand', face: loud ? 'smile' : 'none' }); }
  for (let k = 0; k < 6; k++) { const ph = loop(lt * 1.2 + k / 6, 1); prop(g, 'speech', { x: 130 + ph * 160, y: 790 - ph * 200, s: 60, tail: 'left', stroke: TERRA, color: TERRA, alpha: 1 - ph }); }

function c12(lt) {
  [['選舉', 220], ['議會', 540], ['媒體', 860]].forEach(([s, x], j) => {
    const a = pop(lt, 0.1 + j * 0.35);
    prop(g, 'card', { x, y: 830, w: 290, h: 400, alpha: a });
    g.save(); g.globalAlpha *= a;
    rr(x - 145, 630, 290, 110, 22, [BLUE, MUST, SAGE][j]);
    plain(s, x, 710, 52, CREAM, { align: 'center', w: 700 });
    if (j === 0) { rr(x - 95, 820, 190, 160, 16, '#5A463C'); rr(x - 55, 834, 110, 16, 8, CREAM); }
    if (j === 1) prop(g, 'house', { x, y: 990, s: 230, shadow: false });

  });
}
function c14(lt) { crowd({ y0: 690, from: C_MIX, to: C_QUIET, lt, q: true }); }

  prop(g, 'speech', { x: 750, y: 620 + Math.sin(lt * 3 + 1) * 6, s: 130, tail: 'right', stroke: SAGE, color: SAGE_D });
}
function c16(lt) {

  for (let k = 0; k < 5; k++) { man(330 + k * 105, GY, 170, k % 2 ? SAGE : BLUE, { pose: 'stand', face: 'none' }); }
  prop(g, 'question', { x: 180, y: GY - 500 + Math.sin(lt * 2.5) * 6, s: 80, color: BLUE_D, alpha: pop(lt, 0.4) });
  prop(g, 'question', { x: 900, y: GY - 500 + Math.sin(lt * 2.5 + 1) * 6, s: 80, color: SAGE_D, alpha: pop(lt, 0.7) });

function c17(lt) {

}
function c18(lt) {

  man(700, 900, 200, TERRA, { pose: 'armsUp', dir: -1, face: 'worried', tilt: Math.sin(lt * 6 + 2) * 0.05, shadow: false });
  g.globalAlpha = 1;

}
function c19(lt) {
  const p = E.io(inv(0.4, 2.4, lt)), gap = lerp(300, 60, p);
  for (let k = 0; k < 6; k++) {
    const r = Math.floor(k / 3), c = k % 3;

    man(540 + gap / 2 + 60 + c * 110 + (r ? 55 : 0), 1060 + r * 200, 170, SAGE, { pose: POSE_MIX[k + 6][0], dir: -1 });
  }
  g.strokeStyle = TERRA; g.lineWidth = lerp(26, 8, p); g.lineCap = 'round'; g.setLineDash([30, 24]);
  g.beginPath(); g.moveTo(540, 640); g.lineTo(540, 1280); g.stroke(); g.setLineDash([]);
  prop(g, 'megaphone', { x: 540, y: 570, s: 120, t: lt, alpha: 1 - p });
}
function c20(lt) {
  prop(g, 'phone', { x: 320, y: 880, s: 380, rows: 3, avatars: [BLUE, SAGE, TERRA] });
  man(790, GY, 420, MUST, { pose: 'think', dir: -1 });
  prop(g, 'bulb', { x: 790, y: 700, s: 170, on: pop(lt, 0.8, 0.6), t: lt });
}
function c21(lt) { crowd({ y0: 690, to: C_LOUD, lt, loud: true }); }
function c22(lt) {
  c17vote(lt);
  fig(FACTS.VOTE_DATE, 540, 640, TERRA, inv(0.6, 1.0, lt), 'fig-date');
}

// head：卡名。只有封面（第 0 卡）畫成大標，其他卡不畫（使用者 11-04：只留封面大標，precheck「內頁大標」門）。
const PEW = 'Pew Research Center 2019', RATHJE = 'Rathje 等 2021, PNAS', MIC = 'More in Common 2019';
const CARDS = [
  { head: '民主好亂？', hud: '示意圖', hl: ['這麼亂'], draw: c01 },
  { head: '都在吵架', hud: '示意圖', hl: ['吵架'], draw: c02 },
  { head: '比感覺的小', hud: '示意圖', hl: ['感覺到的小'], draw: c03 },
  { head: '美國推特', hud: PEW, hl: ['一年'], draw: c04 },
  { head: '一小群人', hud: PEW, hl: ['百分之九十七', '百分之十'], draw: c05 },
  { head: '一小群人', hud: PEW, hl: ['一小群人'], draw: c06 },
  { head: '容易被轉傳', hud: RATHJE, hl: ['轉傳'], draw: c07 },
  { head: '兩百七十萬則', hud: RATHJE, hl: ['兩百七十多萬則'], draw: c08 },
  { head: '兩倍', hud: RATHJE, hl: ['兩倍'], draw: c09 },
  { head: '怒算五個讚', hud: 'Washington Post 2021-10-26', hl: ['五個讚'], draw: c10 },
  { head: '民主會吵', hud: '示意圖', hl: ['運作的一部分'], draw: c11 },
  { head: '公開比', hud: '示意圖', hl: ['公開比'], draw: c12 },
  { head: '乾脆不講', hud: '示意圖（第一集）', hl: ['乾脆不講'], draw: c5 },
  { head: '看起來安靜', hud: '示意圖', hl: ['意見一致'], draw: c14 },
  { head: '對立是真的', hud: '示意圖', hl: ['真的'], draw: c15 },
  { head: '猜對面', hud: MIC, hl: ['立場極端'], draw: c16 },
  { head: '猜多一倍', hud: MIC, hl: ['將近一倍'], draw: c17 },
  { head: '心裡的對面', hud: MIC, hl: ['極端得多'], draw: c18 },
  { head: '被放大', hud: '示意圖', hl: ['被放大'], draw: c19 },
  { head: '先想想', hud: '示意圖', hl: ['先想想'], draw: c20 },
  { head: '最大聲的', hud: '示意圖', hl: ['最大聲'], draw: c21 },
  { head: '一起投票', hud: '中選會', hl: ['同一個家鄉'], draw: c22 },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾系列卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部系列標籤 ----------
function series() {
  // 上下往中間收（使用者 11-05）：IG 網格 3:4 上下各裁約 240px，Shorts 底部有說明欄
  plain(`${SERIES}｜系列`, 540, 290, 34, DIM, { align: 'center', w: 600 });
  rr(510, 312, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = rows.length > 1 ? 1330 : 1340;
  rr(510, y0 - 80, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  // 系列名比照參考帳號片尾：中等字級（< precheck HEADLINE_PX），三個小人是主角
  say(SERIES, 540, 640, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  say(`第 ${EP} 集`, 540, 720, 44, TERRA, 1, { id: 'end-ep', align: 'center' });
  rr(510, 752, 60, 5, 3, SAGE);
  [[BLUE, 330, 'armsUp'], [MUST, 540, 'stand'], [SAGE, 750, 'armsUp']].forEach(([c, x, pose], k) => man(x, 1150, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1260, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角，寫法照 films/elected-dictator ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  // 嘴跟旁白開合；表情維持 idle
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
// 畫框 x 875 起、y 260 起、邊長 224（框右緣的透明留白超出畫面無妨），可見身形約 x 906–1067、y 299–455：
// IG 主頁格把 9:16 置中裁成 3:4（上下各裁約 240px），整隻要在 y 240 以下；左邊讓開置中大標（最寬到 x 890）。
const MASCOT = { x: 800, y: 300, s: 260 };   // 放大、左移，整隻在畫面與 IG 網格內
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：底色一樣，看起來是小人與道具在原地換狀態，不是切鏡頭。
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series();
  // 只留封面大標（使用者 11-04）：第 0 卡第 0 幀就完整顯示，其他卡不畫大標副標，畫面當主角
  // 五個字 170px 會壓到右上主播，封面 OCR 認不出大標；縮到 145px、往左讓開
  if (i === 0) say(cd.head, 440, 480, 145, INK, 1, { id: 'head1', align: 'center', bold: 0.05 });
  // 插畫以 (540, 880) 為中心縮 0.9：地平線 1270→1231，讓字幕與來源往上收
  g.save(); g.translate(540, 880); g.scale(0.9, 0.9); g.translate(-540, -880); cd.draw(lt); g.restore();
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1460, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
