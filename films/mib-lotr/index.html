<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>MIB 跟魔戒，都藏著一個一樣的道理</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#mascot{display:none}#mascot svg{width:340px;height:340px}</style>
<script src="engine.js"></script>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="mascot"></div>
<script type="module">
// 單人旁白科普，畫面照無邊探索（refs/boundless/ANALYSIS.md §3，使用者 11-03 採用）：
// 全片同一張米色底、不硬切；扁平小人＋四色；一句一個畫面狀態（CARDS），字幕一卡一個逗號短語（timeline.js 的 phrases）；
// 頂部系列標籤，片尾系列卡。藍綠是本片主題，陣營色用灰藍／鼠尾草綠，中間選民芥末黃，不開口的人灰色。
// 11-04 改版（使用者定）：小人與道具改用共用插畫庫 illust/illust.mjs（正本 assets/illust/，scripts/illust_install.sh 複製進來）；
// 只留封面大標：第 0 卡有大標，其餘卡只有系列標籤＋畫面＋字幕＋來源，畫面往上放大當主角（precheck「內頁大標」門）。
// 禁止清單（TREATMENT.md）：不畫軍人、軍裝、軍機、軍艦、國旗；威脅一律用幻想物（星際戰艦、死光、瘟疫）。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
const SAGE = '#7FA57A', BLUE = '#6F8FB0', MUTE = '#B3A797', SOFT = '#EBE1D2', DIM = '#8C7B6B';
const BLUE_D = '#4F6F90', SAGE_D = '#557A51', MUST_D = '#9A6F1C';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '電影裡的悖論', EP = 1, HANDLE = '@paradoxbar';
const GY = 1270;   // 畫面地平線：小人腳底；字幕短橫線在 1308

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。
const FACTS = {
  Y_MIB: 1997,    // F1 《MIB星際戰警》美國上映年
  Y_LOTR: 2001, Y_ROTK: 2003,   // F2 《魔戒》首部曲上映年
};
const fmt = n => n.toLocaleString('en-US');

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  // PingFang 最粗只到 Semibold；o.bold 描同色邊加粗，大標在奶油底上才讀得出（封面 OCR）
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });
// 畫面裡的數字標籤：比字幕大一點、遠小於大標（< precheck HEADLINE_PX），算插畫的一部分
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });

// 白卡片放在米色底上，藏字檢查（textless_check）算不到畫面；要用卡片就加一圈有色外框
// （2026-11-11 songshan-airport 14 張卡因此被擋）
function framed(cx, cy, w, h, col, a = 1) {
  g.save(); g.globalAlpha *= a; rr(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36, 34, col); g.restore();
  prop(g, 'card', { x: cx, y: cy, w, h, alpha: a });
}

// ---------- 道具 ----------
const SKY_FAINT = 0.22;
function hill(a = 1) { g.save(); g.globalAlpha *= a; g.fillStyle = SAGE; g.beginPath(); g.ellipse(540, GY + 5, 760, 40, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
function planet(cx, cy, r) {
  G.disc(g, cx, cy, r, SAGE);
  G.disc(g, cx + r * 0.3, cy - r * 0.2, r * 0.42, '#6F9469');
  G.disc(g, cx - r * 0.35, cy + r * 0.35, r * 0.25, '#6F9469');
  g.strokeStyle = INK; g.lineWidth = 8; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
}
function ship(x, y, s, ang, a = 1) {   // 朝 ang 方向飛的戰艦
  g.save(); g.translate(x, y); g.rotate(ang); g.globalAlpha *= a;
  g.fillStyle = TERRA; g.beginPath(); g.moveTo(s, 0); g.lineTo(-s * 0.7, -s * 0.55); g.lineTo(-s * 0.35, 0); g.lineTo(-s * 0.7, s * 0.55); g.closePath(); g.fill();
  G.disc(g, s * 0.1, 0, s * 0.18, CREAM);
  g.restore();
}
function plague(x, y, s, t, a = 1) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(t);
  g.strokeStyle = MUST_D; g.lineWidth = s * 0.14; g.lineCap = 'round';
  for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4; g.beginPath(); g.moveTo(Math.cos(an) * s * 0.7, Math.sin(an) * s * 0.7); g.lineTo(Math.cos(an) * s * 1.15, Math.sin(an) * s * 1.15); g.stroke(); }
  G.disc(g, 0, 0, s * 0.75, '#9BA84A'); G.disc(g, -s * 0.2, -s * 0.2, s * 0.18, '#C5CF7A');
  g.restore();
}
function ray(x, y, dx, dy, w, a = 1) {
  g.save(); g.globalAlpha *= a; g.lineCap = 'round';
  g.strokeStyle = TERRA; g.lineWidth = w; g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.stroke();
  g.strokeStyle = CREAM; g.lineWidth = w * 0.35; g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.stroke();
  g.restore();
}
// 三種威脅（戰艦、死光、瘟疫）從四面逼近中心 (cx, cy)；a 是整體透明度
function threats(lt, a, cx, cy, R) {
  const at = (ang, d0, d1, q) => [cx + Math.cos(ang) * lerp(d0, d1, q), cy + Math.sin(ang) * lerp(d0, d1, q)];
  const fx = q => inv(0, 0.15, q) * (1 - inv(0.88, 1, q));
  let q = loop(lt * 0.45, 1), [x, y] = at(-2.5, 500, R + 70, q);
  ship(x, y, 54, -2.5 + Math.PI, a * fx(q));
  q = loop(lt * 0.45 + 1 / 3, 1); [x, y] = at(0.15, 540, R + 80, q);
  ray(x, y, -Math.cos(0.15) * 150, -Math.sin(0.15) * 150, 18, a * fx(q));
  q = loop(lt * 0.45 + 2 / 3, 1); [x, y] = at(1.55, 380, R + 70, q);
  plague(x, y, 34, lt * 2, a * fx(q));
}
const SUIT = INK, HOBBIT = MUST;

// ---------- 每張卡的畫面（畫在 y 500–1290；x≥875、y<480 是主播位置） ----------
function icoSpace(cx, cy, s, lt) {
  planet(cx, cy + s * 0.2, s * 0.42);
  ship(cx + s * 0.1 + Math.sin(lt * 2) * 8, cy - s * 0.45, s * 0.17, 0.3);
}
function icoMiddle(cx, cy, s, lt) {
  g.fillStyle = '#8A6A55'; g.beginPath(); g.moveTo(cx - s * 0.5, cy + s * 0.6); g.lineTo(cx, cy - s * 0.4); g.lineTo(cx + s * 0.5, cy + s * 0.6); g.closePath(); g.fill();
  G.disc(g, cx, cy - s * 0.4, s * 0.1 * (1 + 0.1 * Math.sin(lt * 5)), TERRA);
  g.strokeStyle = MUST; g.lineWidth = 9; g.beginPath(); g.arc(cx, cy + s * 0.12, s * 0.12, 0, Math.PI * 2); g.stroke();
}
function c1(lt) {
  // 封面：兩張海報並排，中間一個等號
  const a = pop(lt, 0.05, 0.4), b = pop(lt, 0.2, 0.4);
  g.save(); g.globalAlpha *= a; framed(300, 920, 380, 520, TERRA);
  icoSpace(300, 880, 300, lt);
  plain('《MIB星際戰警》', 300, 1120, 38, INK, { align: 'center', w: 700 }); plain(`${FACTS.Y_MIB}`, 300, 1166, 34, DIM, { align: 'center', w: 600 }); g.restore();
  g.save(); g.globalAlpha *= b; framed(780, 920, 380, 520, MUST);
  icoMiddle(780, 860, 300, lt);
  plain('《魔戒》', 780, 1120, 38, INK, { align: 'center', w: 700 }); plain(`${FACTS.Y_LOTR}`, 780, 1166, 34, DIM, { align: 'center', w: 600 }); g.restore();
  rr(515, 905, 50, 10, 5, INK); rr(515, 940, 50, 10, 5, INK);
}
function c2(lt) {
  // 台詞：戰艦、死光、瘟疫逼近小小的地球
  planet(540, 900, 170);
  threats(lt, 1, 540, 900, 170);
}
function c3(lt) {
  // 人類不知道：天上威脅很淡，地上的人笑著過日子，頭上冒問號
  G.disc(g, 180, 640, 62, MUST);
  threats(lt, SKY_FAINT, 540, 760, 150);
  [[190, TERRA], [420, MUST], [650, SAGE], [880, '#C7A77F']].forEach(([x, c], k) => {
    const up = Math.floor(lt * 1.5 + k) % 2 === 0;
    man(x, GY, 300, c, { pose: up ? 'armsUp' : 'stand', face: 'smile' });
    prop(g, 'question', { x, y: GY - 360 + Math.sin(lt * 2.5 + k) * 6, s: 52, color: DIM });
  });
}
function c4(lt) {
  // 黑衣人：身分證上的內文一行行被抹掉，最後打叉
  const p = E.io(inv(0.5, 2.4, lt)), flash = Math.max(0, 1 - Math.abs(lt - 0.5) * 3);
  prop(g, 'document', { x: 330, y: 900, s: 420, title: '身分', titlePx: 9, lines: Math.round(lerp(5, 0, p)), cross: p > 0.85 });
  man(600, GY, 300, SUIT, { pose: 'stand', dir: -1, face: 'none' });
  man(980, GY, 300, SUIT, { pose: 'stand', dir: -1, face: 'none' });
  man(780, GY, 420, SUIT, { pose: 'stand', dir: -1, face: 'none' });
  if (flash > 0) { g.globalAlpha = flash * 0.7; G.disc(g, 330, 900, 260, '#FFFFFF'); g.globalAlpha = 1; }
}
function c5(lt) {
  // 夏爾：哈比人照常過日子；遠處冒煙，他們頭上問號
  hill();
  for (let k = 0; k < 3; k++) {
    const q = loop(lt * 0.25 + k / 3, 1);
    g.globalAlpha = 0.35 * Math.sin(q * Math.PI); G.disc(g, 880 + k * 24, 760 - q * 160, 50 + q * 40, INK); g.globalAlpha = 1;
  }
  prop(g, 'house', { x: 200, y: GY - 20, s: 300 }); prop(g, 'house', { x: 520, y: GY - 20, s: 300 });
  [[720, 'armsUp'], [860, 'stand']].forEach(([x, pose], k) => {
    man(x, GY, 190, HOBBIT, { pose: Math.floor(lt * 1.5 + k) % 2 ? 'stand' : pose, face: 'smile' });
    prop(g, 'question', { x, y: GY - 310 + Math.sin(lt * 2.5 + k) * 6, s: 46, color: DIM });
  });
}
function c6(lt) {
  // 佛羅多揹著戒指走向末日火山，越走身體越往前傾
  g.fillStyle = '#8A6A55'; g.beginPath(); g.moveTo(330, GY); g.lineTo(700, 640); g.lineTo(1070, GY); g.closePath(); g.fill();
  G.disc(g, 700, 640, 44 * (1 + 0.1 * Math.sin(lt * 5)), TERRA);
  const p = E.io(inv(0.2, 3.6, lt)), x = lerp(120, 520, p), y = x < 330 ? GY : GY - (x - 330) * 1.7;
  man(x, y, 190, HOBBIT, { pose: 'walk', t: lt, tilt: 0.12 + 0.12 * p, face: 'worried' });
  g.strokeStyle = MUST; g.lineWidth = 9; g.beginPath(); g.arc(x + 34, y - 88, 17, 0, Math.PI * 2); g.stroke();
}
function c7(lt) {
  // 回到夏爾：舊日子的影子走進家門，真的他站在外面回不去
  hill();
  prop(g, 'house', { x: 800, y: GY - 20, s: 330 });
  const q = loop(lt * 0.4, 1);
  man(lerp(430, 740, q), GY, 240, HOBBIT, { pose: 'walk', t: lt, face: 'smile', alpha: 0.3 * Math.sin(q * Math.PI), shadow: false });
  man(430, GY, 240, HOBBIT, { pose: 'shrug', face: 'worried' });
}
function c8(lt) {
  // 兩邊的守護者背對著中間那間亮燈的家
  hill();
  G.disc(g, 540, 700, 70 + 6 * Math.sin(lt * 2), MUST);
  prop(g, 'house', { x: 540, y: GY - 20, s: 360 });
  man(210, GY, 360, SUIT, { pose: 'stand', dir: -1, face: 'none' });
  man(870, GY, 260, HOBBIT, { pose: 'stand', dir: 1, face: 'worried' });
  ship(150, 820, 40, 0.3); icoMiddle(930, 840, 140, lt);
}
function c9(lt) {
  // 擋得越成功：威脅撞上牆就消失，牆後的人毫無察覺
  rr(700, 600, 16, 640, 8, TERRA);
  for (let k = 0; k < 3; k++) {
    const q = loop(lt * 0.5 + k / 3, 1), x = lerp(1040, 740, q), y = 760 + k * 170;
    ship(x, y, 44, Math.PI, 1 - inv(0.85, 1, q));
  }
  man(800, GY, 380, SUIT, { pose: 'armsUp', dir: -1, face: 'none' });
  [[130, TERRA], [330, MUST], [530, SAGE]].forEach(([x, c], k) => {
    man(x, GY, 260, c, { pose: 'stand', face: 'smile' });
    prop(g, 'question', { x, y: GY - 320 + Math.sin(lt * 2.5 + k) * 6, s: 46, color: DIM });
  });
}
function c10(lt) {
  // 負重前行：背著大包袱的人原地走，地面往後退，遠處的家亮著燈
  prop(g, 'house', { x: 140, y: GY - 20, s: 200 }); prop(g, 'house', { x: 330, y: GY - 20, s: 200 });
  G.disc(g, 235, 880, 36, MUST);
  g.strokeStyle = MUTE; g.lineWidth = 14; g.lineCap = 'round';
  for (let k = 0; k < 4; k++) { const x = 1100 - loop(lt * 300 + k * 260, 1040); g.beginPath(); g.moveTo(x, GY + 40); g.lineTo(x + 120, GY + 40); g.stroke(); }
  [[620, SUIT, 380], [880, HOBBIT, 220]].forEach(([x, c, s], k) => {
    g.save(); g.translate(x, GY); g.rotate(0.1);
    rr(-s * 0.46, -s * 0.78, s * 0.3, s * 0.42, 14, '#A5835D'); rr(-s * 0.44, -s * 0.74, s * 0.26, s * 0.1, 8, '#C7A77F');
    g.restore();
    man(x, GY, s, c, { pose: 'walk', t: lt + k * 0.4, tilt: 0.1, face: k ? 'worried' : 'none' });
  });
}

// head：卡名。只有封面（第 0 卡）畫成大標，其他卡不畫（使用者 11-04：只留封面大標，precheck「內頁大標」門）。
const CARDS = [
  { head: '一樣的道理', hud: '示意圖', hl: ['一樣的道理'], draw: c1 },
  { head: '星際戰艦', hud: `《MIB星際戰警》${FACTS.Y_MIB}`, hl: ['毀滅'], draw: c2 },
  { head: '人類不知道', hud: '示意圖', hl: ['不知道'], draw: c3 },
  { head: '身分被抹掉', hud: `《MIB星際戰警》${FACTS.Y_MIB}`, hl: ['抹得乾乾淨淨', '沒有人知道'], draw: c4 },
  { head: '夏爾', hud: `《魔戒》${FACTS.Y_LOTR} 起`, hl: ['不知道'], draw: c5 },
  { head: '末日火山', hud: `《魔戒》${FACTS.Y_LOTR} 起`, hl: ['末日火山', '站不起來'], draw: c6 },
  { head: '回不去', hud: `《魔戒：王者再臨》${FACTS.Y_ROTK}`, hl: ['回不去'], draw: c7 },
  { head: '一樣的道理', hud: '示意圖', hl: ['拿自己的日子換來'], draw: c8 },
  { head: '擋得越成功', hud: '示意圖', hl: ['越不會發現'], draw: c9 },
  { head: '負重前行', hud: '示意圖', hl: ['負重前行'], draw: c10 },
];
const N = CARDS.length;
if (TL.lines.length !== N) throw new Error(`timeline.js 有 ${TL.lines.length} 句，卡片 ${N} 張，對不上`);
const DUR = TL.dur;
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - 0.2);
const END0 = TL.lines[N - 1].t1 + 0.3;   // 片尾系列卡
const cardAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const PH = TL.lines.flatMap((l, i) => (l.phrases || [{ text: l.text, t0: l.t0, t1: l.t1 }]).map(p => ({ ...p, card: i })));

// ---------- 頂部系列標籤 ----------
function series() {
  plain(`${SERIES}｜系列`, 540, 150, 34, DIM, { align: 'center', w: 600 });
  rr(510, 172, 60, 5, 3, TERRA);
}

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {
  const j = PH.findIndex((p, k) => t >= p.t0 - 0.05 && t < Math.min(p.t1 + 0.25, PH[k + 1] ? PH[k + 1].t0 - 0.05 : Infinity));
  if (j < 0 || t >= END0) return;
  const p = PH[j], hl = CARDS[p.card].hl || [];
  const px = 58, maxW = 900;
  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 1400 - (rows.length - 1) * 36;
  rr(510, y0 - 92, 60, 6, 3, INK);
  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

// ---------- 片尾系列卡 ----------
function endCard(t) {
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  const lt = t - END0;
  // 系列名比照參考帳號片尾：中等字級（< precheck HEADLINE_PX），三個小人是主角
  say(SERIES, 540, 640, 68, INK, 1, { id: 'end-series', align: 'center', bold: 0.03 });
  say(`第 ${EP} 集`, 540, 720, 44, TERRA, 1, { id: 'end-ep', align: 'center' });
  rr(510, 752, 60, 5, 3, SAGE);
  [[INK, 330, 'armsUp'], [MUST, 540, 'stand'], [SAGE, 750, 'armsUp']].forEach(([c, x, pose], k) => man(x, 1150, 260, c, { pose, face: 'smile', tilt: Math.sin(lt * 2 + k) * 0.04 }));
  plain(HANDLE, 540, 1260, 40, DIM, { align: 'center', w: 600 });
}

// ---------- 主播 Paradox（Clawd Bot）：右上角，寫法照 films/elected-dictator ----------
const svgText = await fetch('./mascot/clawd-bot.svg').then(r => { if (!r.ok) throw new Error('取不到 mascot/clawd-bot.svg'); return r.text(); });
const host = document.getElementById('mascot'); host.innerHTML = svgText;
const ROOT = host.querySelector('svg'); if (!ROOT) throw new Error('mascot svg 解析失敗');
const TRACK = { fps: 30, states: [{ t: 0, state: 'idle' }], looks: CARDS.map((c, i) => ({ t: T0[i], x: -0.5, y: 0.5 })), pokes: [] };
function poseHost(t) {
  applyPose(ROOT, poseAt(t, TRACK));
  // 嘴跟旁白開合；表情維持 idle
  if (!TL.lines.some(l => t >= l.t0 && t <= l.t1)) return;
  const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 13.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 4.3 + 1)));
  ROOT.querySelector('#mouth').setAttribute('d', `M-5,8 Q0,${(9 + a * 5).toFixed(2)} 5,8`);
}
// 畫框 x 875 起、y 260 起、邊長 224（框右緣的透明留白超出畫面無妨），可見身形約 x 906–1067、y 299–455：
// IG 主頁格把 9:16 置中裁成 3:4（上下各裁約 240px），整隻要在 y 240 以下；左邊讓開置中大標（最寬到 x 890）。
const MASCOT = { x: 875, y: 260, s: 224 };
let mascotTok = 0;
function finish(t) {
  caption(t);
  poseHost(t);
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.drawImage(img, MASCOT.x, MASCOT.y, MASCOT.s, MASCOT.s);
  });
}

// ---------- 主迴圈 ----------
// 換卡＝原地交叉淡化 XF 秒：底色一樣，看起來是小人與道具在原地換狀態，不是切鏡頭。
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));
    if (k < 1) { drawCard(N - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
    endCard(t);
    if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
    return finish(t);
  }
  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
  series();
  // 只留封面大標（使用者 11-04）：第 0 卡第 0 幀就完整顯示，其他卡不畫大標副標，畫面當主角
  if (i === 0) say(cd.head, 520, 370, 132, INK, 1, { id: 'head1', align: 'center' });  // 5 字大標 132px 避開右上吉祥物；原 170px 不描邊：bold 0.05 會糊（11-11 使用者回報）
  g.save(); cd.draw(lt); g.restore();
  g.globalAlpha = 1;
  plain(`來源｜${cd.hud}`, 540, 1530, 28, DIM, { align: 'center', w: 500 });
}

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = PH.map(p => ({ t0: p.t0, t1: p.t1, text: p.text }));
window.SHAKES = [];
window.EV = [{ t: 0, type: 'bed', len: DUR }];   // 只留配樂（calm 片型），不加換卡音效
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字，整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789,%';
await Promise.all([700, 600].map(w => document.fonts.load(ZH(w, 58), allText)));
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
</body>
</html>
