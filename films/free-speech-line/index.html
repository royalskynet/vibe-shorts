<body>

<script type="module">
// 單人旁白科普，米色插畫風（範本 films/taipei-silence）：全片同一張底、不硬切，一句一卡，只有封面有大標。
// 稿＝bakeoff/story.md（使用者 2026-11-15 核過，台詞一字不改）；畫面只畫每句的因果，不替稿加話。
// 禁止清單（TREATMENT.md）：不畫真人臉、不畫政黨標誌、不模擬新聞或法院截圖、不畫中國領導人與軍隊。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
import { PALETTE, person, prop } from './illust/illust.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix } = G;

const CREAM = PALETTE.cream, INK = PALETTE.ink, TERRA = PALETTE.terra, MUST = PALETTE.mustard, COAT = PALETTE.coat;
const SAGE = '#7FA57A', MUTE = '#B3A797', SOFT = '#EBE1D2', DIM = '#8C7B6B';
const SAGE_D = '#557A51', MUST_D = '#9A6F1C', TERRA_D = '#9E4A33';
const SLATE = '#6F7C8A', SLATE_D = '#4F5B66', WOOD = '#A5835D', PAPER = '#FFF8EA', LINE = '#D6C8B4';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`;
const SERIES = '法律的邊界', EP = 1, HANDLE = '@paradoxbar';
const GY = 1270;   // 畫面地平線：小人腳底；字幕短橫線在 1308

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。
const FACTS = {
  YEARS_AGO: 35,      // FACTS 15；2026−1991
  Y1991: 1991,        // FACTS 15 獨臺會案
  Y1992: 1992,        // FACTS 13 刑法 100 條修正
  Y2008: 2008,        // FACTS 6、7 釋字 644
  ART100: 100,        // FACTS 13、14
  ART5: 5,            // FACTS 11 反滲透法第 5 條
  FINE_MIN: 500000,   // FACTS 11 罰鍰 50 萬
  FINE_MAX: 5000000,  // FACTS 11 罰鍰 500 萬
  JAIL_YEARS: 3,      // FACTS 11 最重 3 年
};
const fmt = n => n.toLocaleString('en-US');

// ---------- 字 ----------
let TXT = [];
function say(s, x, y, px, col, p, o = {}) {
  g.save(); g.font = ZH(o.w || 700, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y);
  if (o.bold) { g.strokeStyle = col; g.lineWidth = px * o.bold; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(s, x, y);
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));
const loop = (x, n) => ((x % n) + n) % n;
const rr = (x, y, w, h, r, col) => { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const man = (x, y, s, body, o = {}) => person(g, { x, y, s, body, ...o });
const fig = (s, x, y, col, p = 1, id) => say(s, x, y, 64, col, p, { id, align: 'center', bold: 0.03 });
const check = (x, y, s, col, p = 1) => {
  g.save(); g.globalAlpha *= p; g.strokeStyle = col; g.lineWidth = s * 0.2; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - s * 0.5, y); g.lineTo(x - s * 0.12, y + s * 0.38); g.lineTo(x + s * 0.55, y - s * 0.42); g.stroke(); g.restore();
};

// 白卡片放在米色底上，藏字檢查算不到畫面；要用卡片就加一圈有色外框
function framed(cx, cy, w, h, col, a = 1) {
  g.save(); g.globalAlpha *= a; rr(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36, 34, col); g.restore();
  prop(g, 'card', { x: cx, y: cy, w, h, alpha: a });
}

// ---------- 小道具（畫在 y 500–1290；x≥875、y<480 是主播位置） ----------
function mic(x, by, s, a = 1) {
  // (x, by)＝腳架底；s＝總高
  g.save(); g.globalAlpha *= a;
  g.strokeStyle = INK; g.lineWidth = s * 0.05; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, by); g.lineTo(x, by - s * 0.62); g.stroke();
  g.beginPath(); g.moveTo(x - s * 0.2, by); g.lineTo(x + s * 0.2, by); g.stroke();
  const cy = by - s * 0.78, r = s * 0.12;
  g.fillStyle = '#5A463C'; g.beginPath(); g.ellipse(x, cy, r, r * 1.25, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#C9B7A2'; g.lineWidth = s * 0.012;
  for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(x + i * r * 0.38, cy - r * 0.95); g.lineTo(x + i * r * 0.38, cy + r * 0.95); g.stroke(); }
  g.strokeStyle = INK; g.lineWidth = s * 0.028; g.beginPath(); g.arc(x, cy, r * 1.5, -Math.PI, 0); g.stroke();
  g.restore();
}
function waves(x, y, t, col = TERRA, n = 3, s = 1) {
  for (let k = 0; k < n; k++) {
    const r = (26 + loop(t * 46 + k * 22, 64)) * s;
    g.save(); g.globalAlpha *= 1 - (r / (90 * s)); g.strokeStyle = col; g.lineWidth = 5 * s; g.lineCap = 'round';
    g.beginPath(); g.arc(x, y, r, -0.7, 0.7); g.stroke(); g.restore();
  }
}
function consoleBox(cx, cy, w, h) {
  g.save(); g.shadowColor = 'rgba(59,47,42,0.18)'; g.shadowBlur = 20; g.shadowOffsetY = 7; rr(cx - w / 2, cy - h / 2, w, h, 22, WOOD); g.restore();
  rr(cx - w / 2 + 22, cy - h / 2 + 22, w - 44, h * 0.5, 12, '#7F6248');
  for (let i = 0; i < 4; i++) G.disc(g, cx - w * 0.3 + i * w * 0.2, cy + h * 0.2, h * 0.09, i % 2 ? MUST : CREAM);
  rr(cx - w * 0.36, cy + h * 0.34, w * 0.32, 12, 6, LINE);
}
function door(cx, by, w, h, col = '#B9826A') {
  rr(cx - w / 2 - 14, by - h - 14, w + 28, h + 14, 16, col);
  rr(cx - w / 2, by - h, w, h, 10, '#E8D5B8');
  G.disc(g, cx + w * 0.32, by - h * 0.5, 9, INK);
  rr(cx - w * 0.32, by - h * 0.78, w * 0.64, h * 0.2, 8, '#F3E7D4');
  g.strokeStyle = col; g.lineWidth = 7; g.strokeRect(cx - w * 0.32, by - h * 0.78, w * 0.64, h * 0.2);
  g.beginPath(); g.moveTo(cx, by - h * 0.78); g.lineTo(cx, by - h * 0.58); g.stroke();
}
function clock(cx, cy, r, hh, mm) {
  G.disc(g, cx, cy, r, PAPER); g.strokeStyle = INK; g.lineWidth = r * 0.08; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  const ha = (hh % 12) / 12 * Math.PI * 2 - Math.PI / 2, ma = mm / 60 * Math.PI * 2 - Math.PI / 2;
  g.strokeStyle = INK; g.lineWidth = r * 0.1; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(ha) * r * 0.55, cy + Math.sin(ha) * r * 0.55); g.stroke();
  g.lineWidth = r * 0.07; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(ma) * r * 0.8, cy + Math.sin(ma) * r * 0.8); g.stroke();
  G.disc(g, cx, cy, r * 0.07, TERRA);
}
function book(cx, cy, w, h, title, sub, a = 1, col = '#D9B978') {
  g.save(); g.globalAlpha *= a;
  g.save(); g.shadowColor = 'rgba(59,47,42,0.22)'; g.shadowBlur = 26; g.shadowOffsetY = 10; rr(cx - w / 2, cy - h / 2, w, h, 18, col); g.restore();
  rr(cx - w / 2 + 14, cy - h / 2 + 14, w - 28, h - 28, 12, PAPER);
  rr(cx - 7, cy - h / 2 + 14, 14, h - 28, 5, '#E7D5B6');
  if (title) plain(title, cx - w * 0.16, cy - h * 0.20, 58, INK, { align: 'center', w: 800 });
  if (sub) plain(sub, cx - w * 0.16, cy - h * 0.05, 44, TERRA_D, { align: 'center', w: 800 });
  for (let i = 0; i < 4; i++) rr(cx + w * 0.04, cy - h * 0.16 + i * 42, w * 0.30, 12, 6, LINE);
  g.restore();
}
function stamp(cx, cy, s, text, col, rot = -0.12, a = 1) {
  g.save(); g.translate(cx, cy); g.rotate(rot); g.globalAlpha *= a;
  g.strokeStyle = col; g.lineWidth = 9; g.lineJoin = 'round'; g.strokeRect(-s * 0.9, -s * 0.42, s * 1.8, s * 0.84);
  g.font = ZH(800, s * 0.52); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(text, 0, 4);
  g.restore();
}
function gavel(x, y, s) {
  g.save(); g.translate(x, y); g.rotate(-0.5);
  rr(-s * 0.06, -s * 0.5, s * 0.12, s * 1.0, 8, WOOD);
  rr(-s * 0.42, -s * 0.3, s * 0.84, s * 0.3, 12, '#8A6A55');
  rr(-s * 0.44, -s * 0.3, s * 0.1, s * 0.3, 6, '#6B4F3F');
  g.restore();
}
function bars(x0, y0, w, h, n = 6) {
  rr(x0 - 12, y0, w + 24, 16, 6, INK);
  for (let i = 0; i <= n; i++) rr(x0 + i * w / n - 7, y0, 14, h, 7, SLATE_D);
}
function arrow(x, y, len, dir, col, w = 26) {
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + dir * (len - w)); g.stroke();
  g.beginPath(); g.moveTo(x - w * 1.6, y + dir * (len - w * 1.8)); g.lineTo(x + w * 1.6, y + dir * (len - w * 1.8)); g.lineTo(x, y + dir * (len + w * 0.4)); g.closePath(); g.fill();
}
function island(cx, cy, r, col) {
  g.fillStyle = col; g.beginPath();
  g.ellipse(cx, cy, r, r * 0.42, -0.12, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 0.25; g.beginPath(); g.ellipse(cx + r * 0.1, cy + r * 0.12, r * 0.9, r * 0.3, -0.12, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
}
function gear(cx, cy, r, col, spin) {
  g.save(); g.translate(cx, cy); g.rotate(spin);
  g.fillStyle = col;
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; g.beginPath(); g.arc(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92, r * 0.16, 0, Math.PI * 2); g.fill(); }
  G.disc(g, 0, 0, r * 0.78, col); G.disc(g, 0, 0, r * 0.36, CREAM); g.restore();
}
function table() {
  rr(60, 1120, 960, 34, 14, WOOD);
  rr(80, 1146, 920, GY - 1146, 10, '#C7A77F');
  g.fillStyle = 'rgba(59,47,42,0.08)'; g.fillRect(80, 1146, 920, 18);
}
function tag(x, y, w, text, col, px = 44, a = 1) {
  g.save(); g.globalAlpha *= a; rr(x - w / 2, y - 44, w, 88, 22, col); g.restore();
  plain(text, x, y + 16, px, CREAM, { align: 'center', w: 700 });
}

// ---------- 每張卡 ----------
function c0(lt) {
  // 封面：麥克風前的小人，旁邊一個大問號（鉤子問句）；只有這張有大標。
  // 第 0 幀就是封面（Threads 與沒帶 cover_url 的平台直接用它），所以麥克風與問號從 t=0 就畫滿，不做淡入。
  mic(620, GY, 430);
  waves(680, 780, lt, TERRA, 2, 0.8);
  man(800, GY, 380, COAT, { pose: 'shrug', dir: -1, face: 'worried', tilt: Math.sin(lt * 2.4) * 0.03 });
  prop(g, 'question', { x: 320, y: 790 + Math.sin(lt * 2.2) * 8, s: 180, color: INK });
}
function c1(lt) {
  // 廣播間：麥克風、ON AIR、來賓揮手，泡泡浮出「狼狽為奸」
  const a = pop(lt, 0.1);
  g.save(); g.globalAlpha *= a;
  rr(120, 560, 420, 260, 24, '#C9A27E'); rr(146, 586, 368, 208, 16, '#E9D9C2');
  consoleBox(790, 1080, 300, 190);
  mic(600, GY, 430);
  waves(660, 780, lt, TERRA, 3, 0.9);
  tag(250, 660, 190, 'ON AIR', TERRA, 36);
  g.restore();
  man(820, GY, 380, COAT, { pose: 'armsUp', dir: -1, face: 'smile', tilt: Math.sin(lt * 2.5) * 0.03 });
  const q = pop(lt, 0.55, 0.5);
  if (q > 0) prop(g, 'speech', { x: 300, y: 900, s: 300, w: 130, h: 76, tail: 'right', text: '狼狽為奸', px: 22, stroke: TERRA_D, alpha: q });
}
function c2(lt) {
  // 記者會：講台後的小人、兩支麥、引用卡；左上角廣播燈還亮著
  const a = pop(lt, 0.1);
  man(555, GY, 420, COAT, { pose: 'point', aim: -0.15, face: 'none' });
  g.save(); g.globalAlpha *= a;
  rr(300, 1020, 480, 180, 18, SLATE); rr(330, 1050, 420, 120, 10, '#D9E0E6');
  g.restore();
  mic(465, 1020, 190); mic(655, 1020, 190);
  g.save(); g.globalAlpha *= a; plain('記者會', 540, 1150, 42, SLATE_D, { align: 'center', w: 700 }); g.restore();
  const q = pop(lt, 0.35, 0.6);
  if (q > 0) {
    g.save(); g.globalAlpha *= q;
    rr(76, 600, 380, 240, 26, CREAM); g.strokeStyle = TERRA; g.lineWidth = 8; g.strokeRect(76, 600, 380, 240);
    plain('沒有言論自由？', 266, 690, 46, TERRA_D, { align: 'center', w: 800 });
    plain('他怎麼上得了節目', 266, 760, 38, INK, { align: 'center', w: 600 });
    g.restore();
  }
  g.save(); g.globalAlpha *= a; tag(860, 640, 160, '廣播', SAGE, 34); waves(860, 700, lt, SAGE, 2, 0.7); g.restore();
}
function c3(lt) {
  // 日曆翻回 1991；小人舉「主張」，兩名制服小人靠近
  const a = pop(lt, 0.1), y = 800;
  g.save(); g.globalAlpha *= a;
  rr(150, 560, 380, 380, 24, TERRA); rr(176, 610, 328, 300, 14, PAPER);
  plain('5 月', 340, 680, 40, TERRA_D, { align: 'center', w: 700 });
  fig(String(FACTS.Y1991), 340, 860, INK, 1, 'fig-1991');
  g.restore();
  man(720, GY, 380, MUST, { pose: 'point', aim: -0.1, face: 'worried', dir: 1 });
  g.save(); g.globalAlpha *= pop(lt, 0.4); rr(660, 720, 220, 150, 16, PAPER); g.strokeStyle = MUST_D; g.lineWidth = 8; g.strokeRect(660, 720, 220, 150);
  plain('主張', 770, 815, 54, MUST_D, { align: 'center', w: 800 }); g.restore();
  const p = E.io(inv(0.5, 1.8, lt));
  man(lerp(250, 420, p), GY, 300, SLATE, { pose: 'walk', t: lt, dir: 1, face: 'none' });
  man(lerp(1030, 900, p), GY, 300, SLATE, { pose: 'walk', t: lt, dir: -1, face: 'none' });
}
function c4(lt) {
  // 清晨的宿舍門：時鐘五點、門外兩名調查員
  const a = pop(lt, 0.1);
  g.save(); g.globalAlpha *= a;
  rr(80, 560, 920, 110, 14, '#C9A27E'); rr(110, 590, 860, 60, 8, '#8A6A55');
  door(620, GY, 330, 500, '#8A6A55');
  clock(270, 720, 95, 5, 5);
  plain('05:00', 270, 880, 34, DIM, { align: 'center', w: 600 });
  g.restore();
  const p = E.io(inv(0.2, 1.6, lt));
  man(lerp(180, 390, p), GY, 330, SLATE, { pose: p < 1 ? 'walk' : 'stand', t: lt, dir: 1, face: 'none' });
  man(lerp(900, 760, p), GY, 330, SLATE, { pose: p < 1 ? 'walk' : 'stand', t: lt, dir: -1, face: 'none' });
  g.save(); g.globalAlpha *= pop(lt, 0.8); rr(560, 870, 120, 18, 9, CREAM); g.restore();
}
function c5(lt) {
  // 研究生被帶走，桌上留論文；卷宗封面「獨台會案」
  const p = E.io(inv(0.2, 2.2, lt));
  man(lerp(680, 800, p), GY, 350, MUST, { pose: p > 0 && p < 1 ? 'walk' : 'stand', t: lt, dir: 1, face: 'worried' });
  man(lerp(880, 925, p), GY, 320, SLATE, { pose: p > 0 && p < 1 ? 'walk' : 'stand', t: lt, dir: 1, face: 'none' });
  g.save(); g.globalAlpha *= pop(lt, 0.1);
  rr(70, 1040, 420, 34, 12, WOOD);
  for (let k = 0; k < 3; k++) {
    g.save(); g.translate(180 + k * 16, 980 - k * 20); g.rotate(-0.04 + k * 0.03);
    rr(-80, -60, 190, 120, 8, PAPER); g.strokeStyle = LINE; g.lineWidth = 4;
    for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(-60, -30 + i * 22); g.lineTo(80, -30 + i * 22); g.stroke(); }
    g.restore();
  }
  prop(g, 'document', { x: 610, y: 900, s: 250, title: '獨台會案', titlePx: 11, lines: 3, fill: '#E3BE78', lineColor: '#9A7646' });
  g.restore();
}
function c6(lt) {
  // 刑法一百條：法典上「主張」泡泡被蓋上「叛亂」
  const a = pop(lt, 0.1);
  g.save(); g.globalAlpha *= a;
  book(500, 860, 620, 660, '刑法', `第 ${FACTS.ART100} 條`, 1, '#C9A27E');
  g.restore();
  const q = pop(lt, 0.45, 0.5);
  if (q > 0) prop(g, 'speech', { x: 780, y: 690, s: 250, w: 120, h: 70, tail: 'left', text: '主張', px: 24, stroke: MUST_D, alpha: q });
  stamp(480, 1010, 150, '叛亂', TERRA, -0.16, pop(lt, 1.0, 0.4));
  man(180, GY, 280, COAT, { pose: 'point', aim: -0.2, face: 'none' });
}
function c7(lt) {
  // 法庭：欄杆後三個人、法官敲法槌、日曆十二月
  g.save(); g.globalAlpha *= pop(lt, 0.1);
  rr(120, 620, 260, 220, 18, TERRA); rr(146, 646, 208, 168, 10, PAPER);
  plain('12 月', 250, 740, 46, TERRA_D, { align: 'center', w: 700 });
  g.restore();
  [300, 540, 780].forEach((x, k) => man(x, GY, 330, k === 1 ? MUST : COAT, { pose: 'stand', face: 'worried', shadow: false, tilt: Math.sin(lt * 2 + k) * 0.02 }));
  rr(140, 1020, 800, 22, 11, WOOD); for (let i = 0; i < 7; i++) rr(160 + i * 112, 1042, 16, 228, 8, '#8A6A55');
  stamp(820, 700, 128, '判決', TERRA, 0.1, pop(lt, 0.5));
  gavel(210, 1150, 170); rr(150, 1192, 130, 26, 10, WOOD);
}
function c8(lt) {
  // 隔年五月修法：新頁把「強暴」「脅迫」放大分兩行圈住，手機上一眼讀得出來
  const a = pop(lt, 0.1);
  g.save(); g.globalAlpha *= a;
  framed(500, 880, 660, 620, '#B7C7A8');
  plain(`刑法第 ${FACTS.ART100} 條`, 500, 668, 46, INK, { align: 'center', w: 800 });
  g.restore();
  tag(858, 690, 150, String(FACTS.Y1992), SAGE_D, 34, pop(lt, 0.3));
  const q = pop(lt, 0.4, 0.5);
  if (q > 0) {
    g.save(); g.globalAlpha *= q;
    g.strokeStyle = TERRA; g.lineWidth = 12; g.lineJoin = 'round';
    g.beginPath(); g.ellipse(500, 885, 212, 158, -0.02, 0, Math.PI * 2 * q); g.stroke();
    plain('強暴', 500, 848, 96, TERRA_D, { align: 'center', w: 800 });
    plain('脅迫', 500, 966, 96, TERRA_D, { align: 'center', w: 800 });

// head：卡名。只有封面（第 0 卡）畫成大標，其他卡不畫。

// ---------- 頂部系列標籤 ----------

// ---------- 字幕：一卡一個逗號短語，關鍵詞陶土紅，上方一條短橫線 ----------
function caption(t) {

  const p = PH[j], hl = CARDS[p.card].hl || [];

  g.font = ZH(700, px);
  const rows = g.measureText(p.text).width <= maxW ? [p.text] : [p.text.slice(0, Math.ceil(p.text.length / 2)), p.text.slice(Math.ceil(p.text.length / 2))];
  const y0 = 1400 - (rows.length - 1) * 36;

  rows.forEach((r, k) => rich(r, 540, y0 + k * 74, px, hl));
}
function rich(s, cx, y, px, hl) {
  const mark = Array(s.length).fill(false);
  for (const w of hl) { let i = s.indexOf(w); while (i >= 0) { for (let k = 0; k < w.length; k++) mark[i + k] = true; i = s.indexOf(w, i + 1); } }
  g.font = ZH(700, px); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let x = cx - g.measureText(s).width / 2;
  for (let k = 0; k < s.length; k++) { g.fillStyle = mark[k] ? TERRA : INK; g.fillText(s[k], x, y); x += g.measureText(s[k]).width; }
}

}

// ---------- 主迴圈 ----------
const XF = 0.5;
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H });
function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  if (t >= END0) {
    const k = E.io(inv(END0, END0 + XF, t));

    return finish(t);

  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}

}
