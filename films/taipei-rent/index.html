<script type="module">
// 單人旁白科普：一句一卡（TREATMENT.md 分鏡表），Clawd Bot 當主播站右上。照 films/pedestrian-hell 第三版（6cf2cc3）的框架：
// 換卡原地交叉淡化 0.6 秒、不滑入、不換底色、沒有章名全屏卡、沒有換卡音效、沒有懶人包卡。
// 兩種主張同色同尺寸、同樣的標籤樣式與代價構圖，不用配色暗示立場（TREATMENT.md 禁止清單）。
// 所有動作都是 t 的封閉式（seek_check.mjs 會比亂序算出的同一幀）；循環用取餘數，不累積。
import { poseAt, applyPose } from './mascot/clawd-bot-shot.mjs';
const G = window.G, E = G.E, TL = window.TL, W = 1080, H = 1920;
const g = document.getElementById('c').getContext('2d', { alpha: false });
const { clamp, inv, lerp, mix, rgba } = G;

const BG = '#1d1b19', BG2 = '#262320', CREAM = '#f5efe6', DIM = '#a39a8e', OR = '#d97757', ORL = '#f29172', GOLD = '#f6b966', RED = '#ff8577', GREEN = '#68e399', BLUE = '#7fa7d9';
const ROAD = '#3b3733', WALK = '#5b544c', CURB = '#8a8177';
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`, MONO = (px, w = 500) => `${w} ${px}px Menlo, "PingFang TC"`;

// 會出現在畫面上的事實數字集中在這裡，不要在別處重寫一次。每一個都要在 meta/facts.md 有一行附來源。
const FACTS = {
  PRICE_INCOME_RATIO: 15.41, // 台北房價所得比（內政部 2025 Q2）
  RENT_YEAR: 2025,           // 租金統計年（2025 下半年，租補有效租約）
  TPE_RENT_MEDIAN: 12500,    // 台北租補租約月租中位數
  SOCIAL_RENT_DISCOUNT: 85,  // 社宅租金最多行情 85 折
  TPE_SOCIAL_PCT_MAX: 3,     // 社宅占住宅不到 3%
  TPE_SOCIAL_GOAL_PCT: 5,    // 市府目標 5%
  VIE_SHARE_PCT: 60,         // 維也納 60% 以上人口住市府或補貼住宅
  VIE_LEVY_PCT: 1.5,         // 住宅建設補助費，勞資合計
  VIE_LEVY_EACH: 0.75,       // 勞資各 0.75%
  VIE_LEVY_YEAR: 2026,       // 2026-01-01 起
  TPE_NEXT_BATCH: 7041,      // 下階段優先推動戶數（旁白念七千多戶）
  SUBSIDY_STOP_YEAR: 2028,   // 中央草案停止非自償補助年
  FUNDING_GAP_YI: 64,        // 市府估缺口（億元）
};
// ---------- 字 ----------
let TXT = [], NOW = 0;
function say(s, x, y, px, col, p, o = {}) {
  const font = o.mono ? MONO(px) : ZH(o.w || 600, px);
  // 原地淡入，不往上滑（使用者 10-30：頻繁滑入眼睛不舒服；對標 @boundless__explorer DemDuhNk1ZR 全片無滑入）
  g.save(); g.font = font; g.letterSpacing = o.ls || '0px'; g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  const w = g.measureText(s).width;
  g.globalAlpha *= E.io(p); g.fillStyle = col; g.fillText(s, x, y); g.restore();
  if (o.id) {
    const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    TXT.push({ id: o.id, text: s, x0, y0: y - px, x1: x0 + w, y1: y + px * 0.25, screen: true });
  }
  return w;
}
function plain(s, x, y, px, col, o = {}) {
  g.font = o.mono ? MONO(px, o.w || 500) : ZH(o.w || 600, px); g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.letterSpacing = o.ls || '0px'; g.fillStyle = col; g.fillText(s, x, y); g.letterSpacing = '0px';
}
const pop = (lt, a, d = 0.5) => E.o3(inv(a, a + d, lt));   // 不用回彈（語氣沉穩）
const loop = (x, n) => ((x % n) + n) % n;

// ---------- 舞台：y 800–1630 的圓角框，框內畫什麼都裁在裡面 ----------
const ST = { x: 60, y: 800, w: 960, h: 830 };
function stage(fn) {
  g.save(); g.beginPath(); g.roundRect(ST.x, ST.y, ST.w, ST.h, 28); g.clip();
  g.fillStyle = BG2; g.fillRect(ST.x, ST.y, ST.w, ST.h);
  fn(); g.restore();
  g.strokeStyle = rgba(CREAM, 0.16); g.lineWidth = 2; g.beginPath(); g.roundRect(ST.x, ST.y, ST.w, ST.h, 28); g.stroke();
}
function cam(px, py, k, fn) { g.save(); g.translate(px, py); g.scale(k, k); g.translate(-px, -py); fn(); g.restore(); }
// ---------- 圖形零件 ----------
const fmt = n => Math.round(n).toLocaleString('en-US');
function person(x, y, s, col, o = {}) {   // 側視人形，原點＝腳底，s＝身高；o.bag 背包色、o.box 抱紙箱、o.ph 走路相位、o.still 不擺腿
  const ph = o.ph ?? (NOW * 3 + x * 0.01), still = !!o.still;
  y -= still ? 0 : s * 0.012 * Math.abs(Math.sin(ph));
  g.save(); g.translate(x, y);
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = s * 0.1;
  const sw = still ? 0.12 : Math.sin(ph) * 0.35;
  g.beginPath(); g.moveTo(0, -s * 0.42); g.lineTo(Math.sin(sw) * s * 0.42, 0); g.moveTo(0, -s * 0.42); g.lineTo(-Math.sin(sw) * s * 0.42, 0); g.stroke();
  g.fillStyle = col; g.beginPath(); g.roundRect(-s * 0.15, -s * 0.78, s * 0.3, s * 0.42, s * 0.1); g.fill();
  G.disc(g, 0, -s * 0.88, s * 0.11, col);
  if (o.bag) { g.fillStyle = o.bag; g.beginPath(); g.roundRect(-s * 0.3, -s * 0.74, s * 0.17, s * 0.28, s * 0.05); g.fill(); }
  if (o.box) box(s * 0.28, -s * 0.48, s * 0.36, o.box);
  g.restore();
}
function box(x, y, s, col = '#c79a5b') {   // 搬家紙箱（中心點 x,y）
  g.fillStyle = col; g.fillRect(x - s / 2, y - s / 2, s, s * 0.8);
  g.fillStyle = rgba(BG, 0.35); g.fillRect(x - s * 0.06, y - s / 2, s * 0.12, s * 0.8);
  g.strokeStyle = rgba(BG, 0.5); g.lineWidth = 3; g.strokeRect(x - s / 2, y - s / 2, s, s * 0.8);
}
// 建築線稿：底邊中心 (x, base)，寬 w 高 h；o.col 外框色、o.fill 底色、o.lit 0–1 窗戶亮的比例、o.hi 被標記的樓層（Set）、o.hiCol
function bldg(x, base, w, h, o = {}) {
  const col = o.col || rgba(CREAM, 0.7), fl = Math.max(1, Math.round(h / 70)), fh = h / fl, cols = Math.max(2, Math.round(w / 60));
  g.fillStyle = o.fill || '#2c2926'; g.fillRect(x - w / 2, base - h, w, h);
  for (let f = 0; f < fl; f++) {
    const hiF = o.hi && o.hi.has(f);
    if (hiF) { g.fillStyle = rgba(o.hiCol || GOLD, 0.35); g.fillRect(x - w / 2, base - (f + 1) * fh, w, fh); }
    for (let c = 0; c < cols; c++) {
      const wx = x - w / 2 + (c + 0.25) * w / cols, wy = base - (f + 1) * fh + fh * 0.25, idx = (f * 7 + c * 3) % 10;
      g.fillStyle = hiF ? (o.hiCol || GOLD) : idx < (o.lit ?? 0) * 10 ? rgba(GOLD, 0.85) : rgba(CREAM, 0.16);
      g.fillRect(wx, wy, w / cols * 0.5, fh * 0.45);
    }
  }
  g.strokeStyle = col; g.lineWidth = 4; g.strokeRect(x - w / 2, base - h, w, h);
}
function house(x, base, s, col = CREAM, lit = 0) {   // 小房子圖示（底邊中心）
  g.fillStyle = col; g.fillRect(x - s / 2, base - s * 0.55, s, s * 0.55);
  G.poly(g, [[x - s * 0.62, base - s * 0.53], [x, base - s], [x + s * 0.62, base - s * 0.53]], col);
  g.fillStyle = lit ? mix(BG, GOLD, lit) : BG; g.fillRect(x - s * 0.12, base - s * 0.32, s * 0.24, s * 0.32);
}
function tag(x, y, s, col, p = 1, px = 40) {   // 圓角價格牌／標籤（中心 x，基線 y）
  if (p <= 0) return;
  g.save(); g.globalAlpha *= clamp(p * 2);
  g.font = ZH(700, px); const w = g.measureText(s).width + px * 1.1;
  g.fillStyle = rgba(BG, 0.85); g.strokeStyle = col; g.lineWidth = 4;
  g.beginPath(); g.roundRect(x - w / 2, y - px * 1.05, w, px * 1.6, px * 0.8); g.fill(); g.stroke();
  plain(s, x, y, px, col, { align: 'center', w: 700 });
  g.restore();
}
function chip(x, y, s, p = 1) { tag(x, y, s, GOLD, p, 46); }   // 兩種主張共用的標籤樣式（同色同大小）
function stamp(x, y, s, col, p, rot = -0.14, px = 88) {
  if (p <= 0) return;
  const k = 1 + 0.25 * (1 - E.o3(p));
  g.save(); g.translate(x, y); g.scale(k, k); g.rotate(rot); g.globalAlpha = clamp(p * 4);
  g.font = ZH(800, px); const w = g.measureText(s).width + 80;
  g.lineWidth = 10; g.strokeStyle = col; g.strokeRect(-w / 2, -px * 0.95, w, px * 1.5);
  plain(s, 0, px * 0.35, px, col, { align: 'center', w: 800 });
  g.restore();
}
function coin(x, y, r, col = GOLD) { G.disc(g, x, y, r, col); G.ring(g, x, y, r * 0.7, Math.max(2, r * 0.12), rgba(BG, 0.35)); }
function street(base) { g.fillStyle = '#2c2926'; g.fillRect(ST.x, base, ST.w, ST.y + ST.h - base); g.fillStyle = rgba(CREAM, 0.25); g.fillRect(ST.x, base, ST.w, 4); }

// ---------- 每張卡的舞台 ----------
// 鉤子：租屋 App 往上滑，每一格的價格牌都是紅的
function hookList(lt) {
  stage(() => {
    const px = 300, py = 830, pw = 480, ph = 770;
    g.fillStyle = '#111'; g.beginPath(); g.roundRect(px - 16, py - 16, pw + 32, ph + 32, 48); g.fill();
    g.save(); g.beginPath(); g.roundRect(px, py, pw, ph, 34); g.clip();
    g.fillStyle = '#24211e'; g.fillRect(px, py, pw, ph);
    const rh = 170, off = lt * 70, j0 = Math.floor(off / rh);
    for (let j = j0; j < j0 + 6; j++) {
      const y = py + 20 + j * rh - off;
      g.fillStyle = '#34302c'; g.beginPath(); g.roundRect(px + 18, y, pw - 36, rh - 24, 18); g.fill();
      house(px + 90, y + 112, 80, rgba(CREAM, 0.55));
      g.fillStyle = rgba(CREAM, 0.3); g.fillRect(px + 150, y + 30, 150 + (j * 37) % 90, 16); g.fillRect(px + 150, y + 62, 110 + (j * 53) % 70, 12);
      tag(px + 360, y + 120, '$$$ ↑', RED, 1, 34);
    }
    g.restore();
  });
}
// 鉤子：一整排房子，價格牌都紅，只有零星一間是租得起的
function fewHomes(lt) {
  stage(() => {
    street(1500);
    for (let j = 0; j < 12; j++) {
      const x = 150 + (j % 6) * 156, base = j < 6 ? 1150 : 1480, k = pop(lt, 0.05 * j, 0.4);
      if (k <= 0) continue;
      g.globalAlpha = k;
      const ok = j === 8;
      house(x, base, 120, ok ? GOLD : rgba(CREAM, 0.45));
      tag(x, base - 150, ok ? '租得起' : '$$$', ok ? GOLD : RED, ok ? pop(lt, 1.2) : 1, 28);
      g.globalAlpha = 1;
    }
  });
}
// 機制：一年收入一格，房子要疊到 15.4 格
function priceIncome(lt) {
  stage(() => {
    const base = 1560, u = 42, gap = 4, r = FACTS.PRICE_INCOME_RATIO;
    // 左：家庭一年收入
    g.fillStyle = GREEN_N; g.fillRect(200, base - u, 200, u - gap);
    person(260, base - u - 10, 120, CREAM, { still: true }); person(340, base - u - 10, 100, ORL, { still: true });
    plain('一年收入', 300, base + 50, 36, CREAM, { align: 'center' });
    // 右：房價，一格一格往上疊
    const n = r * E.io(inv(0.3, 2.6, lt));
    for (let j = 0; j < Math.ceil(n); j++) {
      const f = clamp(n - j);
      g.fillStyle = j < 15 ? OR : ORL; g.fillRect(640, base - (j + 1) * u + (u - gap) * (1 - f), 200, (u - gap) * f);
    }
    house(740, base - n * u - 10, 120, CREAM);
    plain('房價', 740, base + 50, 36, CREAM, { align: 'center' });
    plain(`${n.toFixed(1)}×`, 610, base - n * u + 40, 56, GOLD, { mono: true, align: 'right', w: 700 });
  });
}
const GREEN_N = '#9bbf8a';   // 收入用的低彩度綠（只用在收入格，不是任何陣營色）
// 機制：一家人走向「租」字門口，年份一直翻
function rentForever(lt) {
  stage(() => {
    street(1500);
    bldg(780, 1500, 300, 560, { lit: 0.3 });
    g.fillStyle = BG; g.fillRect(740, 1380, 80, 120);
    tag(780, 1350, '租', GOLD, 1, 40);
    const x = lerp(220, 560, E.io(inv(0.2, 2.6, lt)));
    person(x, 1500, 220, CREAM, { ph: lt * 3 }); person(x - 110, 1500, 190, ORL, { ph: lt * 3 + 1.4 }); person(x - 190, 1500, 120, GOLD, { ph: lt * 3 + 0.6 });
    const yr = 1 + Math.floor(loop(lt * 1.6, 9));
    g.fillStyle = CREAM; g.beginPath(); g.roundRect(150, 880, 210, 200, 18); g.fill();
    g.fillStyle = OR; g.fillRect(150, 880, 210, 50);
    plain(`第 ${yr} 年`, 255, 1030, 54, BG, { align: 'center', w: 800 });
  });
}
// 機制：台北領租補的房客，各自的月租由低到高排；split>0 從中間切開，右半邊亮起
function rentBars(lt, split = 0) {
  stage(() => {
    const n = 20, x0 = 130, w = 820, base = 1500, k = split ? 1 : E.o2(inv(0.2, 2.2, lt));
    for (let j = 0; j < n; j++) {
      const x = x0 + (j + 0.5) * w / n, h = 140 + 520 * Math.pow(j / (n - 1), 1.6), show = clamp(k * n - j);
      if (show <= 0) continue;
      const hot = split && j >= n / 2;
      g.globalAlpha = show;
      g.fillStyle = hot ? mix(rgba(CREAM, 0.35), GOLD, split) : rgba(CREAM, 0.35); g.fillRect(x - 14, base - h * show, 28, h * show);
      person(x, base + 110, 70, hot ? mix(CREAM, GOLD, split) : DIM, { still: true });
      g.globalAlpha = 1;
    }
    if (split) {
      const xm = x0 + w / 2, q = E.o3(split);
      g.setLineDash([14, 12]); G.seg(g, [xm, 860], [xm, base + 120], 5, rgba(GOLD, q)); g.setLineDash([]);
      g.globalAlpha = q; plain(`≥ ${fmt(FACTS.TPE_RENT_MEDIAN)}`, x0 + w * 0.75, 900, 52, GOLD, { mono: true, align: 'center', w: 700 }); g.globalAlpha = 1;
      plain('一半', x0 + w * 0.25, 900, 44, DIM, { align: 'center' });
    } else plain('每月房租', 130, 880, 34, DIM);
  });
}
// 機制：一排行情房子裡，中間一棟是社宅
function socialBldg(lt) {
  stage(() => {
    street(1500);
    const xs = [170, 340, 540, 740, 910], hs = [420, 520, 600, 480, 380];
    xs.forEach((x, j) => bldg(x, 1500, j === 2 ? 210 : 150, hs[j], j === 2 ? { col: GOLD, fill: mix('#2c2926', GOLD, 0.12 * pop(lt, 0.3)), lit: 0.6 } : { lit: 0.2 }));
    tag(540, 860, '社宅', GOLD, pop(lt, 0.4), 44);
  });
}
// 機制：行情 vs 社宅，社宅那根縮到 85%
function discount(lt) {
  stage(() => {
    const base = 1500, H0 = 560, k = E.io(inv(0.3, 1.8, lt)), d = FACTS.SOCIAL_RENT_DISCOUNT / 100;
    g.fillStyle = rgba(CREAM, 0.4); g.fillRect(230, base - H0, 220, H0);
    g.fillStyle = GOLD; const h2 = H0 * lerp(1, d, k); g.fillRect(630, base - h2, 220, h2);
    G.seg(g, [600, base - H0], [880, base - H0], 3, rgba(CREAM, 0.4));
    plain('附近行情', 340, base + 60, 40, CREAM, { align: 'center' });
    plain('社宅', 740, base + 60, 40, GOLD, { align: 'center' });
    plain(`${Math.round(lerp(100, FACTS.SOCIAL_RENT_DISCOUNT, k))}%`, 740, base - h2 - 30, 64, GOLD, { mono: true, align: 'center', w: 700 });
    plain('100%', 340, base - H0 - 30, 48, DIM, { mono: true, align: 'center' });
  });
}
// 機制：100 間房子的方陣；社宅不到 3 間；goal>0 再描出 5 間的虛線框
function grid100(lt, goal = 0) {
  stage(() => {
    const s = 74, x0 = 540 - s * 5, y0 = 845, now = FACTS.TPE_SOCIAL_PCT_MAX - 0.4;   // 「不到三間」畫成 2.6 間
    const fillK = goal ? 1 : E.o2(inv(0.2, 1.6, lt));
    for (let i = 0; i < 100; i++) {
      const cx = x0 + (i % 10) * s + s / 2, cy = y0 + Math.floor(i / 10) * s + s / 2;
      const f = clamp((now * fillK) - i);
      house(cx, cy + s * 0.38, s * 0.7, rgba(CREAM, 0.22));
      if (f > 0) { g.save(); g.beginPath(); g.rect(cx - s / 2, cy - s / 2, s * f, s); g.clip(); house(cx, cy + s * 0.38, s * 0.7, GOLD); g.restore(); }
      if (goal && i < FACTS.TPE_SOCIAL_GOAL_PCT) {
        const q = clamp(goal * FACTS.TPE_SOCIAL_GOAL_PCT - i);
        if (q > 0) { g.setLineDash([8, 7]); g.strokeStyle = rgba(GOLD, q); g.lineWidth = 4; g.strokeRect(cx - s / 2 + 4, cy - s / 2 + 4, s - 8, s - 8); g.setLineDash([]); }
      }
    }
  });
}
// 轉折：維也納（示意：多瑙河穿過城市）
function vienna(lt) {
  const z = lerp(0.9, 1.1, E.io(inv(0, 3, lt)));
  stage(() => cam(540, 1215, z, () => {
    g.fillStyle = '#34302c'; g.fillRect(-200, 600, 1500, 1300);
    g.strokeStyle = rgba(BLUE, 0.55); g.lineWidth = 46; g.beginPath();
    for (let x = -100; x <= 1200; x += 20) { const y = 1000 + x * 0.35 + 50 * Math.sin(x / 160); x === -100 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
    plain('多瑙河', 860, 1430, 32, BLUE, { align: 'center' });
    const k = pop(lt, 0.4);
    if (k > 0) { g.globalAlpha = 0.35; G.disc(g, 470, 1180, 80 * k + 12 * Math.sin(lt * 3), OR); g.globalAlpha = 1; G.disc(g, 470, 1180, 24 * k, OR); plain('維也納', 470, 1320, 60, CREAM, { align: 'center', w: 700 }); plain('奧地利', 470, 1380, 34, DIM, { align: 'center' }); }
  }));
}
// 轉折：10 個人裡 6 個以上住進兩種房子（人口比例）
function viennaPeople(lt) {
  stage(() => {
    street(1500);
    bldg(300, 1500, 300, 460, { col: OR, lit: 0.5 }); bldg(780, 1500, 300, 400, { col: GOLD, lit: 0.5 });
    plain('市府蓋', 300, 1000, 40, OR, { align: 'center' }); plain('補貼蓋', 780, 1060, 40, GOLD, { align: 'center' });
    for (let j = 0; j < 10; j++) {
      const inside = j < 6, k = E.io(inv(0.4 + j * 0.08, 1.8 + j * 0.08, lt));
      const xa = 140 + j * 88, xb = j < 3 ? 220 + j * 80 : 620 + (j - 3) * 80;
      const x = inside ? lerp(xa, xb, k) : xa, y = 1610;
      person(x, y, 90, inside ? CREAM : DIM, { ph: lt * 3 + j });
    }
    plain(`${FACTS.VIE_SHARE_PCT}%+`, 540, 900, 72, CREAM, { mono: true, align: 'center', w: 700 });
  });
}
// 轉折：補貼蓋的房租＝各項成本加起來（SOURCES 第 8、16 列：土地、蓋房、貸款、管理、修繕）
function costRent(lt) {

function caption(t) {
  const L = TL.lines.find(l => t >= l.t0 - 0.1 && t < l.t1 + 0.2);
  if (!L) return;
  const s = L.text.replace(/[。！]$/, ''), px = 42, maxW = 1000;

  const segs = s.match(/[^，、；：]+[，、；：]?/g), rows = [];
  let cur = '';
  for (const sg of segs) {
    if (fits(cur + sg)) { cur += sg; continue; }
    if (cur) rows.push(cur);
    cur = '';
    for (const ch of sg) { if (!fits(cur + ch)) { rows.push(cur); cur = ''; } cur += ch; }
  }
  if (cur) rows.push(cur);
  const h = 50 + rows.length * 58;
  g.fillStyle = '#0f0e0d'; g.fillRect(0, 1880 - h, W, h);

  const i = cardAt(t), lt = t - T0[i];
  const k = i && lt < XF ? E.io(lt / XF) : 1;
  if (k < 1) { drawCard(i - 1, t); snap.getContext('2d').drawImage(g.canvas, 0, 0); TXT = []; }
  drawCard(i, t);
  if (k < 1) { g.globalAlpha = 1 - k; g.drawImage(snap, 0, 0); g.globalAlpha = 1; }
  return finish(t);
}
function drawCard(i, t) {
  const cd = CARDS[i], lt = t - T0[i];
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  band(t);
  plain('台北議題 · 居住', 60, 186, 30, DIM, { mono: true, ls: '4px' });
  const ch = CHAP[TL.lines[i].section]; if (ch === undefined) throw new Error(`段名 ${TL.lines[i].section} 沒有章名`);
  if (ch) plain(ch, 60, 246, 44, CREAM, { w: 600 });
  // 進度條按章分組，章與章之間空一格
  let gx = 60;
  for (let j = 0; j < N; j++) {
    if (j && CHAP[TL.lines[j].section] !== CHAP[TL.lines[j - 1].section]) gx += 14;
    g.fillStyle = j <= i ? OR : rgba(CREAM, 0.2); g.fillRect(gx, 276, 14, j === i ? 10 : 5); gx += 20;
  }
  // 大標＝這一段的主題，同主題連續幾張卡共用、不重播動畫（短句卡也讀得完）；副標＝這張卡的關鍵詞。
  // 第 0 卡第 0 幀就完整顯示（封面）。
  let gi = i; while (gi > 0 && CARDS[gi - 1].head === cd.head) gi--;
  const glt = t - T0[gi];
  const pin = i === 0 ? () => 1 : (a, b) => inv(a, b, lt);
  const big = cd.head.length > 6 ? 120 : cd.head.length > 4 ? 150 : 180, hy = 330 + big * 0.86 + 60;
  say(cd.head, 60, hy, big, CREAM, i === 0 ? 1 : inv(0.05, 0.6, glt), { id: 'head' + (gi + 1) });
  if (cd.sub) say(cd.sub, 64, hy + 110, 68, ORL, pin(0.15, 0.7), { id: 'sub' + (i + 1) });
  if (cd.tag) say(cd.tag, 64, hy + 190, 46, GOLD, pin(0.3, 0.85), { id: 'tag' + (i + 1) });
  plain(`來源｜${cd.hud}`, 60, 1690, 30, DIM, { mono: true });

}
function finish(t) {
  caption(t);
  poseHost(t);
  const fade = t > DUR - 0.6 ? inv(DUR - 0.6, DUR, t) : 0;
  if (fade) { g.globalAlpha = fade; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  // 主播畫進 canvas：DOM SVG 疊層的合成結果會受上一幀影響，尋幀一致過不了
  const tok = ++mascotTok, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(ROOT));
  return img.decode().then(() => {
    if (tok !== mascotTok) return;   // 已經畫下一幀了，舊圖不能蓋上去
    g.globalAlpha = 1 - fade; g.drawImage(img, 730, 60, 340, 340); g.globalAlpha = 1;
  });
}
let mascotTok = 0;

// ---------- 對外契約 ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = TL.lines.map(l => ({ t0: l.t0, t1: l.t1, text: l.text }));
window.SHAKES = [];
window.EV = (() => {
  const e = [{ t: 0, type: 'bed', len: DUR }];
  // 不加任何音效：換卡「登」一聲使用者 10-30 嫌吵拿掉，只留配樂
  return e.sort((a, b) => a.t - b.t);
})();
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));

// 字型：這段程式碼本身就含畫面上所有字（卡片、標籤、圖表字），整段拿去預載
const allText = document.querySelector('script[type=module]').textContent + TL.lines.map(l => l.text).join('') + '0123456789';
await Promise.all([document.fonts.load(ZH(600, 180), allText), document.fonts.load(ZH(500, 42), allText), document.fonts.load(ZH(700, 46), allText), document.fonts.load(MONO(30), allText)]);
await document.fonts.ready;
for (let i = 0; i < N; i++) render(T0[i] + 0.6);
render(0);
window.READY = true;
</script>
