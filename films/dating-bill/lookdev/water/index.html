<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#f1e9da;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script>
// 樣張：錨點卡（watercolor 文法：十個筆刷小人逐筆畫上，手寫註記）。ponytail: 只畫一張卡。
const c = document.getElementById('c').getContext('2d'), CW = 1080, CH = 1920;
const WSERIF = '"LiSong Pro"', WHAND = '"Yuppy TC"', WINK = '#3b2f28';
const WROSE = '#c8607a', WOCHRE = '#d39a3a', WGREY = '#b9ad9c';
let PAPIMG, WFIGS;
// 一個人：頭（短圓弧兩筆）＋身體（由肩往下的寬筆）
function person(x, y, col) {
  return withSeed(Math.round(x * 7 + y), () => {
    const L = [];
    for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2; L.push(mk(qcurve(x, y - 118, x + Math.cos(a) * 22, y - 118 + Math.sin(a) * 22, 4, 6), 26, col, { prof: 'leaf', nb: 0, a: .55 })); }
    L.push(mk(qcurve(x, y - 92, x, y + 20, rnd(-6, 6), 12), 62, col, { prof: 'brush', a: .8 }));
    L.push(mk(qcurve(x - 34, y - 70, x - 44, y + 0, 4, 8), 16, col, { prof: 'tip', a: .7 }));
    L.push(mk(qcurve(x + 34, y - 70, x + 44, y + 0, -4, 8), 16, col, { prof: 'tip', a: .7 }));
    return L;
  });
}
function hand(text, x, y, size, col, p) {
  c.save(); c.font = `400 ${size}px ${WHAND}`; const w = c.measureText(text).width;
  c.beginPath(); c.rect(x - 4, y - size, (w + 8) * Math.max(0, Math.min(1, p)), size * 1.4); c.clip();
  c.fillStyle = 'rgba(241,233,218,.8)'; c.fillText(text, x + 1, y + 1); c.fillStyle = col; c.fillText(text, x, y); c.restore();
}
window.render = (t) => {
  c.drawImage(PAPIMG, 0, 0);
  c.fillStyle = WINK; c.font = `500 26px Menlo`; c.letterSpacing = '6px'; c.fillText('2013 · 臺北市 · 25–49 歲未婚女性', 90, 300); c.letterSpacing = '0px';
  c.font = `400 72px ${WSERIF}`; c.fillText('為什麼還沒結婚？', 90, 410);
  // 十個人，一個接一個畫上
  WFIGS.forEach((L, i) => drawList(c, L, (t - 0.3 - i * 0.18) / 0.6));
  // 用一抹淡彩把前六人圈起來
  const pw = Math.max(0, Math.min(1, (t - 2.4) / 0.6));
  hand('六成  還沒遇到適合的人', 90, 1290, 64, '#8e3048', (t - 2.6) / 0.8);
  hand('一成  經濟因素', 90, 1400, 56, '#9a6a1c', (t - 3.2) / 0.6);
  c.font = `italic 400 40px ${WSERIF}`; c.fillStyle = 'rgba(59,47,40,.85)'; c.textAlign = 'center';
  c.fillText('六成說還沒遇到適合的人，', CW / 2, 1770); c.fillText('說經濟因素的是一成。', CW / 2, 1830); c.textAlign = 'left';
};
(async () => {
  PAPIMG = new Image(); PAPIMG.src = 'paper.jpg'; await PAPIMG.decode();
  await Promise.all([`400 40px ${WHAND}`, `400 40px ${WSERIF}`].map((f) => document.fonts.load(f, '六成還')));
  WFIGS = [];
  for (let i = 0; i < 10; i++) {
    const x = 160 + (i % 5) * 190, y = 700 + Math.floor(i / 5) * 290;
    WFIGS.push(person(x, y, i < 6 ? WROSE : i === 6 ? WOCHRE : WGREY));
  }
  render(0); window.READY = true;
})();
</script></body></html>
