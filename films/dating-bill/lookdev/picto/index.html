<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script>
// 樣張：錨點卡（pictogram-motion 文法，1080×1920）。ponytail: 只畫一張卡，正式片要接 edl／scenes。
const G = window.G, E = G.E, W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
G.PAL.rose = { name: 'Rose', t: ['#7a2340', '#93304f', '#b4466a', '#c8668a', '#dc8ea9'], fg: G.CREAM, dim: '#f3c9d7', deep: '#5a1730' };
const ZH = (w, px) => `${w} ${px}px "PingFang TC"`, MONO = (px) => `500 ${px}px Menlo`;
G.F.zh = ZH;
const P = G.PAL.rose, T = P.t, ACC = '#f2b33d';
// 極簡人形（ISOTYPE 式）：圓頭＋圓肩身塊，不畫四肢。原點＝髖部，s≈身高。
function figure(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 260, s / 260); ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(0, -108, 30, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-48, -66, 96, 183, [48, 48, 12, 12]); ctx.fill();
  ctx.restore();
}
window.render = (t) => {
  const u = t / 0.4;                                      // 150 BPM 拍數
  ctx.fillStyle = T[1]; ctx.fillRect(0, 0, W, H);
  // 上方圖案帶：兩行，整行錯位
  const pat = G.pattern('rose', 7, { spread: 0.55, density: 0.5, cell: 180 });
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 360); ctx.clip();
  G.drawPattern(ctx, pat, (r) => (r % 2 ? 1 : -1) * 90 * E.ioExp(G.inv(0, 1, u % 4)), { cell: 180 });
  ctx.restore();
  // HUD
  ctx.fillStyle = G.CREAM; ctx.font = MONO(24); ctx.letterSpacing = '4px';
  ctx.fillText('02 / 10', 60, 420); ctx.textAlign = 'right'; ctx.fillText('2013 · 臺北市', W - 60, 420); ctx.textAlign = 'left';
  for (let i = 0; i < 10; i++) { ctx.fillStyle = i < 2 ? G.CREAM : G.rgba(G.CREAM, i === 1 ? 1 : 0.25); ctx.fillRect(60 + i * 30, 440, 20, i === 1 ? 14 : 6); }
  // 標題
  G.maskText(ctx, '六成', 60, 700, ZH(600, 250), G.CREAM, G.inv(0, 1.2, u));
  G.maskText(ctx, '還沒遇到適合的人', 66, 800, ZH(600, 66), P.dim, G.inv(0.3, 1.5, u));
  G.maskText(ctx, '一成 · 經濟因素', 66, 890, ZH(600, 50), ACC, G.inv(0.6, 1.8, u));
  // 十人陣列：6 亮、1 金、3 暗；逐拍上場
  for (let i = 0; i < 10; i++) {
    const cx = 150 + (i % 5) * 195, cy = 1020 + Math.floor(i / 5) * 330;
    const k = E.oExp(G.inv(1 + i * 0.25, 1.6 + i * 0.25, u));
    if (k <= 0) continue;
    const col = i < 6 ? G.CREAM : i === 6 ? ACC : G.mix(G.CREAM, T[1], 0.6);
    figure(cx, cy + 40 + (1 - k) * 40, 260, col);
  }
  ctx.fillStyle = G.CREAM; ctx.font = MONO(22); ctx.fillText('25–49 歲未婚女性 · 婦女婚育與就業調查', 60, 1690);
  // 字幕條
  ctx.fillStyle = T[0]; ctx.fillRect(0, 1730, W, 130);
  ctx.fillStyle = G.CREAM; ctx.font = ZH(500, 40); ctx.textAlign = 'center';
  ctx.fillText('六成說還沒遇到適合的人，說經濟因素的是一成。', W / 2, 1808); ctx.textAlign = 'left';
};
document.fonts.load('600 40px "PingFang TC"', '六成').then(() => { render(0); window.READY = true; });
</script></body></html>
